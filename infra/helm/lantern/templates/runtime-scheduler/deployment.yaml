apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lantern.fullname" . }}-runtime-scheduler
  labels:
    {{- include "lantern.componentLabels" (dict "root" . "component" "runtime-scheduler") | nindent 4 }}
spec:
  replicas: {{ .Values.runtimeScheduler.replicas }}
  selector:
    matchLabels:
      {{- include "lantern.componentSelectorLabels" (dict "root" . "component" "runtime-scheduler") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lantern.componentLabels" (dict "root" . "component" "runtime-scheduler") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "lantern.serviceAccountName" . }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "lantern.componentSelectorLabels" (dict "root" . "component" "runtime-scheduler") | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "lantern.dbHost" . }} {{ include "lantern.dbPort" . }}; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
      containers:
        - name: runtime-scheduler
          image: {{ include "lantern.image" (dict "root" . "component" .Values.runtimeScheduler) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 50055
              protocol: TCP
            - name: http
              containerPort: 8085
              protocol: TCP
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "lantern.fullname" . }}-config
                  key: LOG_LEVEL
            # Prod-like LANTERN_ENV makes the scheduler refuse to start without
            # the service token, node token and a real manager address.
            - name: PAL_ENV
              value: {{ coalesce .Values.runtimeScheduler.env.PAL_ENV .Values.runtimeScheduler.env.LANTERN_ENV "production" | quote }}
            - name: PAL_GRPC_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lantern.fullname" . }}-secrets
                  key: grpc-service-token
            - name: SCHEDULER_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lantern.fullname" . }}-secrets
                  key: scheduler-node-token
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "lantern.fullname" . }}-secrets
                  key: jwt-secret
            - name: PAL_DEFAULT_MANAGER_ADDR
              value: {{ .Values.runtimeScheduler.defaultManagerAddr | default (printf "%s-runtime-manager:%v" (include "lantern.fullname" .) .Values.runtimeManager.service.port) | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lantern.fullname" . }}-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "lantern.databaseURL" . | quote }}
            {{- with .Values.runtimeScheduler.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.runtimeScheduler.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.runtimeScheduler.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.runtimeScheduler.resources | nindent 12 }}
      {{- with .Values.runtimeScheduler.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
