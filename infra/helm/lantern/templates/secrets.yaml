apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lantern.fullname" . }}-secrets
  labels:
    {{- include "lantern.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  # RLS: the lantern_app (non-superuser) credential that policies apply to.
  # Empty unless supplied at deploy time; the services fail closed rather than
  # run with enforcement requested and unusable.
  app-db-password: {{ .Values.secrets.appDbPassword | default "" | b64enc | quote }}
  # Required whenever LANTERN_ENV is prod-like (prod/production/staging): the
  # control-plane's startup guards refuse to boot without them rather than run
  # insecurely. The chart had no way to supply these at all, so setting
  # LANTERN_ENV=staging demanded secrets it could not deliver.
  credential-key: {{ .Values.secrets.credentialKey | default "" | b64enc | quote }}
  receipt-secret: {{ .Values.secrets.receiptSecret | default "" | b64enc | quote }}
  grpc-service-token: {{ .Values.secrets.grpcServiceToken | default "" | b64enc | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  minio-password: {{ .Values.secrets.minioPassword | b64enc | quote }}
