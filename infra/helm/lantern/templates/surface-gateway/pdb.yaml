{{- if (gt (int .Values.surfaceGateway.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lantern.fullname" . }}-surface-gateway
  labels:
    {{- include "lantern.componentLabels" (dict "root" . "component" "surface-surface-gateway") | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "lantern.componentSelectorLabels" (dict "root" . "component" "surface-surface-gateway") | nindent 6 }}
{{- end }}
