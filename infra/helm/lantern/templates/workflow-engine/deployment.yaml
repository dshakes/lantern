apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lantern.fullname" . }}-workflow-engine
  labels:
    {{- include "lantern.componentLabels" (dict "root" . "component" "workflow-engine") | nindent 4 }}
spec:
  {{- if not .Values.workflowEngine.autoscaling.enabled }}
  replicas: {{ .Values.workflowEngine.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lantern.componentSelectorLabels" (dict "root" . "component" "workflow-engine") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lantern.componentLabels" (dict "root" . "component" "workflow-engine") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "lantern.serviceAccountName" . }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "lantern.dbHost" . }} {{ include "lantern.dbPort" . }}; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
      containers:
        - name: workflow-engine
          image: {{ include "lantern.image" (dict "root" . "component" .Values.workflowEngine) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "lantern.fullname" . }}-config
                  key: LOG_LEVEL
            # Required in prod-like envs (LANTERN_ENV=prod/production/staging):
            # the startup guards refuse to boot without these rather than run
            # insecurely. Injected unconditionally, empty by default, so dev and
            # kind deployments are unchanged.
            - name: PAL_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lantern.fullname" . }}-secrets
                  key: credential-key
            - name: PAL_RECEIPT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "lantern.fullname" . }}-secrets
                  key: receipt-secret
            - name: PAL_GRPC_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lantern.fullname" . }}-secrets
                  key: grpc-service-token
            # --- RLS enforcement (invariant #7) ---
            # These are injected UNCONDITIONALLY and default to empty, so a
            # values file that sets them actually takes effect. They were absent
            # here while values-staging.yaml declared them, which meant the flag
            # was silently dropped: the deployment came up healthy with RLS
            # completely off — a fail-open on the tenant-isolation control.
            - name: PAL_ENV
              value: {{ .Values.workflowEngine.env.LANTERN_ENV | default "production" | quote }}
            - name: PAL_RLS_ENFORCE
              value: {{ .Values.workflowEngine.env.LANTERN_RLS_ENFORCE | default "" | quote }}
            - name: PAL_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lantern.fullname" . }}-secrets
                  key: app-db-password
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lantern.fullname" . }}-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "lantern.databaseURL" . | quote }}
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "lantern.fullname" . }}-config
                  key: REDIS_URL
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "lantern.fullname" . }}-config
                  key: S3_ENDPOINT
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ include "lantern.fullname" . }}-config
                  key: S3_BUCKET
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "lantern.fullname" . }}-config
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lantern.fullname" . }}-secrets
                  key: minio-password
            # llm_call / tool_call dispatch targets (invariants #5, #6). The
            # in-binary defaults use bare names that match no cert SAN.
            - name: PAL_MODEL_ROUTER_ADDR
              value: "{{ include "lantern.fullname" . }}-model-router:50053"
            - name: PAL_RUNTIME_MANAGER_ADDR
              value: "{{ include "lantern.fullname" . }}-runtime-manager:{{ .Values.runtimeManager.service.port }}"
            # Internal gRPC mTLS (ADR 0043).
            {{- include "lantern.mtls.env" (dict "root" . "name" "workflow-engine" "peers" (list "control-plane")) | nindent 12 }}
            {{- include "lantern.mtls.managerClientEnv" . | nindent 12 }}
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            {{- include "lantern.mtls.volumeMounts" (dict "root" . "manager" true) | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- if .Values.mtls.enabled }}
            # kubelet gRPC probes cannot present a client cert; mTLS ports
            # would fail them, so probe the socket instead.
            tcpSocket:
              port: 50052
            {{- else }}
            grpc:
              port: 50052
            {{- end }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            {{- if .Values.mtls.enabled }}
            tcpSocket:
              port: 50052
            {{- else }}
            grpc:
              port: 50052
            {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.workflowEngine.resources | nindent 12 }}
      {{- if .Values.mtls.enabled }}
      volumes:
        {{- include "lantern.mtls.volumes" (dict "root" . "name" "workflow-engine" "manager" true) | nindent 8 }}
      {{- end }}
