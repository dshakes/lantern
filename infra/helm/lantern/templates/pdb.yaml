{{- /* PDBs for the components that have none of their own (control-plane and gateway keep theirs). */}}
{{- $root := . }}
{{- $components := dict "model-router" .Values.modelRouter "workflow-engine" .Values.workflowEngine "runtime-scheduler" .Values.runtimeScheduler "dashboard" .Values.dashboard }}
{{- range $name, $c := $components }}
{{- $min := int $c.replicas }}
{{- if and (hasKey $c "autoscaling") $c.autoscaling.enabled }}{{- $min = int $c.autoscaling.minReplicas }}{{- end }}
{{- if gt $min 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lantern.fullname" $root }}-{{ $name }}
  labels:
    {{- include "lantern.componentLabels" (dict "root" $root "component" $name) | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "lantern.componentSelectorLabels" (dict "root" $root "component" $name) | nindent 6 }}
{{- end }}
{{- end }}
