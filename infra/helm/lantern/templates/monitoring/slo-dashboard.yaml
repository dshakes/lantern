{{- if .Values.monitoring.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lantern.fullname" . }}-slo-dashboard
  labels:
    {{- include "lantern.labels" . | nindent 4 }}
    {{ .Values.monitoring.dashboards.label }}: "1"
data:
  lantern-slo.json: |-
{{ .Files.Get "dashboards/lantern-slo.json" | indent 4 }}
{{- end }}
