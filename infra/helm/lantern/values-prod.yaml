# values-prod.yaml -- Production overrides.
#
# Usage:
#   helm upgrade --install lantern infra/helm/lantern \
#     -f infra/helm/lantern/values.yaml \
#     -f infra/helm/lantern/values-prod.yaml \
#     --set secrets.appDbPassword="$LANTERN_APP_DB_PASSWORD"
#
# Prod-like guards (LANTERN_ENV=production) and RLS enforcement are ON.
# Pass secrets at deploy time: secrets.jwtSecret, secrets.credentialKey,
# secrets.receiptSecret, secrets.grpcServiceToken, secrets.appDbPassword.
# See docs/runbooks/rls-cutover.md before applying.

global:
  image:
    # Published images: ghcr.io/dshakes/lantern/<name> (build-images.yml). The
    # per-component image.name comes from values.yaml; an empty registry used to
    # render "/lantern/lantern-gateway:tag", which no runtime can pull.
    registry: ghcr.io
    repository: dshakes/lantern
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  logLevel: info

# -- Row-Level Security: ON here, and only here --
#
# LANTERN_RLS_ENFORCE=1 makes tenant-scoped queries run as the non-superuser
# `lantern_app` role, which the policies actually apply to. Without the second
# variable the pool is never built and the services fail closed at startup, so
# the two must always travel together.
#
# appDbPassword is NOT stored here. Pass it at deploy time (--set, or an
# external secret) — the runbook covers both.

gateway:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  service:
    type: ClusterIP
    port: 8443
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    LISTEN_ADDR: "0.0.0.0:8443"
    CONTROL_PLANE_ADDR: "lantern-control-plane:50051"
    MODEL_ROUTER_ADDR: "lantern-model-router:50053"
    LOG_LEVEL: "info"

controlPlane:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  service:
    type: ClusterIP
    grpcPort: 50051
    httpPort: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    LISTEN_ADDR: ":50051"
    LOG_LEVEL: "info"
    LANTERN_ENV: "production"
    # --- RLS ---
    LANTERN_RLS_ENFORCE: "1"
    # LANTERN_APP_DB_PASSWORD comes from the secret, not from values.
  # REQUIRED for a prod-class LANTERN_ENV (production) — the control-plane refuses
  # to start without these (runStartupGuards / grpcTLSCreds). Besides the
  # `secrets:` values listed at the top, supply per environment:
  #   LANTERN_CONTROL_PLANE_TLS_CERT/KEY gRPC server cert (gateway hop)
  #   LANTERN_RUNTIME_MANAGER_TLS_CA/CERT/KEY  mTLS client to the runtime-manager
  # LANTERN_SCHEDULER_GRPC_ADDR is wired by the chart (in-cluster scheduler svc).
  # The TLS inputs below are operator-supplied Secrets (the chart cannot mint
  # them); the control-plane refuses to boot in prod until they are mounted.
  # extraEnv (append):
  #   - {name: LANTERN_CONTROL_PLANE_TLS_CERT, value: /etc/lantern/tls/tls.crt}
  #   - {name: LANTERN_CONTROL_PLANE_TLS_KEY, value: /etc/lantern/tls/tls.key}
  #   - {name: LANTERN_RUNTIME_MANAGER_TLS_CA, value: /etc/lantern/manager-tls/ca.crt}
  #   - {name: LANTERN_RUNTIME_MANAGER_TLS_CERT, value: /etc/lantern/manager-tls/tls.crt}
  #   - {name: LANTERN_RUNTIME_MANAGER_TLS_KEY, value: /etc/lantern/manager-tls/tls.key}
  # extraVolumeMounts:
  #   - {name: cp-tls, mountPath: /etc/lantern/tls, readOnly: true}
  #   - {name: manager-tls, mountPath: /etc/lantern/manager-tls, readOnly: true}
  # extraVolumes:
  #   - {name: cp-tls, secret: {secretName: lantern-control-plane-tls}}
  #   - {name: manager-tls, secret: {secretName: lantern-manager-client-tls}}

workflowEngine:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    LOG_LEVEL: "info"
    LANTERN_ENV: "production"
    # --- RLS ---
    # The engine needs BOTH, same as the control-plane. It pings the pool at
    # startup, so a wrong password fails here rather than on the first
    # tenant-scoped query hours later.
    LANTERN_RLS_ENFORCE: "1"

modelRouter:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    LOG_LEVEL: "info"
    LANTERN_ENV: "production"

runtimeManager:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    LOG_LEVEL: "info"
    LANTERN_ENV: "production"

runtimeScheduler:
  replicas: 2
  env:
    LANTERN_ENV: "production"
  # The scheduler dials the manager over mTLS in prod; mount the client cert like
  # controlPlane.extraVolumes and set LANTERN_RUNTIME_MANAGER_TLS_CA/CERT/KEY.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

surfaceGateway:
  replicas: 2
  env:
    LANTERN_ENV: "production"
  # Secret with SLACK_SIGNING_SECRET, TELEGRAM_SECRET_TOKEN, ... (create it out of band)
  existingSecret: ""

networkPolicy:
  enabled: true
  # Narrow to your ingress controller's namespace, e.g.
  # ingressFrom: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]
  ingressFrom: []

# In-cluster logical backup is a floor; managed Postgres + PITR is the GA path
# (docs/runbooks/db-restore.md). If you self-host Postgres, ship dumps to managed S3.
# Disabled until you set a bucket: enable with
#   --set backup.enabled=true --set backup.s3Bucket=<bucket>
backup:
  enabled: false
  useChartMinio: false
  existingSecret: lantern-backup-s3   # keys: access-key-id, secret-access-key
  s3Endpoint: ""                      # "" = AWS S3
  s3Bucket: ""                        # REQUIRED when enabled

dashboard:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

secrets:
  # Also supplied at deploy time: jwtSecret, credentialKey, receiptSecret,
  # grpcServiceToken, schedulerNodeToken (the scheduler refuses to start without it).
  # Supplied at deploy time — never committed. See the runbook.
  #   --set secrets.appDbPassword="$LANTERN_APP_DB_PASSWORD"
  # This is the credential for the lantern_app role that RLS policies apply to;
  # it is NOT the superuser postgres password and must not be set to it (a
  # superuser bypasses RLS, which would leave enforcement silently off).
  appDbPassword: ""
