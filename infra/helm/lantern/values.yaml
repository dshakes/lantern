global:
  image:
    registry: ghcr.io
    repository: dshakes/lantern
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  logLevel: info
  # Bitnami subcharts (postgresql/redis/minio, v1.5.x+ image-verification guard)
  # refuse to render when their image is overridden to a non-Bitnami container.
  # Lantern intentionally runs `pgvector/pgvector` for the Postgres subchart (the
  # pgvector extension is a hard requirement), so the guard must be relaxed for
  # the in-cluster dev/self-host path. Has no effect on managed-infra deployments
  # (postgresql.enabled=false etc.).
  security:
    allowInsecureImages: true

gateway:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: gateway
  service:
    type: ClusterIP
    port: 8443
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    LISTEN_ADDR: "0.0.0.0:8443"

controlPlane:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: control-plane
  service:
    type: ClusterIP
    grpcPort: 50051
    httpPort: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  env:
    LISTEN_ADDR: ":50051"
    # Secure by default: prod-like startup guards (JWT secret, service token,
    # credential key) are ON. Dev/kind values files must opt out explicitly.
    LANTERN_ENV: "production"
  # Prod-class inputs the startup guards require that are not secrets in
  # `secrets:` — scheduler address and TLS file paths (see values-prod.yaml).
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

modelRouter:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: model-router
  service:
    type: ClusterIP
    port: 50053
  env:
    LANTERN_ENV: "production"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

workflowEngine:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: workflow-engine
  service:
    type: ClusterIP
    port: 50052
  env:
    LANTERN_ENV: "production"
    LANTERN_RLS_ENFORCE: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

runtimeManager:
  replicas: 1
  image:
    name: runtime-manager
  service:
    type: ClusterIP
    port: 50054
  env:
    LANTERN_ENV: "production"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

dashboard:
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: web
  service:
    type: ClusterIP
    port: 3000

postgresql:
  enabled: true
  auth:
    username: lantern
    password: ""  # set via secret
    database: lantern
  primary:
    persistence:
      size: 10Gi
  image:
    repository: pgvector/pgvector
    tag: pg16

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

minio:
  enabled: true
  auth:
    rootUser: lantern
    rootPassword: ""  # set via secret
  defaultBuckets: "lantern-bundles,lantern-snapshots,lantern-dev,lantern-backups"
  persistence:
    size: 10Gi

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: api.lantern.run
      paths:
        - path: /
          pathType: Prefix
          service: gateway
    - host: app.lantern.run
      paths:
        - path: /
          pathType: Prefix
          service: dashboard
  tls: []

# Stateless gRPC/HTTP service in front of the runtime-manager nodes. Leader
# election (Postgres advisory lock) makes 2 replicas safe.
runtimeScheduler:
  replicas: 2
  image:
    name: runtime-scheduler
  service:
    type: ClusterIP
    grpcPort: 50055
    httpPort: 8085
  env:
    LANTERN_ENV: "production"
  # runtime-manager address the scheduler dials; empty -> this release's
  # runtime-manager Service. Prod also needs LANTERN_RUNTIME_MANAGER_TLS_*
  # (extraEnv + extraVolumes, same shape as controlPlane).
  defaultManagerAddr: ""
  # /healthz is liveness-only; /readyz fails while no runtime-manager node has
  # registered, which blocks `helm --wait` on a fresh install. Switch to
  # /readyz once nodes register if you want that signal on the Service.
  readinessPath: /healthz
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

# Inbound webhooks (Slack/Telegram/Twilio/WhatsApp/Discord). Channel
# credentials come from an operator-managed Secret, never from values.
surfaceGateway:
  replicas: 1
  image:
    name: surface-gateway
  service:
    type: ClusterIP
    port: 8444
  env:
    LANTERN_ENV: "production"
  # Existing Secret whose keys are the gateway's env var names
  # (SLACK_SIGNING_SECRET, TELEGRAM_SECRET_TOKEN, ...). Optional.
  existingSecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Default-deny NetworkPolicy for every pod in the release plus the allow rules
# the platform needs. Needs a CNI that enforces policy (Calico/Cilium).
networkPolicy:
  enabled: false
  # Peers allowed to reach the public entrypoints (gateway, dashboard,
  # surface-gateway). Empty = any source (ingress controllers vary).
  ingressFrom: []
  # Peers allowed to scrape /metrics (control-plane :9464, scheduler :8085).
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  # Extra egress rules appended to the egress allow policy, e.g. a managed
  # Postgres/Redis on private IPs: [{to: [{ipBlock: {cidr: 10.20.0.0/24}}]}]
  extraEgress: []

# Logical backup of the in-cluster Postgres (same shape as the lantern-control-plane
# chart): gzip'd pg_dump -> S3/MinIO, with retention pruning. Floor, not PITR; prod
# should use managed Postgres. Restore + drill: docs/runbooks/db-restore.md
backup:
  enabled: false
  schedule: "0 2 * * *"            # 02:00 daily (cluster TZ)
  image: pgvector/pgvector:pg16    # must match the server major version
  uploaderImage: amazon/aws-cli:2.15.17
  s3Bucket: lantern-backups
  s3Endpoint: ""                   # "" = AWS S3; with useChartMinio=true the release's MinIO is used
  s3Region: us-east-1
  retentionDays: 14
  # true: upload to this release's MinIO with its credentials.
  # false: credentials come from existingSecret (keys access-key-id, secret-access-key).
  useChartMinio: true
  existingSecret: ""

secrets:
  # These should be overridden via --set or external secrets
  jwtSecret: ""
  openaiApiKey: ""
  anthropicApiKey: ""
  # Required when LANTERN_ENV is prod-like — see docs/runbooks/rls-cutover.md.
  credentialKey: ""
  receiptSecret: ""
  grpcServiceToken: ""
  # Required in prod by the scheduler (REST heartbeat auth).
  schedulerNodeToken: ""
  appDbPassword: ""
  postgresPassword: "lantern"
  minioPassword: "lanternsecret"

serviceAccount:
  create: true
  name: "lantern"
  annotations: {}
