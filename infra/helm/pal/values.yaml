# Env vars are emitted as PAL_* (ADR 0032). The binaries still accept the legacy
# LANTERN_* names, so existing overrides keep working; PAL_* wins if both are set.
#
# Upgrading a release created before the PAL rename (ADR 0032): the chart name changed, so
# resource names change with it (release "lantern" -> "lantern-<chart>"). To keep the old
# names, and the Postgres/MinIO PVCs bound to them, pass --set fullnameOverride=<old fullname>.
#
global:
  image:
    registry: ghcr.io
    repository: dshakes/pal
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  logLevel: info

gateway:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: gateway
  service:
    type: ClusterIP
    port: 8443
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    LISTEN_ADDR: "0.0.0.0:8443"

controlPlane:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: control-plane
  service:
    type: ClusterIP
    grpcPort: 50051
    httpPort: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  env:
    LISTEN_ADDR: ":50051"
    # Secure by default: prod-like startup guards (JWT secret, service token,
    # credential key) are ON. Dev/kind values files must opt out explicitly.
    PAL_ENV: ""   # empty -> legacy PAL_ENV override -> "production" (see templates)
  # Prod-class inputs the startup guards require that are not secrets in
  # `secrets:` — scheduler address and TLS file paths (see values-prod.yaml).
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

modelRouter:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: model-router
  service:
    type: ClusterIP
    port: 50053
  env:
    PAL_ENV: ""   # empty -> legacy PAL_ENV override -> "production" (see templates)
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

workflowEngine:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: workflow-engine
  service:
    type: ClusterIP
    port: 50052
  env:
    PAL_ENV: ""   # empty -> legacy PAL_ENV override -> "production" (see templates)
    PAL_RLS_ENFORCE: ""
    # Per-endpoint API-key scope enforcement (default off; see
    # docs/runbooks/ga-staged-rollout.md). 403 on a missing scope when "1".
    PAL_AUTHZ_ENFORCE: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

runtimeManager:
  replicas: 1
  image:
    name: runtime-manager
  service:
    type: ClusterIP
    port: 50054
  env:
    PAL_ENV: ""   # empty -> legacy PAL_ENV override -> "production" (see templates)
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

dashboard:
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: web
  service:
    type: ClusterIP
    port: 3000

# -- Multi-region (ADR 0046) --
# All empty = single-region (the default): nothing is injected and nothing
# changes. A two-region install layers values-region-primary.yaml or
# values-region-standby.yaml on top of values-prod.yaml in each region; see
# docs/runbooks/region-failover.md for promotion.
region:
  name: ""            # PAL_REGION, e.g. us-east-1 — stamped on runs/leases/journal + OTel cloud.region
  fenceEpoch: ""      # PAL_FENCE_EPOCH — must equal pal_region_fence.epoch once the fence is armed
  readOnly: false     # PAL_READ_ONLY — standby: mutations 503, no migrations/background writers

# -- In-cluster dependencies (dev / kind / evaluation) vs managed (production) --
#
# postgresql + minio are small first-party templates, enabled by default so
# `helm install` works on a bare cluster. Production sets both enabled=false and
# points at managed Postgres/S3 through externalDatabase / externalS3 below.
# Passwords come from `secrets.postgresPassword` / `secrets.minioPassword`.
postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector      # pgvector is a hard requirement
    tag: 0.8.0-pg16
  auth:                                # also the user/db names used with externalDatabase
    username: lantern
    database: lantern
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

externalDatabase:                      # used when postgresql.enabled=false
  host: ""
  port: 5432
  sslmode: require

# redis stays on the Bitnami subchart.
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

minio:                                 # S3-compatible store (SeaweedFS image; name kept for compatibility)
  enabled: true
  image:
    repository: chrislusf/seaweedfs
    tag: "3.80"
  auth:
    rootUser: lantern                  # secret key is secrets.minioPassword
  defaultBuckets: "lantern-bundles,lantern-snapshots,lantern-dev,lantern-backups"
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

externalS3:                            # used when minio.enabled=false
  endpoint: ""                         # e.g. https://s3.us-east-1.amazonaws.com
  region: us-east-1                    # must match the bucket region (SigV4 signs it)
  accessKeyId: ""                      # secret key is secrets.minioPassword
  bucket: lantern-dev

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: api.lantern.run
      paths:
        - path: /
          pathType: Prefix
          service: gateway
    - host: app.lantern.run
      paths:
        - path: /
          pathType: Prefix
          service: dashboard
  tls: []

# Stateless gRPC/HTTP service in front of the runtime-manager nodes. Leader
# election (Postgres advisory lock) makes 2 replicas safe.
runtimeScheduler:
  replicas: 2
  image:
    name: runtime-scheduler
  service:
    type: ClusterIP
    grpcPort: 50055
    httpPort: 8085
  env:
    PAL_ENV: ""   # empty -> legacy PAL_ENV override -> "production" (see templates)
  # runtime-manager address the scheduler dials; empty -> this release's
  # runtime-manager Service. Prod also needs PAL_RUNTIME_MANAGER_TLS_*
  # (extraEnv + extraVolumes, same shape as controlPlane).
  defaultManagerAddr: ""
  # /healthz is liveness-only; /readyz fails while no runtime-manager node has
  # registered, which blocks `helm --wait` on a fresh install. Switch to
  # /readyz once nodes register if you want that signal on the Service.
  readinessPath: /healthz
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

# Inbound webhooks (Slack/Telegram/Twilio/WhatsApp/Discord). Channel
# credentials come from an operator-managed Secret, never from values.
surfaceGateway:
  replicas: 1
  image:
    name: surface-gateway
  service:
    type: ClusterIP
    port: 8444
  env:
    PAL_ENV: ""   # empty -> legacy PAL_ENV override -> "production" (see templates)
  # Existing Secret whose keys are the gateway's env var names
  # (SLACK_SIGNING_SECRET, TELEGRAM_SECRET_TOKEN, ...). Optional.
  existingSecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Default-deny NetworkPolicy for every pod in the release plus the allow rules
# the platform needs. Needs a CNI that enforces policy (Calico/Cilium).
networkPolicy:
  enabled: false
  # Peers allowed to reach the public entrypoints (gateway, dashboard,
  # surface-gateway). Empty = any source (ingress controllers vary).
  ingressFrom: []
  # Peers allowed to scrape /metrics (control-plane :9464, scheduler :8085).
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  # Extra egress rules appended to the egress allow policy, e.g. a managed
  # Postgres/Redis on private IPs: [{to: [{ipBlock: {cidr: 10.20.0.0/24}}]}]
  extraEgress: []

# Logical backup of the in-cluster Postgres (same shape as the pal-control-plane
# chart): gzip'd pg_dump -> S3/MinIO, with retention pruning. Floor, not PITR; prod
# should use managed Postgres. Restore + drill: docs/runbooks/db-restore.md
backup:
  enabled: false
  schedule: "0 2 * * *"            # 02:00 daily (cluster TZ)
  image: pgvector/pgvector:pg16    # must match the server major version
  uploaderImage: amazon/aws-cli:2.15.17
  s3Bucket: lantern-backups
  s3Endpoint: ""                   # "" = AWS S3; with useChartMinio=true the release's MinIO is used
  s3Region: us-east-1
  retentionDays: 14
  # true: upload to this release's MinIO with its credentials.
  # false: credentials come from existingSecret (keys access-key-id, secret-access-key).
  useChartMinio: true
  existingSecret: ""

secrets:
  # These should be overridden via --set or external secrets
  jwtSecret: ""
  openaiApiKey: ""
  anthropicApiKey: ""
  # Required when PAL_ENV is prod-like — see docs/runbooks/rls-cutover.md.
  credentialKey: ""
  receiptSecret: ""
  grpcServiceToken: ""
  # Required in prod by the scheduler (REST heartbeat auth).
  schedulerNodeToken: ""
  appDbPassword: ""
  postgresPassword: "lantern"
  minioPassword: "lanternsecret"

serviceAccount:
  create: true
  name: "pal"
  annotations: {}

# -- Monitoring: SLOs, error-budget burn alerts, dashboard (ADR 0041) --
#
# Needs the prometheus-operator CRDs (monitoring.coreos.com/v1 PrometheusRule)
# when alerts.enabled=true; the chart does not install them. On by default only
# in values-prod.yaml. Scrape contract: the pods carry prometheus.io/* annotations
# (control-plane :9464, scheduler :8085, model-router :9465, runtime-manager
# :9466); each SLO's `job` must match the `job` label your Prometheus assigns.
monitoring:
  alerts:
    enabled: false
    # Labels the operator's ruleSelector needs, e.g. {release: kube-prometheus-stack}.
    ruleLabels: {}
    runbookBaseUrl: https://github.com/dshakes/pal/blob/master/docs/runbooks
  dashboards:
    enabled: false
    # Grafana sidecar discovery label.
    label: grafana_dashboard
  # SLO catalogue. SLI = bad/total over a window. In `bad`/`total`, __W__ becomes
  # the window and __J__ becomes job="<job>". minEventsPerHour suppresses
  # burn alerts on too little traffic to be meaningful; expectTraffic adds a
  # "signal absent" ticket when the SLI disappears.
  slos:
    control-plane-api-availability:
      service: control-plane
      job: (pal|lantern)-control-plane
      objective: 0.999
      minEventsPerHour: 0
      expectTraffic: true
      runbook: slo-control-plane-api.md
      description: "Control-plane API requests that do not fail with a 5xx (probes and SSE/log streams excluded)."
      bad: |-
        sum(rate(http_server_request_duration_seconds_count{__J__,pal_traffic="api",http_response_status_code=~"5.."}[__W__]))
      total: |-
        sum(rate(http_server_request_duration_seconds_count{__J__,pal_traffic="api"}[__W__]))
    control-plane-api-latency:
      service: control-plane
      job: (pal|lantern)-control-plane
      objective: 0.99
      minEventsPerHour: 0
      expectTraffic: true
      runbook: slo-control-plane-api.md
      description: "Control-plane API requests answered in under 1s (the le=\"1\" histogram bucket)."
      bad: |-
        sum(rate(http_server_request_duration_seconds_count{__J__,pal_traffic="api"}[__W__])) - sum(rate(http_server_request_duration_seconds_bucket{__J__,pal_traffic="api",le="1"}[__W__]))
      total: |-
        sum(rate(http_server_request_duration_seconds_count{__J__,pal_traffic="api"}[__W__]))
    run-success:
      service: control-plane
      job: (pal|lantern)-control-plane
      objective: 0.98
      minEventsPerHour: 10
      expectTraffic: false
      runbook: slo-run-success.md
      description: "Inline-executor runs that finish succeeded rather than failed. Includes agent-logic failures: it is a product-health SLI, not purely a platform one."
      bad: |-
        sum(rate(lantern_run_total{__J__,lantern_status="failed"}[__W__]))
      total: |-
        sum(rate(lantern_run_total{__J__}[__W__]))
    scheduling-availability:
      service: runtime-scheduler
      job: (pal|lantern)-runtime-scheduler
      objective: 0.995
      minEventsPerHour: 10
      expectTraffic: false
      runbook: slo-scheduling.md
      description: "Schedule RPCs that place a VM rather than error. Quota rejections and standby replies are not failures."
      bad: |-
        sum(rate(lantern_scheduler_schedule_total{__J__,result="error"}[__W__]))
      total: |-
        sum(rate(lantern_scheduler_schedule_total{__J__,result=~"ok|error"}[__W__]))
    scheduling-latency:
      service: runtime-scheduler
      job: (pal|lantern)-runtime-scheduler
      objective: 0.99
      minEventsPerHour: 10
      expectTraffic: false
      runbook: slo-scheduling.md
      description: "Successful Schedule RPCs answered in under 1s (placement decision; spawn dispatch is async)."
      bad: |-
        sum(rate(lantern_scheduler_schedule_duration_seconds_count{__J__,result="ok"}[__W__])) - sum(rate(lantern_scheduler_schedule_duration_seconds_bucket{__J__,result="ok",le="1"}[__W__]))
      total: |-
        sum(rate(lantern_scheduler_schedule_duration_seconds_count{__J__,result="ok"}[__W__]))
    model-router-errors:
      service: model-router
      job: (pal|lantern)-model-router
      objective: 0.995
      minEventsPerHour: 20
      expectTraffic: false
      runbook: slo-model-router-errors.md
      description: "ModelService RPCs that succeed. Caller errors (invalid argument, auth) are excluded; provider exhaustion, timeouts and unavailability count as failures."
      bad: |-
        sum(rate(lantern_model_router_requests_total{__J__,outcome="error"}[__W__]))
      total: |-
        sum(rate(lantern_model_router_requests_total{__J__,outcome=~"ok|error"}[__W__]))
    microvm-spawn-availability:
      service: runtime-manager
      job: (pal|lantern)-runtime-manager
      objective: 0.995
      minEventsPerHour: 10
      expectTraffic: false
      runbook: slo-microvm-spawn.md
      description: "RuntimeManager.Spawn calls (cold boot and snapshot restore) that boot a VM rather than error."
      bad: |-
        sum(rate(lantern_manager_spawn_duration_seconds_count{__J__,outcome="error"}[__W__]))
      total: |-
        sum(rate(lantern_manager_spawn_duration_seconds_count{__J__}[__W__]))
    microvm-cold-boot-latency:
      service: runtime-manager
      job: (pal|lantern)-runtime-manager
      objective: 0.95
      minEventsPerHour: 10
      expectTraffic: false
      runbook: slo-microvm-spawn.md
      description: "Successful cold boots completed in under 5s."
      bad: |-
        sum(rate(lantern_manager_spawn_duration_seconds_count{__J__,kind="cold",outcome="ok"}[__W__])) - sum(rate(lantern_manager_spawn_duration_seconds_bucket{__J__,kind="cold",outcome="ok",le="5"}[__W__]))
      total: |-
        sum(rate(lantern_manager_spawn_duration_seconds_count{__J__,kind="cold",outcome="ok"}[__W__]))
    microvm-restore-latency:
      service: runtime-manager
      job: (pal|lantern)-runtime-manager
      objective: 0.99
      minEventsPerHour: 10
      expectTraffic: false
      runbook: slo-microvm-spawn.md
      description: "Successful snapshot restores completed in under 2s."
      bad: |-
        sum(rate(lantern_manager_spawn_duration_seconds_count{__J__,kind="restore",outcome="ok"}[__W__])) - sum(rate(lantern_manager_spawn_duration_seconds_bucket{__J__,kind="restore",outcome="ok",le="2"}[__W__]))
      total: |-
        sum(rate(lantern_manager_spawn_duration_seconds_count{__J__,kind="restore",outcome="ok"}[__W__]))
    egress-broker-errors:
      service: runtime-manager
      job: (pal|lantern)-runtime-manager
      objective: 0.995
      minEventsPerHour: 50
      expectTraffic: false
      runbook: slo-egress-broker.md
      description: "Egress broker decisions that are not a platform fault. Policy denies are correct behaviour and count as good; DNS, upstream-connect and credential-resolution failures count as bad."
      bad: |-
        sum(rate(lantern_egress_broker_decisions_total{__J__,outcome="error"}[__W__]))
      total: |-
        sum(rate(lantern_egress_broker_decisions_total{__J__}[__W__]))
