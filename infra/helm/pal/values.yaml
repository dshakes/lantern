# Env vars are emitted as PAL_* (ADR 0032). The binaries still accept the legacy
# LANTERN_* names, so existing overrides keep working; PAL_* wins if both are set.
#
# Upgrading a release created before the PAL rename (ADR 0032): the chart name changed, so
# resource names change with it (release "lantern" -> "lantern-<chart>"). To keep the old
# names, and the Postgres/MinIO PVCs bound to them, pass --set fullnameOverride=<old fullname>.
#
global:
  image:
    registry: ghcr.io
    repository: dshakes/lantern
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  logLevel: info

gateway:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: gateway
  service:
    type: ClusterIP
    port: 8443
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    LISTEN_ADDR: "0.0.0.0:8443"

controlPlane:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: control-plane
  service:
    type: ClusterIP
    grpcPort: 50051
    httpPort: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  env:
    LISTEN_ADDR: ":50051"
    # Secure by default: prod-like startup guards (JWT secret, service token,
    # credential key) are ON. Dev/kind values files must opt out explicitly.
    PAL_ENV: ""   # empty -> legacy PAL_ENV override -> "production" (see templates)
  # Prod-class inputs the startup guards require that are not secrets in
  # `secrets:` — scheduler address and TLS file paths (see values-prod.yaml).
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

modelRouter:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: model-router
  service:
    type: ClusterIP
    port: 50053
  env:
    PAL_ENV: ""   # empty -> legacy PAL_ENV override -> "production" (see templates)
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

workflowEngine:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: workflow-engine
  service:
    type: ClusterIP
    port: 50052
  env:
    PAL_ENV: ""   # empty -> legacy PAL_ENV override -> "production" (see templates)
    PAL_RLS_ENFORCE: ""
    # Per-endpoint API-key scope enforcement (default off; see
    # docs/runbooks/ga-staged-rollout.md). 403 on a missing scope when "1".
    PAL_AUTHZ_ENFORCE: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

runtimeManager:
  replicas: 1
  image:
    name: runtime-manager
  service:
    type: ClusterIP
    port: 50054
  env:
    PAL_ENV: ""   # empty -> legacy PAL_ENV override -> "production" (see templates)
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

dashboard:
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    name: web
  service:
    type: ClusterIP
    port: 3000

# -- Multi-region (ADR 0046) --
# All empty = single-region (the default): nothing is injected and nothing
# changes. A two-region install layers values-region-primary.yaml or
# values-region-standby.yaml on top of values-prod.yaml in each region; see
# docs/runbooks/region-failover.md for promotion.
region:
  name: ""            # PAL_REGION, e.g. us-east-1 — stamped on runs/leases/journal + OTel cloud.region
  fenceEpoch: ""      # PAL_FENCE_EPOCH — must equal region_fence.epoch once the fence is armed
  readOnly: false     # PAL_READ_ONLY — standby: mutations 503, no migrations/background writers

# -- In-cluster dependencies (dev / kind / evaluation) vs managed (production) --
#
# postgresql + minio are small first-party templates, enabled by default so
# `helm install` works on a bare cluster. Production sets both enabled=false and
# points at managed Postgres/S3 through externalDatabase / externalS3 below.
# Passwords come from `secrets.postgresPassword` / `secrets.minioPassword`.
postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector      # pgvector is a hard requirement
    tag: 0.8.0-pg16
  auth:                                # also the user/db names used with externalDatabase
    username: lantern
    database: lantern
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

externalDatabase:                      # used when postgresql.enabled=false
  host: ""
  port: 5432
  sslmode: require

# redis stays on the Bitnami subchart.
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

minio:                                 # S3-compatible store (SeaweedFS image; name kept for compatibility)
  enabled: true
  image:
    repository: chrislusf/seaweedfs
    tag: "3.80"
  auth:
    rootUser: lantern                  # secret key is secrets.minioPassword
  defaultBuckets: "lantern-bundles,lantern-snapshots,lantern-dev,lantern-backups"
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

externalS3:                            # used when minio.enabled=false
  endpoint: ""                         # e.g. https://s3.us-east-1.amazonaws.com
  region: us-east-1                    # must match the bucket region (SigV4 signs it)
  accessKeyId: ""                      # secret key is secrets.minioPassword
  bucket: lantern-dev

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: api.lantern.run
      paths:
        - path: /
          pathType: Prefix
          service: gateway
    - host: app.lantern.run
      paths:
        - path: /
          pathType: Prefix
          service: dashboard
  tls: []

# Stateless gRPC/HTTP service in front of the runtime-manager nodes. Leader
# election (Postgres advisory lock) makes 2 replicas safe.
runtimeScheduler:
  replicas: 2
  image:
    name: runtime-scheduler
  service:
    type: ClusterIP
    grpcPort: 50055
    httpPort: 8085
  env:
    PAL_ENV: ""   # empty -> legacy PAL_ENV override -> "production" (see templates)
  # runtime-manager address the scheduler dials; empty -> this release's
  # runtime-manager Service. Prod also needs PAL_RUNTIME_MANAGER_TLS_*
  # (extraEnv + extraVolumes, same shape as controlPlane).
  defaultManagerAddr: ""
  # /healthz is liveness-only; /readyz fails while no runtime-manager node has
  # registered, which blocks `helm --wait` on a fresh install. Switch to
  # /readyz once nodes register if you want that signal on the Service.
  readinessPath: /healthz
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

# Inbound webhooks (Slack/Telegram/Twilio/WhatsApp/Discord). Channel
# credentials come from an operator-managed Secret, never from values.
surfaceGateway:
  replicas: 1
  image:
    name: surface-gateway
  service:
    type: ClusterIP
    port: 8444
  env:
    PAL_ENV: ""   # empty -> legacy PAL_ENV override -> "production" (see templates)
  # Existing Secret whose keys are the gateway's env var names
  # (SLACK_SIGNING_SECRET, TELEGRAM_SECRET_TOKEN, ...). Optional.
  existingSecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Default-deny NetworkPolicy for every pod in the release plus the allow rules
# the platform needs. Needs a CNI that enforces policy (Calico/Cilium).
networkPolicy:
  enabled: false
  # Peers allowed to reach the public entrypoints (gateway, dashboard,
  # surface-gateway). Empty = any source (ingress controllers vary).
  ingressFrom: []
  # Peers allowed to scrape /metrics (control-plane :9464, scheduler :8085).
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  # Extra egress rules appended to the egress allow policy, e.g. a managed
  # Postgres/Redis on private IPs: [{to: [{ipBlock: {cidr: 10.20.0.0/24}}]}]
  extraEgress: []

# Logical backup of the in-cluster Postgres (same shape as the pal-control-plane
# chart): gzip'd pg_dump -> S3/MinIO, with retention pruning. Floor, not PITR; prod
# should use managed Postgres. Restore + drill: docs/runbooks/db-restore.md
backup:
  enabled: false
  schedule: "0 2 * * *"            # 02:00 daily (cluster TZ)
  image: pgvector/pgvector:pg16    # must match the server major version
  uploaderImage: amazon/aws-cli:2.15.17
  s3Bucket: lantern-backups
  s3Endpoint: ""                   # "" = AWS S3; with useChartMinio=true the release's MinIO is used
  s3Region: us-east-1
  retentionDays: 14
  # true: upload to this release's MinIO with its credentials.
  # false: credentials come from existingSecret (keys access-key-id, secret-access-key).
  useChartMinio: true
  existingSecret: ""

secrets:
  # These should be overridden via --set or external secrets
  jwtSecret: ""
  openaiApiKey: ""
  anthropicApiKey: ""
  # Required when PAL_ENV is prod-like — see docs/runbooks/rls-cutover.md.
  credentialKey: ""
  receiptSecret: ""
  grpcServiceToken: ""
  # Required in prod by the scheduler (REST heartbeat auth).
  schedulerNodeToken: ""
  appDbPassword: ""
  postgresPassword: "lantern"
  minioPassword: "lanternsecret"

serviceAccount:
  create: true
  name: "pal"
  annotations: {}
