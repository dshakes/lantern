# values-staging.yaml -- Staging overrides.
#
# Usage:
#   helm upgrade --install pal infra/helm/pal \
#     -f infra/helm/pal/values.yaml \
#     -f infra/helm/pal/values-staging.yaml \
#     --set secrets.appDbPassword="$PAL_APP_DB_PASSWORD"
#
# staging is PROD-CLASS (PAL_ENV=staging enables every prod startup guard).
# Pass the same secrets as production at deploy time: secrets.jwtSecret,
# secrets.credentialKey, secrets.receiptSecret, secrets.grpcServiceToken,
# secrets.appDbPassword — plus the controlPlane.extraEnv inputs documented below.
#
# WHY THIS FILE EXISTS
# --------------------
# Row-Level Security shipped for the control-plane and the workflow engine, and
# then sat switched off everywhere, because there was nowhere to switch it on:
# the chart had values.yaml and values-dev.yaml and nothing in between. Merged
# and unenabled is not the same as done, so staging is defined here as the place
# enforcement is proven before it goes anywhere that matters.
#
# READ docs/runbooks/rls-cutover.md BEFORE APPLYING. The database work (role,
# password, grants) has to happen first — with PAL_RLS_ENFORCE=1 and no
# usable pal_app credential, both services refuse to start. That is
# deliberate (a service that believes it is enforcing and is not is worse than
# one that is plainly down), but it does mean a wrong order takes the
# environment down rather than degrading it.

global:
  image:
    registry: ghcr.io          # published images: ghcr.io/dshakes/pal/<name> (build-images.yml)
    repository: dshakes/pal
    tag: staging
    pullPolicy: IfNotPresent
  logLevel: info

# -- Row-Level Security: ON here, and only here --
#
# PAL_RLS_ENFORCE=1 makes tenant-scoped queries run as the non-superuser
# `pal_app` role, which the policies actually apply to. Without the second
# variable the pool is never built and the services fail closed at startup, so
# the two must always travel together.
#
# appDbPassword is NOT stored here. Pass it at deploy time (--set, or an
# external secret) — the runbook covers both.

gateway:
  replicas: 2
  service:
    type: ClusterIP
    port: 8443
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    LISTEN_ADDR: "0.0.0.0:8443"
    CONTROL_PLANE_ADDR: "pal-control-plane:50051"
    MODEL_ROUTER_ADDR: "pal-model-router:50053"
    LOG_LEVEL: "info"

controlPlane:
  replicas: 2
  service:
    type: ClusterIP
    grpcPort: 50051
    httpPort: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    LISTEN_ADDR: ":50051"
    LOG_LEVEL: "info"
    PAL_ENV: "staging"
    # --- RLS ---
    PAL_RLS_ENFORCE: "1"
    # PAL_APP_DB_PASSWORD comes from the secret, not from values.
    # --- API-key scope enforcement ---
    # A key missing the endpoint's scope gets 403. JWT sessions and unscoped
    # (legacy) keys are unaffected. Re-scope keys first: ga-staged-rollout.md.
    PAL_AUTHZ_ENFORCE: "1"
  # REQUIRED for a prod-class PAL_ENV (staging) — the control-plane refuses
  # to start without these (runStartupGuards / grpcTLSCreds). Besides the
  # `secrets:` values listed at the top, supply per environment:
  #   PAL_CONTROL_PLANE_TLS_CERT/KEY gRPC server cert (gateway hop)
  #   PAL_RUNTIME_MANAGER_TLS_CA/CERT/KEY  mTLS client to the runtime-manager
  # e.g.
  # extraEnv:
  #   - {name: PAL_SCHEDULER_GRPC_ADDR, value: "runtime-scheduler:50055"}
  #   - {name: PAL_CONTROL_PLANE_TLS_CERT, value: /etc/pal/tls/tls.crt}
  #   - {name: PAL_CONTROL_PLANE_TLS_KEY, value: /etc/pal/tls/tls.key}
  #   - {name: PAL_RUNTIME_MANAGER_TLS_CA, value: /etc/pal/manager-tls/ca.crt}
  #   - {name: PAL_RUNTIME_MANAGER_TLS_CERT, value: /etc/pal/manager-tls/tls.crt}
  #   - {name: PAL_RUNTIME_MANAGER_TLS_KEY, value: /etc/pal/manager-tls/tls.key}
  # extraVolumeMounts:
  #   - {name: cp-tls, mountPath: /etc/pal/tls, readOnly: true}
  #   - {name: manager-tls, mountPath: /etc/pal/manager-tls, readOnly: true}
  # extraVolumes:
  #   - {name: cp-tls, secret: {secretName: pal-control-plane-tls}}
  #   - {name: manager-tls, secret: {secretName: pal-manager-client-tls}}

workflowEngine:
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    LOG_LEVEL: "info"
    PAL_ENV: "staging"
    # --- RLS ---
    # The engine needs BOTH, same as the control-plane. It pings the pool at
    # startup, so a wrong password fails here rather than on the first
    # tenant-scoped query hours later.
    PAL_RLS_ENFORCE: "1"

modelRouter:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    LOG_LEVEL: "info"
    PAL_ENV: "staging"

runtimeManager:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    LOG_LEVEL: "info"
    PAL_ENV: "staging"

dashboard:
  replicas: 2
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

secrets:
  # Supplied at deploy time — never committed. See the runbook.
  #   --set secrets.appDbPassword="$PAL_APP_DB_PASSWORD"
  # This is the credential for the pal_app role that RLS policies apply to;
  # it is NOT the superuser postgres password and must not be set to it (a
  # superuser bypasses RLS, which would leave enforcement silently off).
  appDbPassword: ""
