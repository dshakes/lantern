apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pal.fullname" . }}-runtime-manager
  labels:
    {{- include "pal.componentLabels" (dict "root" . "component" "runtime-manager") | nindent 4 }}
spec:
  replicas: {{ .Values.runtimeManager.replicas }}
  selector:
    matchLabels:
      {{- include "pal.componentSelectorLabels" (dict "root" . "component" "runtime-manager") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pal.componentLabels" (dict "root" . "component" "runtime-manager") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9466"
        prometheus.io/path: /metrics
        {{- with include "pal.mtls.podAnnotations" (dict "root" . "name" "runtime-manager") }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pal.serviceAccountName" . }}
      containers:
        - name: runtime-manager
          image: {{ include "pal.image" (dict "root" . "component" .Values.runtimeManager) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            privileged: true
          ports:
            - name: grpc
              containerPort: 50054
              protocol: TCP
            - name: metrics
              containerPort: 9466
              protocol: TCP
          env:
            # SLI metrics listener (ADR 0041); scraped via pod annotations.
            - name: PAL_METRICS_ADDR
              value: "0.0.0.0:9466"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: LOG_LEVEL
            # Fail-closed in prod-like PAL_ENV without the service token
            # (callers present it as x-lantern-service-token). Without
            # PAL_ENV the service assumes dev and accepts unauthenticated calls.
            - name: PAL_ENV
              value: {{ .Values.runtimeManager.env.PAL_ENV | default .Values.runtimeManager.env.LANTERN_ENV | default "production" | quote }}
            - name: PAL_GRPC_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: grpc-service-token
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "pal.databaseURL" . | quote }}
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: REDIS_URL
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: S3_ENDPOINT
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: S3_BUCKET
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: minio-password
            {{- if .Values.mtls.enabled }}
            # Manager mTLS (its own CA, ADR 0025/0043): server identity, the CA
            # its callers' and VMs' client certs must chain to, and the CA key
            # it signs per-VM guest certs with.
            - name: PAL_MANAGER_TLS_CA
              value: /etc/pal/mtls/ca.crt
            - name: PAL_MANAGER_TLS_CERT
              value: /etc/pal/mtls/tls.crt
            - name: PAL_MANAGER_TLS_KEY
              value: /etc/pal/mtls/tls.key
            - name: PAL_VM_SIGNING_CA_CERT
              value: /etc/pal/manager-ca/tls.crt
            - name: PAL_VM_SIGNING_CA_KEY
              value: /etc/pal/manager-ca/tls.key
            {{- end }}
          volumeMounts:
            - name: dev-kvm
              mountPath: /dev/kvm
            {{- if .Values.mtls.enabled }}
            - name: pal-mtls
              mountPath: /etc/pal/mtls
              readOnly: true
            - name: pal-manager-ca
              mountPath: /etc/pal/manager-ca
              readOnly: true
            {{- end }}
          livenessProbe:
            {{- if .Values.mtls.enabled }}
            # kubelet gRPC probes cannot present a client cert; mTLS ports
            # would fail them, so probe the socket instead.
            tcpSocket:
              port: 50054
            {{- else }}
            grpc:
              port: 50054
            {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            {{- if .Values.mtls.enabled }}
            tcpSocket:
              port: 50054
            {{- else }}
            grpc:
              port: 50054
            {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.runtimeManager.resources | nindent 12 }}
      volumes:
        - name: dev-kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        {{- if .Values.mtls.enabled }}
        - name: pal-mtls
          secret:
            secretName: {{ include "pal.fullname" . }}-runtime-manager-mtls
        - name: pal-manager-ca
          secret:
            secretName: {{ include "pal.fullname" . }}-manager-ca
        {{- end }}
