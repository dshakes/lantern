apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pal.fullname" . }}-control-plane
  labels:
    {{- include "pal.componentLabels" (dict "root" . "component" "control-plane") | nindent 4 }}
spec:
  {{- if not .Values.controlPlane.autoscaling.enabled }}
  replicas: {{ .Values.controlPlane.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pal.componentSelectorLabels" (dict "root" . "component" "control-plane") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pal.componentLabels" (dict "root" . "component" "control-plane") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "pal.serviceAccountName" . }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "pal.componentSelectorLabels" (dict "root" . "component" "control-plane") | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "pal.dbHost" . }} {{ include "pal.dbPort" . }}; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
      containers:
        - name: control-plane
          image: {{ include "pal.image" (dict "root" . "component" .Values.controlPlane) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: {{ .Values.controlPlane.env.LISTEN_ADDR | quote }}
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: LOG_LEVEL
            # Required in prod-like envs (PAL_ENV=prod/production/staging):
            # the startup guards refuse to boot without these rather than run
            # insecurely. Injected unconditionally, empty by default, so dev and
            # kind deployments are unchanged.
            - name: PAL_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: credential-key
            - name: PAL_RECEIPT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: receipt-secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: jwt-secret
            - name: PAL_GRPC_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: grpc-service-token
            # --- RLS enforcement (invariant #7) ---
            # These are injected UNCONDITIONALLY and default to empty, so a
            # values file that sets them actually takes effect. They were absent
            # here while values-staging.yaml declared them, which meant the flag
            # was silently dropped: the deployment came up healthy with RLS
            # completely off — a fail-open on the tenant-isolation control.
            - name: PAL_ENV
              value: {{ .Values.controlPlane.env.PAL_ENV | default .Values.controlPlane.env.LANTERN_ENV | default "production" | quote }}
            - name: PAL_RLS_ENFORCE
              value: {{ .Values.controlPlane.env.PAL_RLS_ENFORCE | default .Values.controlPlane.env.LANTERN_RLS_ENFORCE | default "" | quote }}
            - name: PAL_AUTHZ_ENFORCE
              value: {{ .Values.controlPlane.env.PAL_AUTHZ_ENFORCE | default .Values.controlPlane.env.LANTERN_AUTHZ_ENFORCE | default "" | quote }}
            - name: PAL_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: app-db-password
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "pal.databaseURL" . | quote }}
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: REDIS_URL
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: S3_ENDPOINT
            - name: S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: S3_REGION
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: S3_BUCKET
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: minio-password
            # Prod/staging refuse to start on the stub scheduler (CheckSchedulerAddr).
            - name: PAL_SCHEDULER_GRPC_ADDR
              value: "{{ include "pal.fullname" . }}-runtime-scheduler:{{ .Values.runtimeScheduler.service.grpcPort }}"
            {{- with .Values.controlPlane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.controlPlane.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
      {{- with .Values.controlPlane.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
