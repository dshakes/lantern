{{- if .Values.backup.enabled }}
{{- /* Same dump format and bucket layout as the pal-control-plane chart (postgres/pal-<ts>.sql.gz). */}}
{{- $fn := include "pal.fullname" . }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fn }}-postgres-backup
  labels:
    {{- include "pal.componentLabels" (dict "root" . "component" "postgres-backup") | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            {{- include "pal.componentLabels" (dict "root" . "component" "postgres-backup") | nindent 12 }}
        spec:
          restartPolicy: Never
          volumes:
            - name: dump
              emptyDir: {}
          initContainers:
            # A failed or empty dump fails the pod here, before anything is uploaded or pruned.
            - name: pg-dump
              image: {{ .Values.backup.image | quote }}
              env:
                - name: PGHOST
                  value: {{ include "pal.dbHost" . }}
                - name: PGPORT
                  value: {{ include "pal.dbPort" . | quote }}
                - name: PGSSLMODE
                  value: {{ include "pal.dbSslmode" . }}
                - name: PGUSER
                  value: {{ .Values.postgresql.auth.username | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgresql.auth.database | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $fn }}-secrets
                      key: postgres-password
              command:
                - bash
                - -ec
                - |
                  set -o pipefail
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  pg_dump --no-owner --no-privileges --clean --if-exists | gzip -9 > "/dump/pal-${ts}.sql.gz"
                  echo "${ts}" > /dump/.ts
                  # pg_dump writes this trailer last; its absence means a truncated dump.
                  zcat "/dump/pal-${ts}.sql.gz" | tail -n 5 | grep -q "PostgreSQL database dump complete"
              volumeMounts:
                - {name: dump, mountPath: /dump}
          containers:
            - name: upload
              image: {{ .Values.backup.uploaderImage | quote }}
              env:
                - name: S3_BUCKET
                  value: {{ required "backup.s3Bucket is required when backup.enabled=true" .Values.backup.s3Bucket | quote }}
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.backup.s3Region | quote }}
                {{- if .Values.backup.useChartMinio }}
                - name: S3_ENDPOINT
                  valueFrom:
                    configMapKeyRef:
                      name: {{ $fn }}-config
                      key: S3_ENDPOINT
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    configMapKeyRef:
                      name: {{ $fn }}-config
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $fn }}-secrets
                      key: minio-password
                {{- else }}
                - name: S3_ENDPOINT
                  value: {{ .Values.backup.s3Endpoint | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "backup.existingSecret is required when backup.useChartMinio=false" .Values.backup.existingSecret }}
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.existingSecret }}
                      key: secret-access-key
                {{- end }}
              command:
                - sh
                - -ec
                - |
                  ts="$(cat /dump/.ts)"
                  ep=""; [ -n "$S3_ENDPOINT" ] && ep="--endpoint-url $S3_ENDPOINT"
{{- if .Values.backup.useChartMinio }}
                  aws $ep s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null || aws $ep s3 mb "s3://$S3_BUCKET"
{{- end }}
                  aws $ep s3 cp "/dump/pal-${ts}.sql.gz" "s3://$S3_BUCKET/postgres/pal-${ts}.sql.gz"
                  echo "uploaded s3://$S3_BUCKET/postgres/pal-${ts}.sql.gz"
                  # Prune dumps older than RETENTION_DAYS (ISO dates compare lexically).
                  cutoff="$(date -u -d "-${RETENTION_DAYS} days" +%Y-%m-%d)"
                  aws $ep s3 ls "s3://$S3_BUCKET/postgres/" | while read -r d _ _ key; do
                    if [ -n "${key:-}" ] && [ "$d" \< "$cutoff" ]; then
                      aws $ep s3api delete-object --bucket "$S3_BUCKET" --key "postgres/$key"
                    fi
                  done
              volumeMounts:
                - {name: dump, mountPath: /dump, readOnly: true}
{{- end }}
