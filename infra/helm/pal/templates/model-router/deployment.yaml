apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pal.fullname" . }}-model-router
  labels:
    {{- include "pal.componentLabels" (dict "root" . "component" "model-router") | nindent 4 }}
spec:
  {{- if not .Values.modelRouter.autoscaling.enabled }}
  replicas: {{ .Values.modelRouter.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pal.componentSelectorLabels" (dict "root" . "component" "model-router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pal.componentLabels" (dict "root" . "component" "model-router") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9465"
        prometheus.io/path: /metrics
        {{- with include "pal.mtls.podAnnotations" (dict "root" . "name" "model-router") }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pal.serviceAccountName" . }}
      containers:
        - name: model-router
          image: {{ include "pal.image" (dict "root" . "component" .Values.modelRouter) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 50053
              protocol: TCP
            - name: metrics
              containerPort: 9465
              protocol: TCP
          env:
            # SLI metrics listener (ADR 0041); scraped via pod annotations.
            - name: PAL_METRICS_ADDR
              value: "0.0.0.0:9465"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: LOG_LEVEL
            # Fail-closed in prod-like PAL_ENV without the service token
            # (callers present it as x-pal-service-token). Without
            # PAL_ENV the service assumes dev and accepts unauthenticated calls.
            - name: PAL_ENV
              value: {{ .Values.modelRouter.env.PAL_ENV | default "production" | quote }}
            - name: PAL_GRPC_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: grpc-service-token
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "pal.databaseURL" . | quote }}
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: REDIS_URL
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: S3_ENDPOINT
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: S3_BUCKET
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: minio-password
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: openai-api-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: anthropic-api-key
            # Internal gRPC mTLS (ADR 0043): this port carries tenant provider
            # keys; only the control-plane and workflow-engine may call it.
            {{- include "pal.mtls.env" (dict "root" . "name" "model-router" "peers" (list "control-plane" "workflow-engine")) | nindent 12 }}
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            {{- include "pal.mtls.volumeMounts" (dict "root" . "manager" false) | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- if .Values.mtls.enabled }}
            # kubelet gRPC probes cannot present a client cert; mTLS ports
            # would fail them, so probe the socket instead.
            tcpSocket:
              port: 50053
            {{- else }}
            grpc:
              port: 50053
            {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            {{- if .Values.mtls.enabled }}
            tcpSocket:
              port: 50053
            {{- else }}
            grpc:
              port: 50053
            {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.modelRouter.resources | nindent 12 }}
      {{- if .Values.mtls.enabled }}
      volumes:
        {{- include "pal.mtls.volumes" (dict "root" . "name" "model-router" "manager" false) | nindent 8 }}
      {{- end }}
