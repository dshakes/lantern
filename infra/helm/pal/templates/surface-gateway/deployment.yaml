apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pal.fullname" . }}-surface-gateway
  labels:
    {{- include "pal.componentLabels" (dict "root" . "component" "surface-gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.surfaceGateway.replicas }}
  selector:
    matchLabels:
      {{- include "pal.componentSelectorLabels" (dict "root" . "component" "surface-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pal.componentLabels" (dict "root" . "component" "surface-gateway") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pal.serviceAccountName" . }}
      containers:
        - name: surface-gateway
          image: {{ include "pal.image" (dict "root" . "component" .Values.surfaceGateway) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8444
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8444"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: LOG_LEVEL
            - name: PAL_ENV
              value: {{ .Values.surfaceGateway.env.PAL_ENV | default .Values.surfaceGateway.env.LANTERN_ENV | default "production" | quote }}
            # The control-plane REST port (:8080); the token must match its
            # PAL_GRPC_SERVICE_TOKEN.
            # gRPC, not REST: control_plane.rs is a tonic client (see its header).
            - name: CONTROL_PLANE_ADDR
              value: "http://{{ include "pal.fullname" . }}-control-plane:{{ .Values.controlPlane.service.grpcPort }}"
            - name: PAL_GRPC_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pal.fullname" . }}-secrets
                  key: grpc-service-token
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pal.fullname" . }}-config
                  key: REDIS_URL
          {{- with .Values.surfaceGateway.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.surfaceGateway.resources | nindent 12 }}
