apiVersion: v1
kind: Service
metadata:
  name: {{ include "pal.fullname" . }}-runtime-scheduler
  labels:
    {{- include "pal.componentLabels" (dict "root" . "component" "runtime-scheduler") | nindent 4 }}
spec:
  type: {{ .Values.runtimeScheduler.service.type }}
  ports:
    - port: {{ .Values.runtimeScheduler.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: {{ .Values.runtimeScheduler.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pal.componentSelectorLabels" (dict "root" . "component" "runtime-scheduler") | nindent 4 }}
