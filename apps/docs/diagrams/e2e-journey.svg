<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lantern end-to-end agent lifecycle — develop, test, deploy, run, observe, improve, on one shared runtime substrate">
  <defs>
    <marker id="ej-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a7d6b"/>
    </marker>
    <marker id="ej-arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <style>
      .t    { fill:#f5f0e8; }
      .sub  { fill:#a89e8f; font-size:10.5px; }
      .h    { fill:#fdf8ef; font-weight:700; }
      .code { fill:#fbbf24; font-size:10px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .band { fill:#d8cfc0; font-size:12px; font-weight:700; letter-spacing:.14em; }
      .stg  { font-size:12px; font-weight:700; letter-spacing:.12em; }
      .flow { stroke-dasharray:6 6; animation:ej-dash 1.4s linear infinite; }
      @keyframes ej-dash { to { stroke-dashoffset:-24; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation:none; } }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="660" rx="16" fill="#0a0908"/>
  <rect x="0" y="0" width="1240" height="660" rx="16" fill="none" stroke="#3a2f24"/>

  <text x="32" y="44" class="h" font-size="22">Agent Lifecycle</text>
  <text x="238" y="44" class="sub" font-size="13">develop → test → deploy → run → observe → improve — every stage on the same runtime primitives, no glue code</text>

  <!-- ============ STAGE CARDS ROW 1 ============ -->
  <g transform="translate(32,76)">
    <!-- DEVELOP -->
    <rect x="0" y="0" width="378" height="186" rx="12" fill="#1a1510" stroke="#4a3b28"/>
    <text x="18" y="28" class="stg" fill="#fcd34d">① DEVELOP</text>
    <text x="18" y="52" class="t" font-size="12" font-weight="700">lantern onboard <tspan class="sub">— description → running agent</tspan></text>
    <text x="18" y="71" class="sub">generate-spec / generate-code → create → smoke run, live SSE</text>
    <text x="18" y="93" class="t" font-size="12" font-weight="700">lantern agent dev <tspan class="sub">— the inner loop</tspan></text>
    <text x="18" y="112" class="sub">watch → republish → smoke run → step waterfall · --eval per save</text>
    <text x="18" y="134" class="t" font-size="12" font-weight="700">Visual workflow editor · SDKs (TS / Py / Go)</text>
    <text x="18" y="153" class="sub">graphs that execute · connectors · MCP attachments</text>

    <!-- TEST -->
    <rect x="398" y="0" width="378" height="186" rx="12" fill="#12100c" stroke="#4a3b28"/>
    <text x="416" y="28" class="stg" fill="#c4b5fd">② TEST</text>
    <text x="416" y="52" class="t" font-size="12" font-weight="700">Eval suites + branch baselines</text>
    <text x="416" y="71" class="sub">declarative cases · pin-as-baseline · regression returns HTTP 422 in CI</text>
    <text x="416" y="93" class="t" font-size="12" font-weight="700">Rehearsals</text>
    <text x="416" y="112" class="sub">replay real production failures against the candidate BEFORE traffic</text>
    <text x="416" y="134" class="t" font-size="12" font-weight="700">Cost forecast</text>
    <text x="416" y="153" class="sub">tokens + cost + would-exceed-budget, pre-run</text>

    <!-- DEPLOY -->
    <rect x="796" y="0" width="380" height="186" rx="12" fill="#12100c" stroke="#4a3b28"/>
    <text x="814" y="28" class="stg" fill="#fbbf24">③ DEPLOY</text>
    <text x="814" y="52" class="t" font-size="12" font-weight="700">Immutable versions · A/B experiments</text>
    <text x="814" y="71" class="sub">deterministic FNV-1a splits · auto-promote on &gt;2% lift</text>
    <text x="814" y="93" class="t" font-size="12" font-weight="700">Budgets as policy</text>
    <text x="814" y="112" class="sub">cost/day · cost/run · tokens/day · per-tool limits · hard-fail 402</text>
    <text x="814" y="134" class="t" font-size="12" font-weight="700">Isolation by manifest</text>
    <text x="814" y="153" class="sub">isolation: "shared" | "microvm" — a publish-time property (ADR 0022)</text>
  </g>

  <path class="flow" d="M 410 169 H 428" stroke="#8a7d6b" stroke-width="1.5" fill="none" marker-end="url(#ej-arr)"/>
  <path class="flow" d="M 808 169 H 826" stroke="#8a7d6b" stroke-width="1.5" fill="none" marker-end="url(#ej-arr)"/>

  <!-- ============ STAGE CARDS ROW 2 ============ -->
  <g transform="translate(32,290)">
    <!-- RUN -->
    <rect x="0" y="0" width="378" height="186" rx="12" fill="#0e1512" stroke="#134e4a"/>
    <text x="18" y="28" class="stg" fill="#5eead4">④ RUN</text>
    <text x="18" y="52" class="t" font-size="12" font-weight="700">Two tiers, one journal</text>
    <text x="18" y="71" class="sub">shared inline executor · microVM (Firecracker/Kata) with in-guest tools</text>
    <text x="18" y="93" class="t" font-size="12" font-weight="700">Sessions stream tokens · runs stream steps</text>
    <text x="18" y="112" class="sub">message_delta SSE · step waterfall · park-without-compute approvals</text>
    <text x="18" y="134" class="t" font-size="12" font-weight="700">Channels · schedules · loop agents</text>
    <text x="18" y="153" class="sub">WhatsApp / iMessage / Slack / voice / webchat · tz-aware cron</text>

    <!-- OBSERVE -->
    <rect x="398" y="0" width="378" height="186" rx="12" fill="#12100c" stroke="#4a3b28"/>
    <text x="416" y="28" class="stg" fill="#fda4af">⑤ OBSERVE</text>
    <text x="416" y="52" class="t" font-size="12" font-weight="700">One trace + metric contract</text>
    <text x="416" y="71" class="sub">OTel spans + lantern.run.* metrics share lantern.tenant/run/step attrs</text>
    <text x="416" y="93" class="t" font-size="12" font-weight="700">Verifiable receipts</text>
    <text x="416" y="112" class="sub">Ed25519 over the journal hash — externally checkable at /proof</text>
    <text x="416" y="134" class="t" font-size="12" font-weight="700">Peer-service health</text>
    <text x="416" y="153" class="sub">debounced down/up transitions alert the owner's self-chat</text>

    <!-- IMPROVE -->
    <rect x="796" y="0" width="380" height="186" rx="12" fill="#171226" stroke="#5b3fa8"/>
    <text x="814" y="28" class="stg" fill="#c4b5fd">⑥ IMPROVE</text>
    <text x="814" y="52" class="t" font-size="12" font-weight="700">Feedback flywheel</text>
    <text x="814" y="71" class="sub">per-run 1–5 scores + preferred output → eval cases + rehearsal queue</text>
    <text x="814" y="93" class="t" font-size="12" font-weight="700">Confidence calibration</text>
    <text x="814" y="112" class="sub">realized regret lowers auto-execute confidence per (agent, action)</text>
    <text x="814" y="134" class="t" font-size="12" font-weight="700">Memory distillation <tspan class="sub">(flag-gated)</tspan></text>
    <text x="814" y="153" class="sub">LLM-distilled durable facts from sessions — confidence-floored</text>
  </g>

  <path class="flow" d="M 410 383 H 428" stroke="#8a7d6b" stroke-width="1.5" fill="none" marker-end="url(#ej-arr)"/>
  <path class="flow" d="M 808 383 H 826" stroke="#8a7d6b" stroke-width="1.5" fill="none" marker-end="url(#ej-arr)"/>
  <!-- deploy → run wrap -->
  <path class="flow" d="M 1186 262 V 272 Q 1186 280 1176 280 H 62 Q 52 280 52 288 V 288" stroke="#8a7d6b" stroke-width="1.5" fill="none" marker-end="url(#ej-arr)"/>
  <!-- improve → develop loop -->
  <path class="flow" d="M 986 476 V 496 Q 986 506 976 506 H 232 Q 222 506 222 496 V 486" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#ej-arrg)" opacity="0"/>

  <!-- ============ SUBSTRATE ============ -->
  <g transform="translate(32,506)">
    <rect x="0" y="0" width="1176" height="66" rx="12" fill="#0e1512" stroke="#134e4a" stroke-width="1.5"/>
    <text x="20" y="26" class="band" fill="#5eead4">THE SUBSTRATE UNDER ALL SIX STAGES</text>
    <text x="20" y="48" class="sub"><tspan class="code" font-size="11">journal_events</tspan> — durable steps, replay, receipts · crash recovery · exactly-once side effects · tenant isolation</text>
  </g>

  <!-- improvement loop caption -->
  <path class="flow" d="M 1120 594 H 240" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#ej-arrg)"/>
  <text x="620" y="614" text-anchor="middle" class="sub" fill="#5eead4">the loop: production feedback becomes next release's eval cases — the agent gets better because it ran</text>

</svg>
