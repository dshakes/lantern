<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lantern's five modules — Agent Runtime, Personal Agent, Trust and Governance, Channels and Reach, Developer Experience — all running on one shared runtime substrate">
  <defs>
    <radialGradient id="mo-vign" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#201607" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#0a0908" stop-opacity="0"/>
    </radialGradient>
    <filter id="mo-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="mo-arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <style>
      .t    { fill:#f5f0e8; }
      .sub  { fill:#a89e8f; font-size:11px; }
      .h    { fill:#fdf8ef; font-weight:700; }
      .code { fill:#fbbf24; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .mono { fill:#d8cfc0; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .band { fill:#d8cfc0; font-size:12px; font-weight:700; letter-spacing:.16em; }
      .num  { fill:#f59e0b; font-size:28px; font-weight:800; }
      .chip { font-size:9.5px; font-weight:800; letter-spacing:.06em; }
      .moflow { stroke-dasharray:6 6; animation:mo-dash 1.4s linear infinite; }
      @keyframes mo-dash { to { stroke-dashoffset:-24; } }
      @media (prefers-reduced-motion: reduce) { .moflow { animation:none; } }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="620" rx="18" fill="#0a0908"/>
  <rect x="0" y="0" width="1240" height="620" rx="18" fill="url(#mo-vign)"/>
  <rect x="0" y="0" width="1240" height="620" rx="18" fill="none" stroke="#2a2118"/>

  <text x="32" y="46" class="h" font-size="24" filter="url(#mo-glow)">Five modules, one runtime</text>
  <text x="370" y="46" class="sub" font-size="13">every module is a lens on the same durable, budgeted, multi-tenant core — nothing is a bolt-on</text>

  <!-- ============ ROW 1: three modules ============ -->
  <g transform="translate(32,80)">
    <!-- 1 runtime -->
    <rect x="0" y="0" width="376" height="176" rx="14" fill="#1e1813" stroke="#f59e0b" stroke-width="1.5" filter="url(#mo-glow)"/>
    <text x="20" y="40" class="num">1</text>
    <text x="48" y="34" class="t" font-size="13.5" font-weight="700">Agent Runtime</text>
    <rect x="270" y="18" width="88" height="20" rx="10" fill="#292117" stroke="#f59e0b"/>
    <text x="314" y="32" text-anchor="middle" class="chip" fill="#fbbf24">THE CORE</text>
    <text x="20" y="66" class="sub">Durable workflow engine · capability-based multi-</text>
    <text x="20" y="82" class="sub">LLM router · K8s-default substrate with the fail-</text>
    <text x="20" y="98" class="sub">closed isolation ladder (runc → gVisor → Kata →</text>
    <text x="20" y="114" class="sub">Firecracker) · crash-replay with no re-spent tokens ·</text>
    <text x="20" y="130" class="sub">one W3C trace per spawn · Ed25519 instance identity</text>
    <text x="20" y="158" class="code">two tiers: shared inline · microVM — one journal</text>

    <!-- 2 jarvis -->
    <rect x="400" y="0" width="376" height="176" rx="14" fill="#171310" stroke="#3a2f24"/>
    <text x="420" y="40" class="num">2</text>
    <text x="448" y="34" class="t" font-size="13.5" font-weight="700">Personal Agent — "Jarvis"</text>
    <rect x="694" y="18" width="62" height="20" rx="10" fill="#0e1512" stroke="#134e4a"/>
    <text x="725" y="32" text-anchor="middle" class="chip" fill="#5eead4">LIVE</text>
    <text x="420" y="66" class="sub">WhatsApp + iMessage assistant that texts AS you —</text>
    <text x="420" y="82" class="sub">owner-only, learns your real voice · agentic macOS</text>
    <text x="420" y="98" class="sub">actions · cross-channel memory · life-events engine ·</text>
    <text x="420" y="114" class="sub">skill forge · event scout · time-travel recap ·</text>
    <text x="420" y="130" class="sub">immigration deadline sentinel · draft-and-confirm</text>
    <text x="420" y="158" class="code">the dogfood: 16 agents running the founder's life</text>

    <!-- 3 trust -->
    <rect x="800" y="0" width="376" height="176" rx="14" fill="#171310" stroke="#3a2f24"/>
    <text x="820" y="40" class="num">3</text>
    <text x="848" y="34" class="t" font-size="13.5" font-weight="700">Trust &amp; Governance</text>
    <text x="820" y="66" class="sub">Policy-as-code budgets (hard-fail 402) · eval-in-CI +</text>
    <text x="820" y="82" class="sub">rehearsals (replay real failures pre-merge) · Ed25519</text>
    <text x="820" y="98" class="sub">verifiable receipts · RBAC scopes · gRPC service-token</text>
    <text x="820" y="114" class="sub">trust boundaries · OTel with tenant/run/step ids ·</text>
    <text x="820" y="130" class="sub">AES-256-GCM secrets · RLS on every tenant table</text>
    <text x="820" y="158" class="code">provider idempotency keys</text>
  </g>

  <!-- ============ ROW 2: two modules ============ -->
  <g transform="translate(32,280)">
    <!-- 4 channels -->
    <rect x="0" y="0" width="564" height="140" rx="14" fill="#171310" stroke="#3a2f24"/>
    <text x="20" y="40" class="num">4</text>
    <text x="48" y="34" class="t" font-size="13.5" font-weight="700">Channels &amp; Reach</text>
    <text x="20" y="66" class="sub">WhatsApp · iMessage · Slack · Telegram · Discord · voice (Twilio / LiveKit) ·</text>
    <text x="20" y="82" class="sub">embeddable webchat (<tspan class="code">/widget.js</tspan>, one script tag) · email — signature-verified,</text>
    <text x="20" y="98" class="sub">naturally paced, all riding the same sessions API</text>
    <text x="20" y="124" class="code">a channel is an entry point, not a fork of your agent</text>

    <!-- 5 dx -->
    <rect x="612" y="0" width="564" height="140" rx="14" fill="#171310" stroke="#3a2f24"/>
    <text x="632" y="40" class="num">5</text>
    <text x="660" y="34" class="t" font-size="13.5" font-weight="700">Developer Experience</text>
    <text x="632" y="66" class="sub">TS · Python · Go SDKs · agentic CLI — <tspan class="code">lantern onboard</tspan> (description → running</text>
    <text x="632" y="82" class="sub">agent), <tspan class="code">lantern doctor</tspan>, <tspan class="code">lantern agents dev</tspan> (hot reload → smoke run → live</text>
    <text x="632" y="98" class="sub">waterfall) · visual workflow editor that EXECUTES · MCP registry · A2A cards ·</text>
    <text x="632" y="114" class="sub">forkable agent marketplace with signed settlement</text>
    <text x="632" y="124" class="code" dy="8">one command boots the whole stack: lantern dev</text>
  </g>

  <!-- arrows into substrate -->
  <path class="moflow" d="M 220 456 V 484" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#mo-arrA)"/>
  <path class="moflow" d="M 620 456 V 484" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#mo-arrA)"/>
  <path class="moflow" d="M 1020 456 V 484" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#mo-arrA)"/>

  <!-- ============ SUBSTRATE ============ -->
  <g transform="translate(32,490)">
    <rect x="0" y="0" width="1176" height="76" rx="14" fill="#12100c" stroke="#4a3b28" stroke-width="1.5"/>
    <text x="20" y="28" class="band" fill="#fbbf24" font-size="11">THE SHARED SUBSTRATE UNDER ALL FIVE</text>
    <text x="20" y="52" class="sub">event-sourced <tspan class="code">journal_events</tspan> durability · capability model routing · budget enforcement · RLS multi-tenancy · OTel observability · Postgres + pgvector · Redis · S3</text>
    <text x="20" y="68" class="sub">a Jarvis reply, a workflow run, and a marketplace invocation are all the same thing underneath: a budgeted, journaled, receipted run</text>
  </g>

  <text x="32" y="606" class="sub">module map: services/ · packages/bridge-core · packages/sdk-* · apps/web — maturity detail in the table below this diagram</text>
</svg>
