<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="664" viewBox="0 0 1240 664" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The life of a Lantern run — gates, execution tier, status machine, evidence">
  <defs>
    <radialGradient id="run-vign" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#201607" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#0a0908" stop-opacity="0"/>
    </radialGradient>
    <filter id="run-glowf" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="rl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a7d6b"/>
    </marker>
    <marker id="rl-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="rl-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
    <style>
      .t    { fill:#f5f0e8; }
      .sub  { fill:#a89e8f; font-size:11px; }
      .h    { fill:#fdf8ef; font-weight:700; }
      .code { fill:#fbbf24; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .mono { fill:#d8cfc0; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .band { fill:#d8cfc0; font-size:12px; font-weight:700; letter-spacing:.14em; }
      .st   { font-size:11px; font-weight:700; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .rlflow { stroke-dasharray:6 6; animation:rl-dash 1.3s linear infinite; }
      @keyframes rl-dash { to { stroke-dashoffset:-24; } }
      @media (prefers-reduced-motion: reduce) { .rlflow { animation:none; } }
      .hotspot { fill:transparent; cursor:pointer; transition:fill .15s; }
      .hotspot:hover { fill:rgba(255,255,255,.06); }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="664" rx="16" fill="#0a0908"/>
  <rect x="0" y="0" width="1240" height="664" rx="16" fill="url(#run-vign)"/>
  <rect x="0" y="0" width="1240" height="664" rx="16" fill="none" stroke="#2a2118"/>

  <text x="32" y="44" class="h" font-size="22" filter="url(#run-glowf)">The life of your run</text>
  <text x="248" y="44" class="sub" font-size="13">read top to bottom: gated → executed → tracked → proven</text>

  <!-- ============ 1 · GATES ============ -->
  <text x="32" y="84" class="band" fill="#fbbf24">1 · THE GATES — before anything runs</text>
  <g transform="translate(32,96)">
    <rect x="0" y="0" width="230" height="62" rx="10" fill="#171310" stroke="#3a2f24"/>
    <text x="16" y="26" class="t" font-size="12.5" font-weight="700">Your request</text>
    <text x="16" y="47" class="code">POST /v1/runs</text>

    <rect x="266" y="0" width="220" height="62" rx="10" fill="#171310" stroke="#3a2f24"/>
    <text x="282" y="26" class="t" font-size="12.5" font-weight="700">Who are you?</text>
    <text x="282" y="47" class="sub">auth · everything tenant-fenced</text>

    <rect x="522" y="0" width="220" height="62" rx="10" fill="#171310" stroke="#3a2f24"/>
    <text x="538" y="26" class="t" font-size="12.5" font-weight="700">Can you afford it?</text>
    <text x="538" y="47" class="sub">over budget → HTTP 402, no spend</text>

    <rect x="778" y="0" width="398" height="62" rx="10" fill="#1e1813" stroke="#f59e0b"/>
    <text x="794" y="26" class="t" font-size="12.5" font-weight="700">How sandboxed?</text>
    <text x="794" y="47" class="sub">the manifest decides: <tspan class="code">shared</tspan> or <tspan class="code">microvm</tspan> — caller can't override</text>

    <path class="rlflow" d="M 230 31 H 260" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#rl-amber)"/>
    <path class="rlflow" d="M 486 31 H 516" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#rl-amber)"/>
    <path class="rlflow" d="M 742 31 H 772" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#rl-amber)"/>
  </g>

  <!-- ============ 2 · EXECUTION ============ -->
  <text x="32" y="200" class="band" fill="#fbbf24">2 · EXECUTION — one of two tiers</text>
  <g transform="translate(32,212)">
    <rect x="0" y="0" width="572" height="146" rx="12" fill="#0e1512" stroke="#134e4a"/>
    <text x="18" y="26" class="band" fill="#bef264" font-size="11">SHARED TIER — your own code, fast</text>
    <text x="18" y="46" class="sub">first token in ~50–200 ms · tokens stream live</text>
    <text x="18" y="74" class="t" font-size="12">• workflow graph or plain LLM loop — every step journaled</text>
    <text x="18" y="98" class="t" font-size="12">• risky steps can wait for a human — parked at zero compute</text>
    <text x="18" y="122" class="t" font-size="12">• crash-safe: resumes at the last completed step</text>

    <rect x="604" y="0" width="572" height="146" rx="12" fill="#1c1520" stroke="#7e22ce"/>
    <text x="622" y="26" class="band" fill="#d8b4fe" font-size="11">MICROVM TIER — untrusted code, walled in</text>
    <text x="622" y="46" class="sub">its own virtual machine per workload</text>
    <text x="622" y="74" class="t" font-size="12">• separate kernel · internet access only by allowlist</text>
    <text x="622" y="98" class="t" font-size="12">• tools run inside the VM: <tspan class="code">shell_exec · http_fetch</tspan></text>
    <text x="622" y="122" class="t" font-size="12">• tier down? the run fails loudly — never quietly downgraded</text>
  </g>
  <path class="rlflow" d="M 860 158 Q 660 186 320 210" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#rl-amber)"/>
  <path class="rlflow" d="M 1060 158 Q 1040 186 920 210" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#rl-amber)"/>

  <!-- ============ 3 · STATUS ============ -->
  <text x="32" y="396" class="band" fill="#fbbf24">3 · STATUS — where your run is right now</text>
  <g transform="translate(32,410)">
    <rect x="0" y="0" width="1176" height="92" rx="12" fill="#171310" stroke="#3a2f24"/>
    <g transform="translate(24,20)">
      <rect x="0" y="6" width="86" height="30" rx="8" fill="#2a2118" stroke="#8a7d6b"/><text x="43" y="26" text-anchor="middle" class="st" fill="#d8cfc0">queued</text>
      <rect x="136" y="6" width="92" height="30" rx="8" fill="#1e1813" stroke="#f59e0b"/><text x="182" y="26" text-anchor="middle" class="st" fill="#fbbf24">running</text>
      <rect x="286" y="6" width="96" height="30" rx="8" fill="#152015" stroke="#2dd4bf"/><text x="334" y="26" text-anchor="middle" class="st" fill="#5eead4">succeeded</text>
      <rect x="430" y="6" width="82" height="30" rx="8" fill="#201414" stroke="#f87171"/><text x="471" y="26" text-anchor="middle" class="st" fill="#fca5a5">failed</text>
      <rect x="558" y="6" width="90" height="30" rx="8" fill="#1e1a10" stroke="#eab308"/><text x="603" y="26" text-anchor="middle" class="st" fill="#fde047">waiting</text>
      <rect x="694" y="6" width="104" height="30" rx="8" fill="#2a2118" stroke="#8a7d6b"/><text x="746" y="26" text-anchor="middle" class="st" fill="#d8cfc0">cancelled</text>
      <path class="rlflow" d="M 86 21 H 130" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#rl-amber)"/>
      <path d="M 228 21 H 280" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#rl-arr)"/>
      <path d="M 228 33 Q 330 52 424 33" stroke="#f87171" stroke-width="1.2" fill="none" marker-end="url(#rl-red)"/>
      <path d="M 228 9 Q 400 -12 552 12" stroke="#eab308" stroke-width="1.2" fill="none" marker-end="url(#rl-arr)"/>
      <path d="M 648 21 Q 672 40 700 50 Q 500 66 140 40" stroke="#eab308" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
      <text x="836" y="30" class="sub">a crash re-drives within 30 s — finished work is never re-billed</text>
    </g>
  </g>

  <!-- ============ 4 · EVIDENCE ============ -->
  <text x="32" y="540" class="band" fill="#5eead4">4 · YOUR EVIDENCE — what you hold afterward</text>
  <g transform="translate(32,552)">
    <rect x="0" y="0" width="1176" height="84" rx="12" fill="#0e1512" stroke="#134e4a" stroke-width="1.5"/>
    <text x="20" y="26" class="t" font-size="12.5"><tspan class="mono">journal_events</tspan> — every step on the record, streamed live</text>
    <text x="20" y="50" class="t" font-size="12.5"><tspan class="mono">Ed25519 receipt</tspan> — signed proof anyone can verify, no account needed</text>
    <text x="20" y="74" class="t" font-size="12.5"><tspan class="mono">OTel traces</tspan> — tenant · run · step on every span</text>
  </g>

  <!-- ============ NAVIGATION HOTSPOTS ============ -->
  <a href="/runtime/#shared">
    <title>Shared tier</title>
    <rect class="hotspot" x="32" y="212" width="572" height="40" rx="12"/>
  </a>
  <a href="/runtime/#microvm">
    <title>MicroVM tier</title>
    <rect class="hotspot" x="636" y="212" width="572" height="40" rx="12"/>
  </a>
  <a href="/runtime/durable-execution">
    <title>Durable execution — crash-safe resume</title>
    <rect class="hotspot" x="32" y="322" width="570" height="24"/>
  </a>
  <a href="/runtime/receipts">
    <title>Verifiable receipts</title>
    <rect class="hotspot" x="34" y="588" width="1170" height="24"/>
  </a>
</svg>
