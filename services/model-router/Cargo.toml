[package]
name = "lantern-model-router"
version = "0.1.0"
edition = "2024"

[dependencies]
pal_env = { path = "../../packages/pal-env-rs" }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["tls"] }
# Service-mesh mTLS on :50053 (ADR 0043), shared with gateway/surface-gateway.
pal_grpc_tls = { path = "../../packages/pal-grpc-tls-rs" }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-stream = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# OpenTelemetry — env-gated, no-op by default when OTEL_EXPORTER_OTLP_ENDPOINT is unset.
# Versions pinned to match runtime-manager (opentelemetry 0.27 / tracing-opentelemetry 0.28).
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = "0.28"
redis = { version = "0.27", features = ["tokio-comp"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
pin-project-lite = "0.2"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
prometheus = { version = "0.14", default-features = false }

[dev-dependencies]
# Test-time PKI for the mTLS handshake tests (never in production code).
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
http = "1"
tokio-stream = { version = "0.1", features = ["net"] }
