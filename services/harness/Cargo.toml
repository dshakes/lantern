[package]
name = "pal-harness"
version = "0.1.0"
edition = "2024"
description = "PAL RuntimeHarness — PID 1 init process running inside every PAL microVM"

[[bin]]
name = "pal-harness"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
# ReceiverStream for the in-guest exec server's response stream.
# Already a transitive dep of tonic — no new crate enters the tree.
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# OpenTelemetry — W3C trace-context propagation so the in-VM harness joins
# the distributed trace started by the control-plane at spawn time.
# No OTLP exporter here: the harness forwards raw OTLP bytes via the Report
# stream, so the OTel pipeline for workload spans is in the workload itself.
# We only need the propagation API to read PAL_TRACE_PARENT and inject
# traceparent into outgoing gRPC calls to the manager.
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27" }
# "term" pulls in nix::pty (openpty + Winsize) for interactive `vm exec -t`.
nix = { version = "0.29", features = ["signal", "process", "term"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP client for the http_fetch built-in tool. Uses rustls so no OpenSSL
# is required in the microVM rootfs. Connections are routed through the
# in-VM egress proxy (127.0.0.1:3128) so the egress allowlist is enforced.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
dashmap = "6"
# Broker egress mode (ADR 0026): the manager control channel rides a custom
# vsock connector (tower::service_fn + hyper_util TokioIo). Both are already in
# the lock as tonic dependencies — promoted to direct deps, no new crate.
tower = { version = "0.4", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# mTLS client: harness presents a per-VM client cert to the manager
# `logging` is a rustls DEFAULT feature that default-features = false dropped.
# Without it rustls cannot report why it rejects a certificate chain, which left
# `UnknownIssuer` with no explanation and made the guest's handshake failure
# diagnosable only from the outside. It routes through the `log` crate, which
# tracing-subscriber bridges into tracing, so set RUST_LOG=rustls=trace to see it.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
# SHA-256 for cc_attest. ring is already in the dep tree as a transitive dep of
# rustls (ring = "0.17" in Cargo.lock); this promotes it to a direct dep so
# cc_attest.rs can import ring::digest. No new crate enters the tree.
ring = "0.17"
rustls-pemfile = "2"
rustls-pki-types = "1"

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
