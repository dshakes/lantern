# cargo-audit configuration for lantern-harness.
#
# RUSTSEC-2025-0134: rustls-pemfile 2.2.0 — marked UNMAINTAINED.
# rustls-pemfile is a DIRECT dep (used for TLS cert/key loading in the harness's
# gRPC channel to the runtime-manager) and ALSO pulled transitively by tonic 0.12.
# The successor crate (rustls-pki-types) has a different API; migrating requires
# source changes and a tonic major-version bump. The unmaintained advisory carries
# no known CVE — the crate is functionally complete for its PEM-parsing role.
# Drop when tonic 0.13+ (shipping rustls-pki-types natively) is adopted.

[advisories]
ignore = [
    # rustls-pemfile unmaintained; migration needs tonic major-version bump + source changes.
    "RUSTSEC-2025-0134",
]
