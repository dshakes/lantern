# Build the public site and deploy it to GitHub Pages as one artifact:
#   https://dshakes.github.io/lantern/       <- apps/landing (static export)
#   https://dshakes.github.io/lantern/docs/  <- apps/docs    (static export)
# Both are plain HTML (next.config: output "export") — no server, free hosting.
name: "deploy site (github pages)"

on:
  push:
    branches: [master]
    paths:
      - "apps/landing/**"
      - "apps/docs/**"
      - "docs/assets/diagrams/**"
      - "docs/media/*.gif"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: {}

# Pages deploy needs these; least-privilege otherwise.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build landing + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      - name: Install deps
        run: |
          (cd apps/landing && npm ci)
          (cd apps/docs && npm ci)
      # Repo is github.com/dshakes/lantern → Pages at /lantern. For a custom
      # domain, drop the /lantern prefix from both base paths and the site URL.
      - name: Build landing (site root)
        env:
          PAGES_BASE_PATH: /lantern
          NEXT_PUBLIC_SITE_URL: https://dshakes.github.io/lantern
        run: cd apps/landing && npm run build
      - name: Build docs (/docs)
        env:
          PAGES_BASE_PATH: /lantern/docs
        run: cd apps/docs && npm run build
      - name: Assemble one Pages tree
        run: |
          mkdir -p site
          cp -R apps/landing/out/. site/
          cp -R apps/docs/out site/docs
          touch site/.nojekyll  # serve the _next/* dirs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
