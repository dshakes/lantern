# Build the public site (site/, Astro + Starlight) and deploy it to GitHub Pages
# as one artifact:
#   https://dshakes.github.io/pal/       <- landing, /pal, /runtime, /compare, /about
#   https://dshakes.github.io/pal/docs/  <- Starlight docs
# Plain static HTML, no server. The build fails on any broken docs link.
name: "deploy site (github pages)"

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/deploy-docs.yml"
  # PRs build the site (types, links) without deploying.
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: {}

# Pages deploy needs these; least-privilege otherwise.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Install deps
        run: cd site && npm ci
      # Repo is github.com/dshakes/lantern -> Pages at /lantern (base in
      # site/astro.config.mjs). For a custom domain, change base and site there.
      - name: Build site
        run: cd site && npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
