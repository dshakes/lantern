# docker-build-go — PR gate: every Go service image must build (no push) from the repo-root
# context. Catches Go-version drift (go.mod vs builder tag) and broken `replace ../../gen/go`
# contexts, which silently rotted before. Action SHAs pinned like build-images.yml.
name: docker-build-go

on:
  pull_request:
    paths:
      - "services/**"
      - "packages/**"
      - "gen/**"
      - ".github/workflows/docker-build-go.yml"

permissions:
  contents: read

concurrency:
  group: docker-build-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [control-plane, workflow-engine, runtime-scheduler, scheduler, billing, data-plane-agent, memory, notifier]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
