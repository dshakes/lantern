# microVM integration — live Firecracker boot validation.
#
# Validates the Firecracker microVM backend the way the macOS dev host cannot:
# it cold-boots a REAL microVM and asserts boot + harness heartbeat + a secret
# vended over mTLS, then tears down. See:
#   - infra/firecracker/build-image.sh        (kernel + rootfs build)
#   - infra/firecracker/integration-test.sh   (the assertions)
#   - docs/architecture/04c-microvm-integration-test.md (how + why)
#
# ---------------------------------------------------------------------------
# RUNNER REQUIREMENT: KVM / nested virtualization
# ---------------------------------------------------------------------------
# Firecracker needs /dev/kvm — and GitHub's standard `ubuntu-latest` hosted
# runners DO expose it, since the January 2024 runner image update. What they do
# not do is put the runner user in the `kvm` group, so the device is present and
# unreadable; the udev step below fixes that. This job used to report that state
# as "/dev/kvm absent" and skip, which read as "hosted runners cannot do this"
# and made a paid KVM runner look necessary. It is not.
#
# GitHub does not document the guarantee, so treat it as best-effort: the probe
# still self-skips (green, not red) if a future runner image drops the device,
# and `require_kvm: true` turns that skip into a hard failure for callers that
# need a real boot. If it ever does go away, `MICROVM_RUNNER_LABEL` still points
# the job at a self-hosted / cloud KVM runner without touching this file.
#
# ARM runners are NOT equivalent — virtualization is disabled there. Keep this
# job on x86_64.
name: "microvm · integration (firecracker)"

on:
  pull_request:
    # Only when the runtime backend, harness, or this infra changes — a live
    # boot is expensive, so don't run it on docs-only PRs.
    paths:
      - "services/runtime-manager/**"
      - "services/harness/**"
      - "infra/firecracker/**"
      - "packages/proto/lantern/v1/runtime.proto"
      - ".github/workflows/microvm-integration.yml"
  workflow_dispatch:           # allow manual runs against a KVM runner
    inputs:
      require_kvm:
        description: "Fail (instead of skipping) when /dev/kvm is absent"
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * 1"        # weekly Monday 07:00 UTC nightly-style guard

permissions:
  contents: read

concurrency:
  group: microvm-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  firecracker-boot:
    name: firecracker-boot
    # Defaults to ubuntu-latest (self-skips, no KVM). Set the MICROVM_RUNNER_LABEL
    # repo/org variable to a KVM-capable self-hosted runner label to run for real.
    runs-on: ${{ vars.MICROVM_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # --- KVM gate ------------------------------------------------------
      # Probe for nested virt up front. When absent we mark the job skipped
      # (every later step guards on `steps.kvm.outputs.present`) so the check
      # is GREEN on a runner without KVM rather than a misleading failure.
      # GitHub's standard Linux runners have exposed /dev/kvm since the January
      # 2024 runner image update, but the runner user is not in the `kvm` group,
      # so the device is present and NOT READABLE. The probe below tested
      # readability and reported "absent", which is how this job came to skip on
      # a runner that can in fact boot a VM — and why a KVM runner looked like
      # the only option. This is the documented udev fix (same one the Android
      # emulator action ships). Best-effort: on a runner with no /dev/kvm at all
      # it changes nothing and the probe still skips honestly.
      - name: Grant access to /dev/kvm
        # HOSTED RUNNERS ONLY. The rule is persistent (/etc/udev/rules.d) and
        # mode 0666 opens /dev/kvm to every local process. On an ephemeral
        # GitHub VM that is scoped to this job and destroyed with it. On a
        # SELF-HOSTED runner — which `MICROVM_RUNNER_LABEL` can point this job
        # at — it would outlive the job and weaken the operator's machine, so we
        # do not touch it: a KVM runner is expected to grant access itself, and
        # if it has not, the probe below now says so precisely.
        if: env.RUNNER_ENVIRONMENT == 'github-hosted'
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "no /dev/kvm on this runner; nothing to grant"
          fi

      - name: Probe for KVM
        id: kvm
        run: |
          # Distinguish the two states the old probe collapsed into "absent":
          # a device that is missing is a runner without nested virt, while one
          # that is present but unreadable is a PERMISSIONS problem we can fix.
          # Reporting the second as "absent" sent this work down a blind alley.
          if [ -e /dev/kvm ] && [ ! -r /dev/kvm ]; then
            echo "::warning::/dev/kvm exists but is not readable by $(id -un) \
          (groups: $(id -Gn)) — the udev step above did not take effect."
          fi
          if [ -e /dev/kvm ] && [ -r /dev/kvm ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::/dev/kvm present — running live Firecracker boot validation."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ -e /dev/kvm ]; then
              reason="/dev/kvm is present but UNREADABLE (permissions)"
            else
              reason="/dev/kvm is absent (no nested virt on this runner)"
            fi
            echo "::warning::${reason} — SKIPPING live microVM boot. \
            Set vars.MICROVM_RUNNER_LABEL to a KVM-capable runner to run it for real."
            # A skipped boot and a real boot both render as a green check, so
            # say so in the job summary — otherwise this workflow's history
            # reads as "Firecracker verified" when it has never booted a VM.
            {
              echo "### ⚠️ microVM boot NOT verified"
              echo
              echo "${reason}, so the live Firecracker"
              echo "boot was **skipped**. This check is green because skipping is"
              echo "expected here — it is **not** evidence that Firecracker works."
              echo
              echo "To verify for real, set the \`MICROVM_RUNNER_LABEL\` repo variable"
              echo "to a KVM-capable self-hosted runner label."
            } >> "$GITHUB_STEP_SUMMARY"
            # Opt-in hard failure for callers that need a real boot (e.g. a
            # release gate): dispatch with require_kvm=true.
            if [ "${{ inputs.require_kvm }}" = "true" ]; then
              echo "::error::require_kvm=true but /dev/kvm is absent — failing instead of silently skipping."
              exit 1
            fi
          fi

      - name: Install toolchain (Rust musl + Firecracker + grpcurl)
        if: steps.kvm.outputs.present == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          # protobuf-compiler: runtime-manager's build.rs drives prost-build,
          # which shells out to protoc. Missing here since this job was written —
          # it never surfaced because the KVM gate skipped every step below it.
          sudo apt-get install -y musl-tools e2fsprogs jq curl protobuf-compiler

          # Rust musl target for the static harness binary.
          rustup target add x86_64-unknown-linux-musl

          # Firecracker release binary onto PATH.
          FC_VER="v1.10.1"
          arch="$(uname -m)"
          curl -fsSL "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VER}/firecracker-${FC_VER}-${arch}.tgz" \
            | tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/release-${FC_VER}-${arch}/firecracker-${FC_VER}-${arch}" \
            /usr/local/bin/firecracker
          firecracker --version

          # grpcurl for driving the manager's gRPC API in the test.
          GRPCURL_VER="1.9.1"
          curl -fsSL "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VER}/grpcurl_${GRPCURL_VER}_linux_x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" grpcurl
          sudo install "$RUNNER_TEMP/grpcurl" /usr/local/bin/grpcurl
          grpcurl --version || true

      # --- Rust unit + integration tests ---------------------------------
      # Run the full test suites for runtime-manager and harness on the live
      # Linux/KVM runner where the cgroup-v2 reader path, wasm backend, and
      # egress rate-limit paths are all reachable.  We run these BEFORE the
      # heavier image build so a test regression fails fast.
      - name: cargo test — runtime-manager
        if: steps.kvm.outputs.present == 'true'
        run: |
          set -euo pipefail
          cd services/runtime-manager
          cargo test --all

      - name: cargo test — harness
        if: steps.kvm.outputs.present == 'true'
        run: |
          set -euo pipefail
          cd services/harness
          cargo test --all

      # --- Build the boot image (kernel + rootfs w/ harness) -------------
      # Exports FC_KERNEL_PATH / FC_ROOTFS_PATH into $GITHUB_ENV (the script
      # appends them when running under Actions).
      - name: Build microVM image (vmlinux + rootfs.ext4)
        if: steps.kvm.outputs.present == 'true'
        run: |
          set -euo pipefail
          # Build the harness as the RUNNER user, not under sudo: sudo resets
          # PATH via secure_path, so ~/.cargo/bin is not on it and the script
          # died with "cargo not found". Only the rootfs loop-mount actually
          # needs root — the compile does not — so hand the finished binary to
          # the script through its FC_HARNESS_BIN hook instead of trying to make
          # cargo reachable from root's PATH.
          cargo build --release --target x86_64-unknown-linux-musl \
            --manifest-path services/harness/Cargo.toml
          HARNESS_BIN="$PWD/services/harness/target/x86_64-unknown-linux-musl/release/lantern-harness"
          [ -x "$HARNESS_BIN" ] || { echo "::error::harness build produced no binary at $HARNESS_BIN"; exit 1; }

          # rootfs build needs loop-mount (root); run under sudo, preserve env.
          sudo --preserve-env=GITHUB_ENV,FC_KERNEL_VERSION,ARCH \
            FC_HARNESS_BIN="$HARNESS_BIN" \
            bash infra/firecracker/build-image.sh "$RUNNER_TEMP/fc-image"

      # --- Run the live boot validation ----------------------------------
      - name: Schedule a hello microVM and assert boot + heartbeat + mTLS vend
        if: steps.kvm.outputs.present == 'true'
        env:
          # Set BOTH names: the manager reads RUNTIME_BACKEND today; the task's
          # LANTERN_RUNTIME_BACKEND is set too so the contract is future-proof
          # if/when the config is renamed.
          RUNTIME_BACKEND: firecracker
          LANTERN_RUNTIME_BACKEND: firecracker
        run: |
          set -euo pipefail
          # Same reason as the image build: the script would `cargo build` the
          # manager itself, but it runs under sudo where ~/.cargo/bin is off the
          # PATH. Build it here as the runner user and pass it in via the
          # script's MANAGER_BIN hook, so nothing under sudo needs cargo.
          cargo build --release --manifest-path services/runtime-manager/Cargo.toml
          MANAGER_BIN="$PWD/services/runtime-manager/target/release/lantern-runtime-manager"
          [ -x "$MANAGER_BIN" ] || { echo "::error::no runtime-manager binary at $MANAGER_BIN"; exit 1; }

          # Firecracker + loop devices + TAP setup need root.
          sudo --preserve-env=FC_KERNEL_PATH,FC_ROOTFS_PATH,RUNTIME_BACKEND,LANTERN_RUNTIME_BACKEND \
            MANAGER_BIN="$MANAGER_BIN" EXPECT_VENDSECRET=1 \
            bash infra/firecracker/integration-test.sh

      - name: Skipped (no KVM on this runner)
        if: steps.kvm.outputs.present != 'true'
        run: echo "No /dev/kvm — live microVM boot skipped. This is expected on hosted runners."
