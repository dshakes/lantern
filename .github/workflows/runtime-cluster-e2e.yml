# runtime cluster e2e — validates the data-plane runtime SECURITY posture on a
# REAL Kubernetes cluster (kind + Calico), not unit tests.
#
# This is the cluster-level companion to microvm-integration.yml. Where that one
# cold-boots a Firecracker microVM, this one stands up a kind cluster with a CNI
# that ENFORCES NetworkPolicy (Calico — kind's default kindnet does NOT enforce)
# and runs infra/k8s/validate.sh against it, asserting the always-on isolation
# pieces the runtime-manager's K8s backend depends on.
#
# ---------------------------------------------------------------------------
# WHAT RUNS FOR REAL IN CI (every PR that touches the watched paths):
# ---------------------------------------------------------------------------
#   (a) egress default-deny NetworkPolicy (Calico-enforced) + positive control
#   (b) DNS carve-out still works
#   (c) hardened securityContext (uid 1000, RO rootfs, cap-drop ALL, no-priv-esc,
#       seccomp RuntimeDefault, no SA token) — spec + live kubectl-exec probes
#   (d) PSA `restricted` REJECTS a runAsRoot/privileged pod at admission
#   (f) FAIL-CLOSED: an UNTRUSTED pod requesting a sandbox runtimeClassName
#       (gVisor) that is NOT installed must stay unschedulable / be refused —
#       it must never silently run on runc. The core ADR-0009 invariant, and it
#       is fully testable here WITHOUT gVisor: we assert the REFUSAL, not that
#       untrusted code executes inside a sandbox.
#   (e) the opt-in cluster-side security chart (Kyverno/Cilium/ESO) renders clean
#
# ---------------------------------------------------------------------------
# WHAT IS DOCUMENTED-AND-SKIPPED (CANNOT honestly run on a hosted runner):
# ---------------------------------------------------------------------------
# Real gVisor (runsc) / Kata EXECUTION needs the sandbox handler installed on the
# node's CRI, which on Kata also needs nested virtualization (/dev/kvm). GitHub's
# hosted ubuntu runners provide NEITHER. So we DO NOT — and must not pretend to —
# validate "UNTRUSTED actually runs inside gVisor" or "HOSTILE actually runs
# inside a Kata microVM" here. Those legs require a real sandbox-capable cluster
# (e.g. GKE Agent Sandbox, or a self-hosted node with runsc + kata installed).
# The job's summary echoes exactly what was and was not validated — silent
# omission is unacceptable. The fail-CLOSED refusal of a missing RuntimeClass IS
# validated for real (leg f), because refusal needs no sandbox.
name: "runtime · cluster e2e (kind + calico)"

on:
  pull_request:
    paths:
      - "infra/**"
      - "services/runtime-manager/**"
      - "services/harness/**"
      - "services/control-plane/**"
      - "services/runtime-scheduler/**"
      - "scripts/db-restore-drill.sh"
      - "scripts/check-app-grants.sh"
      - ".github/workflows/runtime-cluster-e2e.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: runtime-cluster-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cluster-e2e:
    name: cluster-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Keep this in lockstep with the default in infra/k8s/validate.sh.
      CALICO_MANIFEST: "https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml"
      # kind-action derives the context from the cluster name; pin both so
      # validate.sh --ci targets the right context.
      KIND_CLUSTER_NAME: "pal-k8s-validate"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create the kind cluster from the repo's pinned config: it sets
      # disableDefaultCNI=true + Calico's pod subnet, so NetworkPolicy is
      # enforced for real once we install Calico below. kind-action does NOT
      # install a CNI when the config disables the default — exactly what we want.
      - name: values-prod renders PAL_AUTHZ_ENFORCE=1
        run: |
          infra/helm/pal/tests/authz-enforce.sh
          infra/helm/pal/tests/legacy-env-keys.sh
          infra/helm/pal/tests/fullname-stability.sh

      - name: Create kind cluster (default CNI disabled)
        uses: helm/kind-action@99576bfa6ddf9a8e612d83b513da5a75875caced # v1.9.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: infra/k8s/kind-cluster.yaml
          wait: "0s" # node is NotReady until a CNI is up — we install Calico next

      - name: Install Calico (real NetworkPolicy enforcement)
        run: |
          set -euo pipefail
          ctx="kind-${KIND_CLUSTER_NAME}"
          echo "::group::apply Calico ($CALICO_MANIFEST)"
          kubectl --context "$ctx" apply -f "$CALICO_MANIFEST"
          echo "::endgroup::"
          kubectl --context "$ctx" -n kube-system rollout status ds/calico-node --timeout=300s
          kubectl --context "$ctx" wait node --all --for=condition=Ready --timeout=180s
          kubectl --context "$ctx" -n kube-system rollout status deploy/coredns --timeout=180s

      - name: Install Helm (for the security-chart render assertions)
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.2

      # The whole point: run validate.sh against the live cluster in --ci mode
      # (the workflow owns the cluster lifecycle, so the script must not create
      # or tear it down). It exits non-zero on ANY failed assertion, failing the
      # job. CLUSTER_CONTEXT points it at the kind-action context.
      - name: Run cluster security validation (validate.sh --ci)
        env:
          CLUSTER_CONTEXT: "kind-${{ env.KIND_CLUSTER_NAME }}"
          NO_COLOR: "1"
        run: bash infra/k8s/validate.sh --ci

      # Honesty: write to the job summary EXACTLY which legs ran for real and
      # which require a sandbox-capable cluster and were intentionally skipped.
      - name: Job summary — what was / was not validated
        if: always()
        run: |
          {
            echo "## Runtime cluster e2e — coverage"
            echo
            echo "Cluster: **kind + Calico** (NetworkPolicy enforced; kindnet does not enforce)."
            echo
            echo "### Validated for real on this hosted runner"
            echo "- **(a)** egress default-deny NetworkPolicy (Calico) + unfenced positive control"
            echo "- **(b)** DNS carve-out still resolves"
            echo "- **(c)** hardened securityContext: uid 1000, RO rootfs, cap-drop ALL, no-priv-esc, seccomp RuntimeDefault, no SA token (spec + live exec probes)"
            echo "- **(d)** PSA \`restricted\` rejects a runAsRoot/privileged pod at admission"
            echo "- **(f)** FAIL-CLOSED: UNTRUSTED pod requesting an uninstalled \`runtimeClassName: gvisor\` stays unschedulable / is refused — never falls back to runc (ADR-0009)"
            echo "- **(e)** opt-in cluster-side security chart (Kyverno/Cilium/ESO) renders clean"
            echo
            echo "### NOT validated here — requires a real sandbox-capable cluster"
            echo "GitHub hosted runners have **no \`runsc\`/gVisor or Kata handler installed** and **no nested virt (\`/dev/kvm\`)**, so these legs are honestly **skipped**, not faked:"
            echo "- UNTRUSTED workload **actually executing inside gVisor** (needs runsc on the node CRI)"
            echo "- HOSTILE workload **actually executing inside a Kata microVM** (needs Kata + \`/dev/kvm\`)"
            echo
            echo "> Run those legs on a sandbox cluster — e.g. **GKE Agent Sandbox** (gVisor default + Kata option) or a self-hosted node with \`runsc\` + Kata installed. The fail-CLOSED *refusal* of a missing RuntimeClass (leg f) IS proven here because refusal needs no sandbox."
          } >> "$GITHUB_STEP_SUMMARY"

          # Also echo to the log so the note is visible without opening the summary tab.
          echo "::notice title=Sandbox execution legs skipped::gVisor/Kata EXECUTION not validated on hosted runner (no runsc/Kata, no /dev/kvm). Fail-closed refusal + NetworkPolicy + securityContext + PSA validated for real. See job summary. Run the execution legs via workflow_dispatch with a CLUSTER_E2E_KUBECONFIG_B64 secret."

  # ---------------------------------------------------------------------------
  # helm-install: the umbrella chart installs and the platform comes up on a real
  # cluster. kind + Calico, so the chart's default-deny NetworkPolicies are
  # ENFORCED (a missing allow rule shows up here as a not-ready pod, not in prod).
  # Only control-plane + runtime-scheduler images are built (Go, fast); the rest of
  # the chart renders + lints but runs 0 replicas (values-ci.yaml).
  # NOT covered: prod TLS/mTLS material, HPA (needs metrics-server), Rust services.
  # ---------------------------------------------------------------------------
  helm-install:
    name: helm-install (kind + calico)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIND_CLUSTER_NAME: "pal-ci"
      CALICO_MANIFEST: "https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml"
      CHART: infra/helm/pal
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.2

      - name: Vendor chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build "$CHART"

      # Static gates first: cheap, and they cover every template incl. the ones that run 0 replicas.
      - name: helm lint + template (dev, ci, prod) + kubeconform
        run: |
          set -euo pipefail
          # prod points at managed Postgres/S3, which the chart requires you to name
          LINT_SETS="--set backup.s3Bucket=lint --set externalDatabase.host=db.example --set externalS3.endpoint=https://s3.example --set externalS3.accessKeyId=k"
          for v in dev ci prod; do
            helm lint "$CHART" -f "$CHART/values-$v.yaml" $LINT_SETS
            helm template pal "$CHART" -f "$CHART/values-$v.yaml" $LINT_SETS \
              > "/tmp/render-$v.yaml"
          done
          for v in dev ci prod; do
            docker run --rm -v /tmp:/tmp ghcr.io/yannh/kubeconform:v0.6.7 \
              -strict -summary -ignore-missing-schemas "/tmp/render-$v.yaml"
          done

      - name: Create kind cluster (default CNI disabled)
        uses: helm/kind-action@99576bfa6ddf9a8e612d83b513da5a75875caced # v1.9.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: infra/k8s/kind-cluster.yaml
          wait: "0s"

      - name: Install Calico
        run: |
          set -euo pipefail
          kubectl apply -f "$CALICO_MANIFEST"
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s
          kubectl wait node --all --for=condition=Ready --timeout=180s
          kubectl -n kube-system rollout status deploy/coredns --timeout=180s

      - name: Build + load control-plane and runtime-scheduler images
        run: |
          set -euo pipefail
          for svc in control-plane runtime-scheduler; do
            docker build -t "pal/$svc:ci" -f "services/$svc/Dockerfile" .
            kind load docker-image "pal/$svc:ci" --name "$KIND_CLUSTER_NAME"
          done

      - name: helm install (values-ci, generated secrets)
        run: |
          set -euo pipefail
          pw="$(openssl rand -hex 16)"
          helm install pal "$CHART" -f "$CHART/values-ci.yaml" \
            --set "secrets.postgresPassword=$pw" --set "secrets.minioPassword=$pw" \
            --set "secrets.grpcServiceToken=$(openssl rand -hex 16)" \
            --set "secrets.schedulerNodeToken=$(openssl rand -hex 16)" \
            --wait --timeout 10m
          echo "PGPASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Smoke - health, /metrics, RLS grants
        run: |
          set -euo pipefail
          kubectl port-forward svc/pal-control-plane 18080:8080 &
          kubectl port-forward deploy/pal-control-plane 19464:9464 &   # /metrics moved off the API port
          kubectl port-forward svc/pal-runtime-scheduler 18085:8085 &
          kubectl port-forward svc/pal-postgresql 15432:5432 &
          sleep 5
          curl -fsS localhost:18080/readyz
          curl -fsS localhost:18085/healthz
          # one real request first so the HTTP histogram has a sample
          curl -fsS localhost:18080/healthz >/dev/null
          # grep -q on a pipe closes it early and makes curl exit 23 under pipefail, so fetch first
          curl -fsS localhost:19464/metrics -o /tmp/cp-metrics.txt
          grep -q '^http_server_request_duration_seconds_count' /tmp/cp-metrics.txt
          curl -fsS localhost:18085/metrics -o /tmp/sched-metrics.txt
          grep -q '^lantern_scheduler_' /tmp/sched-metrics.txt
          DATABASE_URL="postgres://lantern:${PGPASSWORD}@localhost:15432/lantern?sslmode=disable" \
            scripts/check-app-grants.sh

      - name: Backup CronJob produces a restorable dump
        run: |
          set -euo pipefail
          # Marker rows so "restored" means the data came back, not just the schema.
          kubectl exec sts/pal-postgresql -- psql -U lantern -d lantern -v ON_ERROR_STOP=1 -qc \
            "CREATE TABLE ci_restore_marker AS SELECT g AS id FROM generate_series(1, 42) g"
          kubectl create job --from=cronjob/pal-postgres-backup backup-ci
          kubectl wait --for=condition=complete job/backup-ci --timeout=300s
          kubectl logs job/backup-ci -c upload | grep -E '^uploaded s3://.*[.]sql[.]gz'
          # Fetch the real artifact from the in-cluster S3 and restore THAT.
          kubectl port-forward svc/pal-minio 19000:9000 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          export AWS_ACCESS_KEY_ID=lantern AWS_SECRET_ACCESS_KEY="$PGPASSWORD" AWS_DEFAULT_REGION=us-east-1
          for _ in $(seq 30); do curl -s -o /dev/null localhost:19000 && break; sleep 1; done
          key="$(aws --endpoint-url http://localhost:19000 s3 ls s3://lantern-backups/postgres/ | awk '{print $4}' | sort | tail -1)"
          test -n "$key"
          aws --endpoint-url http://localhost:19000 s3 cp "s3://lantern-backups/postgres/$key" /tmp/ci-backup.sql.gz
          DRILL_EXPECT_TABLES="agents runs journal_events ci_restore_marker" \
            scripts/db-restore-drill.sh /tmp/ci-backup.sql.gz | tee /tmp/drill.txt
          grep -Eq 'ci_restore_marker +42 rows' /tmp/drill.txt
          scripts/db-restore-drill.sh --self-test

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -o wide || true
          for p in $(kubectl get pods -o name); do echo "== $p"; kubectl logs "$p" --all-containers --tail=40 || true; done
          kubectl describe pods || true
          kubectl get netpol || true
          kubectl logs -l app.kubernetes.io/part-of=pal --all-containers --tail=100 --prefix || true

  # ---------------------------------------------------------------------------
  # Execution legs (g/h/i): untrusted-runs-on-gVisor, hostile-in-Kata-microVM,
  # hostile-node-is-dedicated. These need a REAL sandbox-capable cluster (runsc +
  # Kata), which GitHub-hosted runners cannot provide. So this job runs ONLY on
  # manual workflow_dispatch AND only when a kubeconfig secret is present —
  # otherwise it no-ops with an honest notice (never a fake green, never a hard
  # fail for the common "no cluster configured" case).
  #
  # To enable: run infra/k8s/gke-agent-sandbox-setup.sh, base64 the kubeconfig,
  # store it as the repo secret CLUSTER_E2E_KUBECONFIG_B64, then dispatch this
  # workflow. validate.sh --ci --execution exits non-zero on any failed leg.
  # ---------------------------------------------------------------------------
  cluster-e2e-execution:
    name: cluster-e2e-execution (real gVisor/Kata)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Gate on the secret WITHOUT referencing it in a job-level if (not allowed):
      # set an output, and skip the real steps when it's absent.
      - name: Check for cluster kubeconfig secret
        id: gate
        env:
          KUBECONFIG_B64: ${{ secrets.CLUSTER_E2E_KUBECONFIG_B64 }}
        run: |
          if [ -n "$KUBECONFIG_B64" ]; then
            echo "have_cluster=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_cluster=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Execution legs skipped::No CLUSTER_E2E_KUBECONFIG_B64 secret set — provision a gVisor/Kata cluster (infra/k8s/gke-agent-sandbox-setup.sh) and store its base64 kubeconfig to run the execution legs."
            {
              echo "## Execution legs (g/h/i) — skipped"
              echo "No \`CLUSTER_E2E_KUBECONFIG_B64\` secret is configured, so the real gVisor/Kata execution legs did not run."
              echo "Set up a cluster with \`infra/k8s/gke-agent-sandbox-setup.sh\` and store its base64 kubeconfig as that secret to enable them."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install kubectl
        if: ${{ steps.gate.outputs.have_cluster == 'true' }}
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Write kubeconfig + run execution legs
        if: ${{ steps.gate.outputs.have_cluster == 'true' }}
        env:
          KUBECONFIG_B64: ${{ secrets.CLUSTER_E2E_KUBECONFIG_B64 }}
          NO_COLOR: "1"
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          export KUBECONFIG="$HOME/.kube/config"
          # The cluster context is whatever the provided kubeconfig's current-context is.
          ctx="$(kubectl config current-context)"
          echo "Using cluster context: $ctx"
          CLUSTER_CONTEXT="$ctx" bash infra/k8s/validate.sh --ci --execution

      - name: Execution-legs summary
        if: ${{ always() && steps.gate.outputs.have_cluster == 'true' }}
        run: |
          {
            echo "## Execution legs (g/h/i) — ran against a real cluster"
            echo "- **(g)** UNTRUSTED workload runs INSIDE gVisor (runsc), proven via /proc/version or a gvisor-labelled node"
            echo "- **(h)** HOSTILE workload runs INSIDE a Kata microVM, proven by guest kernel != host kernel"
            echo "- **(i)** the HOSTILE node is dedicated — no cross-tenant co-tenancy"
            echo
            echo "See the job log for per-assertion PASS/FAIL."
          } >> "$GITHUB_STEP_SUMMARY"
