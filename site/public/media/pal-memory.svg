<circle cx="45" cy="42" r="5" fill="url(#pal-memory-g)"/><text x="57" y="46.5" font-size="13" font-weight="500" fill="#b9bac0">pal</text>
<text x="40" y="80" font-size="23" font-weight="650" letter-spacing="-.4" fill="#fafaf8">One memory per person, across chats</text>
<text x="40" y="105" font-size="14" fill="#8c8e96">iMessage and WhatsApp resolve to the same person, so what they told you on one is there on the other.</text>
<rect x="40" y="168" width="290" height="92" rx="14" fill="#131419" stroke="rgba(250,250,248,.09)"/><text xml:space="preserve" x="58" y="192" font-size="12" font-weight="600" fill="#b9bac0">iMessage</text><text xml:space="preserve" x="312" y="192" font-size="11" fill="#8c8e96" text-anchor="end" class="pal-memory-m">+1 512 555 0142</text><g class="pal-memory-k0"><rect x="58" y="204" width="254" height="32" rx="15" fill="#23252d"/><text xml:space="preserve" x="71" y="225" font-size="13" fill="#fafaf8">moving to Austin in December</text></g><path d="M330 214 C370 214 360 260 400 260" fill="none" stroke="rgba(250,250,248,.16)" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><g class="pal-memory-k1" opacity="0"><circle r="8.4" fill="#ff8a6b" opacity=".22"/><circle r="3.5" fill="#ff8a6b"/></g><rect x="40" y="284" width="290" height="92" rx="14" fill="#131419" stroke="rgba(250,250,248,.09)"/><text xml:space="preserve" x="58" y="308" font-size="12" font-weight="600" fill="#b9bac0">WhatsApp</text><text xml:space="preserve" x="312" y="308" font-size="11" fill="#8c8e96" text-anchor="end" class="pal-memory-m">Priya R.</text><g class="pal-memory-k2"><rect x="58" y="320" width="254" height="32" rx="15" fill="#23252d"/><text xml:space="preserve" x="71" y="341" font-size="13" fill="#fafaf8">can you send the sitter’s number?</text></g><path d="M330 330 C370 330 360 260 400 260" fill="none" stroke="rgba(250,250,248,.16)" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><g class="pal-memory-k3" opacity="0"><circle r="8.4" fill="#ff8a6b" opacity=".22"/><circle r="3.5" fill="#ff8a6b"/></g><rect x="400" y="190" width="200" height="140" rx="18" fill="#1a1c22" stroke="url(#pal-memory-g)" stroke-width="1.5"/><circle cx="440" cy="232" r="20" fill="url(#pal-memory-g)"/><text xml:space="preserve" x="440" y="238" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">P</text><text xml:space="preserve" x="470" y="228" font-size="16" font-weight="650" fill="#fafaf8">Priya</text><text xml:space="preserve" x="470" y="246" font-size="12" fill="#8c8e96">college friend</text><g class="pal-memory-k4" opacity="1"><rect x="416" y="266" width="168" height="20" rx="10" fill="#ff8a6b" fill-opacity="0.14" stroke="#ff8a6b" stroke-opacity=".45"/><text xml:space="preserve" x="500" y="280" font-size="11" font-weight="600" fill="#ff8a6b" text-anchor="middle">2 handles · 1 person</text></g><text xml:space="preserve" x="416" y="312" font-size="10.5" fill="#8c8e96" class="pal-memory-m">/v1/people/resolve</text><text xml:space="preserve" x="640" y="160" font-size="15" font-weight="650" fill="#fafaf8">Timeline</text><text xml:space="preserve" x="640" y="178" font-size="12" fill="#8c8e96">dated episodes, both channels</text><path d="M652 196 V352" fill="none" stroke="rgba(250,250,248,.16)" stroke-width="1.5" stroke-linecap="round"/><g class="pal-memory-k5" opacity="1"><circle cx="652" cy="210" r="5" fill="#0b0c0f" stroke="#ff8a6b" stroke-width="2"/><text xml:space="preserve" x="668" y="214" font-size="11.5" fill="#8c8e96">Oct 21 · iMessage</text><text xml:space="preserve" x="668" y="232" font-size="13" fill="#fafaf8">moving to Austin in December</text></g><g class="pal-memory-k6" opacity="1"><circle cx="652" cy="262" r="5" fill="#0b0c0f" stroke="#ff8a6b" stroke-width="2"/><text xml:space="preserve" x="668" y="266" font-size="11.5" fill="#8c8e96">Oct 25 · WhatsApp</text><text xml:space="preserve" x="668" y="284" font-size="13" fill="#fafaf8">asked for the sitter’s number</text></g><g class="pal-memory-k7" opacity="1"><circle cx="652" cy="314" r="5" fill="#0b0c0f" stroke="#ff8a6b" stroke-width="2"/><text xml:space="preserve" x="668" y="318" font-size="11.5" fill="#8c8e96">Oct 27 · iMessage</text><text xml:space="preserve" x="668" y="336" font-size="13" fill="#fafaf8">Saturday at the park?</text></g><path d="M600 260 H630" fill="none" stroke="rgba(250,250,248,.16)" stroke-width="1.5" marker-end="url(#pal-memory-ar)" stroke-linecap="round" opacity="0.9"/><rect x="40" y="410" width="880" height="104" rx="16" fill="#131419" stroke="rgba(250,250,248,.09)"/><text xml:space="preserve" x="58" y="434" font-size="12" fill="#8c8e96">Later, on WhatsApp</text><g class="pal-memory-k8"><rect x="58" y="446" width="300" height="32" rx="15" fill="#23252d"/><text xml:space="preserve" x="71" y="467" font-size="13" fill="#fafaf8">how’s the house hunt going?</text></g><g class="pal-memory-k9"><rect x="522" y="446" width="380" height="32" rx="15" fill="url(#pal-memory-g)"/><text xml:space="preserve" x="535" y="467" font-size="13" fill="#fff">slowly! you’re still set for austin in dec, right?</text></g><g class="pal-memory-k10" opacity="1"><text xml:space="preserve" x="902" y="504" font-size="11" fill="#ff8a6b" text-anchor="end">recalled from iMessage · Oct 21</text></g><g class="pal-memory-k11" opacity="0"><circle r="8.4" fill="#ff8a6b" opacity=".22"/><circle r="3.5" fill="#ff8a6b"/></g>
</svg>
