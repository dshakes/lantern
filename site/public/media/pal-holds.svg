6 H914" stroke="rgba(250,250,248,.09)"/><circle cx="770" cy="176" r="11" fill="#23252d"/><text xml:space="preserve" x="770" y="180.5" font-size="11" font-weight="600" fill="#b9bac0" text-anchor="middle">P</text><text xml:space="preserve" x="770" y="200" font-size="11" fill="#b9bac0" text-anchor="middle">pal</text><text xml:space="preserve" x="898" y="180" font-size="10" fill="#8c8e96" text-anchor="end">self-chat</text><g class="pal-holds-k9"><rect x="638" y="222" width="262" height="68" rx="15" fill="#23252d"/><rect x="638" y="230" width="3" height="52" rx="1.5" fill="#ffb547"/><text xml:space="preserve" x="651" y="243" font-size="13" font-weight="650" fill="#ffb547">HELD · Jordan is asking for money</text><text xml:space="preserve" x="651" y="261" font-size="13" fill="#fafaf8">Draft: “sure, sending it tonight”</text><text xml:space="preserve" x="651" y="279" font-size="12" fill="#8c8e96">reply send, or tell me what to say</text></g><g class="pal-holds-k10"><rect x="720" y="310" width="182" height="32" rx="15" fill="url(#pal-holds-g)"/><text xml:space="preserve" x="733" y="331" font-size="13" fill="#fff">say I’ll call him tonight</text></g><g class="pal-holds-k11"><rect x="638" y="356" width="240" height="50" rx="15" fill="#23252d"/><text xml:space="preserve" x="651" y="377" font-size="13" fill="#fafaf8">Sent to Jordan:</text><text xml:space="preserve" x="651" y="395" font-size="13" fill="#fafaf8">“let me call you tonight”</text><circle cx="860" cy="375" r="8" fill="#5fd3a6" fill-opacity=".16" stroke="#5fd3a6" stroke-opacity=".6"/><path d="M856.64 375 l2.4 2.56 l4.4 -4.96" fill="none" stroke="#5fd3a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
