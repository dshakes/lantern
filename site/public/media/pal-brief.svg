erve" x="625" y="419" font-size="13" fill="#fafaf8">“Sat works! 11 at the park?”</text><text xml:space="preserve" x="625" y="437" font-size="12" fill="#8c8e96">reply send to approve</text></g><g class="pal-brief-k14"><rect x="840" y="452" width="62" height="32" rx="15" fill="url(#pal-brief-g)"/><text xml:space="preserve" x="853" y="473" font-size="13" fill="#fff">send</text></g><g class="pal-brief-k15"><text xml:space="preserve" x="902" y="503" font-size="11.5" fill="#8c8e96" text-anchor="end">Sent to Priya</text><circle cx="806" cy="499" r="7" fill="#5fd3a6" fill-opacity=".16" stroke="#5fd3a6" stroke-opacity=".6"/><path d="M803.06 499 l2.1 2.24 l3.8500000000000005 -4.34" fill="none" stroke="#5fd3a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><g class="pal-brief-k16"><circle cx="296" cy="196" r="10" fill="#5fd3a6" fill-opacity=".16" stroke="#5fd3a6" stroke-opacity=".6"/><path d="M291.8 196 l3 3.2 l5.5 -6.2" fill="none" stroke="#5fd3a6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text xml:space="preserve" x="40" y="432" font-size="12" font-weight="500" fill="#8c8e96">Reactions act on the top item</text><rect x="40" y="446" width="122" height="36" rx="18" fill="#131419" stroke="rgba(250,250,248,.09)"/><text xml:space="preserve" x="56" y="469" font-size="14" fill="#fafaf8">👍</text><text xml:space="preserve" x="80" y="469" font-size="12.5" fill="#b9bac0">do it</text><rect x="172" y="446" width="122" height="36" rx="18" fill="#131419" stroke="rgba(250,250,248,.09)"/><text xml:space="preserve" x="188" y="469" font-size="14" fill="#fafaf8">👎</text><text xml:space="preserve" x="212" y="469" font-size="12.5" fill="#b9bac0">skip</text><rect x="304" y="446" width="122" height="36" rx="18" fill="#131419" stroke="rgba(250,250,248,.09)"/><text xml:space="preserve" x="320" y="469" font-size="14" fill="#fafaf8">⏰</text><text xml:space="preserve" x="344" y="469" font-size="12.5" fill="#b9bac0">snooze</text><rect x="436" y="446"