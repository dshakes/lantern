-weight="650" fill="#fafaf8">World model</text><text xml:space="preserve" x="636" y="186" font-size="11.5" fill="#8c8e96" text-anchor="end" class="pal-world-m">## Now</text><text xml:space="preserve" x="402" y="222" font-size="13" fill="#b9bac0">store opening</text><g class="pal-world-k3" opacity="0"><text xml:space="preserve" x="560" y="222" font-size="13" font-weight="650" fill="#8c8e96">Nov 10</text><path d="M558 218 H608" stroke="#ff8a8a" stroke-width="1.5"/></g><g class="pal-world-k4" opacity="1"><text xml:space="preserve" x="560" y="222" font-size="13" font-weight="650" fill="#5fd3a6">Nov 18</text></g><g class="pal-world-k5" opacity="1"><text xml:space="preserve" x="402" y="240" font-size="10.5" fill="#8c8e96" class="pal-world-m">source: mail “Opening moved to Nov 18”</text></g><path d="M402 256 H636" stroke="rgba(250,250,248,.09)"/><text xml:space="preserve" x="402" y="280" font-size="13" fill="#b9bac0">1:1 with Sam</text><text xml:space="preserve" x="560" y="280" font-size="13" font-weight="650" fill="#fafaf8">Thu 10:00</text><text xml:space="preserve" x="402" y="298" font-size="10.5" fill="#8c8e96" class="pal-world-m">source: calendar</text><g class="pal-world-k6" opacity="1"><rect x="402" y="316" width="150" height="20" rx="10" fill="#8c8e96" fill-opacity="0.08" stroke="#8c8e96" stroke-opacity=".45"/><text xml:space="preserve" x="477" y="330" font-size="11" font-weight="600" fill="#8c8e96" text-anchor="middle">no source → dropped</text></g><g class="pal-world-k7" opacity="1"><rect x="384" y="368" width="270" height="52" rx="14" fill="#131419" stroke="#ff8a6b"/><text xml:space="preserve" x="400" y="391" font-size="12.5" fill="#fafaf8">🧭 updated what I know:</text><text xml:space="preserve" x="400" y="409" font-size="12.5" fill="#b9bac0">opening is Nov 18 (from mail)</text></g><text xml:space="preserve" x="690" y="152" font-size="12" font-weight="500" fill="#8c8e96">Nudges</text><g class="pal-world-k8"><rect x="690" y="166" width="230" height="70" rx="16" fill="#1a1c22" stroke="rgba(250,250,248,.16)"/><circle cx="712" cy="188" r="8" fill="url(#pal-world-g)"/><text xml:space="preserve" x="726" y="192" font-size="11.5" font-weight="600" fill="#b9bac0">pal</text><text xml:space="preserve" x="904" y="192" font-size="11" fill="#8c8e96" text-anchor="end">in 10 min</text><text xml:space="preserve" x="704" y="212" font-size="13" font-weight="600" fill="#fafaf8">1:1 with Sam starts soon</text><text xml:space="preserve" x="704" y="228" font-size="12" fill="#8c8e96">pulling up your last thread</text></g><g class="pal-world-k9"><rect x="690" y="250" width="230" height="70" rx="16" fill="#1a1c22" stroke="rgba(250,250,248,.16)"/><circle cx="712" cy="272" r="8" fill="url(#pal-world-g)"/><text xml:space="preserve" x="726" y="276" font-size="11.5" font-weight="600" fill="#b9bac0">pal</text><text xml:space="preserve" x="904" y="276" font-size="11" fill="#8c8e96" text-anchor="end">3 days</text><text xml:space="preserve" x="704" y="296" font-size="13" font-weight="600" fill="#fafaf8">You haven’t replied to Priya</text><text xml:space="preserve" x="704" y="312" font-size="12" fill="#8c8e96">want me to take a crack at it?</text></g><g class="pal-world-k10"><rect x="690" y="334" width="230" height="70" rx="16" fill="#1a1c22" stroke="rgba(250,250,248,.16)"/><circle cx="712" cy="356" r="8" fill="url(#pal-world-g)"/><text xml:space="preserve" x="726" y="360" font-size="11.5" font-weight="600" fill="#b9bac0">pal</text><text xml:space="preserve" x="904" y="360" font-size="11" fill="#8c8e96" text-anchor="end">tomorrow</text><text xml:space="preserve" x="704" y="380" font-size="13" font-weight="600" fill="#fafaf8">Your anniversary is tomorrow</text><text xml:space="preserve" x="704" y="396" font-size="12" fill="#8c8e96">want me to draft something?</text></g><g class="pal-world-k11" opacity="0"><circle r="8.4" fill="#ff8a6b" opacity=".22"/><circle r="3.5" fill="#ff8a6b"/></g><g><text xml:space="preserve" x="690" y="430" font-size="11.5" fill="#8c8e96">Quiet hours, mute and the kill switch apply.</text></g>
