<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d">
<title id="t">How PAL Runtime works</title>
<desc id="d">Your code, the pal CLI and the dashboard call the control plane over REST, directly or through the gateway. The control plane authenticates, applies budgets and tenant isolation, and hands work to the workflow engine, which journals every step. Model calls go through the model router by capability. Untrusted code runs in a microVM that the runtime scheduler places and the runtime manager starts. Every internal gRPC hop needs the shared service token.</desc>
