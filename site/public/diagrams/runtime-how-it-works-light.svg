<text class="t" x="263" y="305">Runtime manager</text>
<text class="s" x="263" y="323">:50054 · starts them</text>
<rect class="card" x="40" y="208" width="179" height="132" rx="12" filter="url(#sh)"/>
<rect class="soft" x="40" y="208" width="179" height="132" rx="12"/><rect class="ring" x="40.75" y="208.75" width="177.5" height="130.5" rx="11.25"/>
<text class="k ka" x="56" y="243.5">04</text>
<text class="t" x="56" y="261.5">microVM</text>
