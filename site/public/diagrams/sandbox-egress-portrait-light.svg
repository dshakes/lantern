<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 700" width="420" height="700" role="img" aria-labelledby="t d"><title id="t">Sandbox egress through the host broker</title><desc id="d">An agent tool call runs code in a microVM that has no network card. Its only way out is vsock to a broker on the host. The broker checks every request against the allowlist and adds the credential there, so keys never enter the VM. An allowed host goes through; any other host is refused and audited.</desc><rect width="420" height="700" rx="18" fill="#ffffff"/><rect x="24" y="24" width="372" height="56" rx="12" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5"/><text x="210" y="57.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">tool call from the agent</text><path d="M210 80 L210 108" fill="none" stroke="#e08a00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.1 99.9 L210 108 L213.9 99.9" fill="none" stroke="#e08a00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="108" width="372" height="168" rx="16" fill="#e08a00" fill-opacity="0.09" stroke="#e08a00" stroke-width="1.5"/><text x="210" y="140" font-family="'Inter Tight', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">microVM</text><text x="210" y="162" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">no network card</text><rect x="64" y="184" width="292" height="64" rx="12" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5"/><text x="210" y="210.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">your code</text><text x="210" y="226.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">no keys inside</text><path d="M210 276 L210 320" fill="none" stroke="#4f5fd6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.1 311.9 L210 320 L213.9 311.9" fill="none" stroke="#4f5fd6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="222" y="304" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="start">vsock</text><rect x="24" y="320" width="372" height="228" rx="16" fill="#4f5fd6" fill-opacity="0.09" stroke="#4f5fd6" stroke-width="1.5"/><text x="210" y="352" font-family="'Inter Tight', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">host broker</text><rect x="48" y="372" width="324" height="48" rx="12" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5"/><text x="210" y="401.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">1 allowlist</text><rect x="48" y="432" width="324" height="48" rx="12" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5"/><text x="210" y="461.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">2 add key</text><g fill="none" stroke="#4f5fd6" stroke-width="2" stroke-linecap="round"><circle cx="134" cy="516" r="5"/><path d="M139 516 h11 M146 516 v4 M150 516 v4"/></g><text x="160" y="521" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="start">keys stay here</text><path d="M120 548 L120 596" fill="none" stroke="#1f8a63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M116.1 587.9 L120 596 L123.9 587.9" fill="none" stroke="#1f8a63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 548 L300 596" fill="none" stroke="#d03030" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M296.1 587.9 L300 596 L303.9 587.9" fill="none" stroke="#d03030" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="616" r="11" fill="#1f8a63"/><path d="M115 616 l3.5 3.5 l6.5 -7" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="652" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#146b4b" text-anchor="middle">allowed</text><text x="120" y="674" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">api.github.com</text><circle cx="300" cy="616" r="11" fill="#d03030"/><path d="M295.5 611.5 l9 9 M304.5 611.5 l-9 9" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/><text x="300" y="652" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b42323" text-anchor="middle">refused</text><text x="300" y="674" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">audited</text></svg>
