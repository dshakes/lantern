<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" role="img" aria-labelledby="t d">
<title id="t">Every contact reply passes the same checks</title>
<desc id="d">A contact reply is drafted, checked for bot tells and for drift from your own writing (and regenerated if it fails), given a confidence tier and, if medium or low, refined against the five most similar messages you really sent. Then the commitment gate holds money and promises, the grounding gate holds dates, outcomes and condolences it cannot verify, and the claim verifier rewrites any action pal did not actually take into an intent. What passes is sent; what is held goes to your self-chat.</desc>
<style>
.cv{fill:#0f1014;stroke:#1c1d23;stroke-width:1.5}
.zone{fill:#131419;stroke:#24262d;stroke-width:1.5}
.card{fill:#17181d;stroke:#2a2c33;stroke-width:1.5}
.soft{fill:url(#gs)}.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.ghost{fill:none;stroke:#5c5f68;stroke-width:1.5;stroke-dasharray:4 4}
.chip{fill:#17181d;stroke:#2a2c33;stroke-width:1}
text{font-family:'Inter Tight','Inter',ui-sans-serif,-apple-system,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#fafaf8}
.s{font-size:12px;fill:#b9bac0}
.m{font:11.5px 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#b9bac0}
.xs{font-size:11px;font-weight:500;fill:#8c8e96}
.k{font-size:10.5px;font-weight:650;letter-spacing:.08em;fill:#8c8e96}
.ka{fill:url(#ga)}
.ln,.la{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#5c5f68}.la{stroke:url(#ga)}
.dash{stroke-dasharray:5 5}
.pkt{fill:url(#ga)}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#ff7a3d"/><stop offset="1" stop-color="#e5207f"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#ff7a3d" stop-opacity="0.12"/><stop offset="1" stop-color="#e5207f" stop-opacity="0.12"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.5"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="878.5" height="422.5" rx="16"/>
<rect class="zone" x="24" y="24" width="832" height="140" rx="16"/>
<text class="k ka" x="40" y="48">SOUNDS LIKE YOU</text>
<rect class="card" x="40" y="52" width="179" height="96" rx="12" filter="url(#sh)"/>
<text class="k ka" x="56" y="78">01</text>
<text class="t" x="56" y="96">Draft</text>
<text class="s" x="56" y="114">the contact's session</text>
<text class="s" x="56" y="130">web_search on</text>
<rect class="card" x="247" y="52" width="179" height="96" rx="12" filter="url(#sh)"/>
<text class="k ka" x="263" y="78">02</text>
<text class="t" x="263" y="96">Bot-tell guard</text>
<text class="s" x="263" y="114">stock phrases · repeats</text>
<text class="s" x="263" y="130">voice drift: regenerate</text>
<rect class="card" x="454" y="52" width="179" height="96" rx="12" filter="url(#sh)"/>
<text class="k ka" x="470" y="86.5">03</text>
<text class="t" x="470" y="104.5">Confidence tier</text>
<text class="s" x="470" y="122.5">HIGH · MEDIUM · LOW</text>
<rect class="card" x="661" y="52" width="179" height="96" rx="12" filter="url(#sh)"/>
<text class="k ka" x="677" y="78">04</text>
<text class="t" x="677" y="96">Critique-refine</text>
<text class="s" x="677" y="114">MEDIUM and LOW only</text>
<text class="s" x="677" y="130">vs 5 real messages</text>
<path class="ln" d="M225 100L241 100"/>
<path class="ln" d="M235.5 103.4L241 100L235.5 96.6"/>
<path class="ln" d="M432 100L448 100"/>
<path class="ln" d="M442.5 103.4L448 100L442.5 96.6"/>
<path class="ln" d="M639 100L655 100"/>
<path class="ln" d="M649.5 103.4L655 100L649.5 96.6"/>
<rect class="zone" x="24" y="188" width="832" height="140" rx="16"/>
<text class="k ka" x="40" y="212">ONLY WHAT IS TRUE</text>
<rect class="card" x="40" y="216" width="179" height="96" rx="12" filter="url(#sh)"/>
<text class="k ka" x="56" y="242">05</text>
<text class="t" x="56" y="260">Commitment gate</text>
<text class="s" x="56" y="278">money · promises</text>
<text class="s" x="56" y="294">in any language</text>
<rect class="card" x="247" y="216" width="179" height="96" rx="12" filter="url(#sh)"/>
<text class="k ka" x="263" y="242">06</text>
<text class="t" x="263" y="260">Grounding gate</text>
<text class="s" x="263" y="278">dates · outcomes</text>
<text class="s" x="263" y="294">bad news, jokey tone</text>
<rect class="card" x="454" y="216" width="179" height="96" rx="12" filter="url(#sh)"/>
<text class="k ka" x="470" y="242">07</text>
<text class="t" x="470" y="260">Claim verifier</text>
<text class="s" x="470" y="278">"I sent it" stays only</text>
<text class="s" x="470" y="294">if it happened</text>
<rect class="card" x="661" y="216" width="179" height="96" rx="12" filter="url(#sh)"/>
<rect class="soft" x="661" y="216" width="179" height="96" rx="12"/><rect class="ring" x="661.75" y="216.75" width="177.5" height="94.5" rx="11.25"/>
<text class="k ka" x="677" y="242">08</text>
<text class="t" x="677" y="260">Send</text>
<text class="s" x="677" y="278">paced like your</text>
<text class="s" x="677" y="294">real reply times</text>
<path class="ln" d="M750.5 154L750.5 176L205 176L205 210"/>
<path class="ln" d="M201.6 204.5L205 210L208.4 204.5"/>
<path class="ln" d="M225 264L241 264"/>
<path class="ln" d="M235.5 267.4L241 264L235.5 260.6"/>
<path class="ln" d="M432 264L448 264"/>
<path class="ln" d="M442.5 267.4L448 264L442.5 260.6"/>
<path class="la flow" d="M639 264L655 264"/>
<path class="la" d="M649.5 267.4L655 264L649.5 260.6"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M639 264L655 264"/></circle>
<rect x="40" y="352" width="800" height="52" rx="12" fill="#2a1f0c" stroke="#ffb547" stroke-width="1.5"/>
<text class="t" x="56" y="373">Held for you, never sent</text>
<text class="s" x="56" y="391">Paged to your self-chat. Type the reply yourself, or approve with send where it is offered.</text>
<path class="ln dash" style="stroke:#ffb547" d="M129.5 318L129.5 346"/>
<path class="ln" style="stroke:#ffb547" d="M126.1 340.5L129.5 346L132.9 340.5"/>
<path class="ln dash" style="stroke:#ffb547" d="M336.5 318L336.5 346"/>
<path class="ln" style="stroke:#ffb547" d="M333.1 340.5L336.5 346L339.9 340.5"/>
</svg>
