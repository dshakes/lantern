<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" width="880" height="316" role="img" aria-labelledby="t d">
<title id="t">The life of a microVM</title>
<desc id="d">A schedule request is placed on a node by the runtime scheduler and started by the runtime manager. A running VM can be paused, which snapshots it, stops it and frees its quota slot, then resumed under the same id. A VM with an idle timeout is paused automatically and resumed on the next exec. A fork starts N copies from one snapshot, each with its own id and identity. Delete drains and terminates.</desc>
<style>
.cv{fill:#f6f5f2;stroke:#e2e1dc;stroke-width:1.5}
.zone{fill:#f1f0ec;stroke:#dedcd5;stroke-width:1.5}
.card{fill:#ffffff;stroke:#d9d8d2;stroke-width:1.5}
.soft{fill:url(#gs)}.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.ghost{fill:none;stroke:#9a9ca3;stroke-width:1.5;stroke-dasharray:4 4}
.chip{fill:#ffffff;stroke:#d9d8d2;stroke-width:1}
text{font-family:'Inter Tight','Inter',ui-sans-serif,-apple-system,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#0b0c0f}
.s{font-size:12px;fill:#45474e}
.m{font:11.5px 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#45474e}
.xs{font-size:11px;font-weight:500;fill:#62656d}
.k{font-size:10.5px;font-weight:650;letter-spacing:.08em;fill:#62656d}
.ka{fill:url(#ga)}
.ln,.la{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#9a9ca3}.la{stroke:url(#ga)}
.dash{stroke-dasharray:5 5}
.pkt{fill:url(#ga)}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#4a3ee6"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#4a3ee6" stop-opacity="0.07"/><stop offset="1" stop-color="#0e7490" stop-opacity="0.07"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#1a1408" flood-opacity="0.08"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="878.5" height="314.5" rx="16"/>
<rect class="zone" x="24" y="24" width="832" height="132" rx="16"/>
<text class="k ka" x="40" y="48">START</text>
<rect class="card" x="40" y="52" width="176" height="88" rx="12" filter="url(#sh)"/>
<text class="k ka" x="56" y="74">01</text>
<text class="t" x="56" y="92">Schedule</text>
<text class="s" x="56" y="110">/v1/runtime/schedule</text>
<text class="s" x="56" y="126">over quota: 402</text>
<rect class="card" x="248" y="52" width="176" height="88" rx="12" filter="url(#sh)"/>
<text class="k ka" x="264" y="74">02</text>
<text class="t" x="264" y="92">Place</text>
<text class="s" x="264" y="110">warm pool · region</text>
<text class="s" x="264" y="126">fair share · cost</text>
<rect class="card" x="456" y="52" width="176" height="88" rx="12" filter="url(#sh)"/>
<text class="k ka" x="472" y="74">03</text>
<text class="t" x="472" y="92">Spawn</text>
<text class="s" x="472" y="110">runtime manager</text>
<text class="s" x="472" y="126">Firecracker or Kata</text>
<rect class="card" x="664" y="52" width="176" height="88" rx="12" filter="url(#sh)"/>
<rect class="soft" x="664" y="52" width="176" height="88" rx="12"/><rect class="ring" x="664.75" y="52.75" width="174.5" height="86.5" rx="11.25"/>
<text class="k ka" x="680" y="74">04</text>
<text class="t" x="680" y="92">Running</text>
<text class="s" x="680" y="110">heartbeat every 5 s</text>
<text class="s" x="680" y="126">exec · files · logs</text>
<path class="ln" d="M222 96L242 96"/>
<path class="ln" d="M236.5 99.4L242 96L236.5 92.6"/>
<path class="ln" d="M430 96L450 96"/>
<path class="ln" d="M444.5 99.4L450 96L444.5 92.6"/>
<path class="ln" d="M638 96L658 96"/>
<path class="ln" d="M652.5 99.4L658 96L652.5 92.6"/>
<rect class="zone" x="24" y="180" width="832" height="112" rx="16"/>
<text class="k ka" x="40" y="204">WHILE IT RUNS</text>
<rect class="card" x="664" y="210" width="176" height="68" rx="12" filter="url(#sh)"/>
<text class="t" x="680" y="230.5">Pause</text>
<text class="s" x="680" y="248.5">snapshot and stop</text>
<text class="s" x="680" y="264.5">frees the quota slot</text>
<rect class="card" x="456" y="210" width="176" height="68" rx="12" filter="url(#sh)"/>
<text class="t" x="472" y="230.5">Resume</text>
<text class="s" x="472" y="248.5">same vm id; idle</text>
<text class="s" x="472" y="264.5">VMs on next exec</text>
<rect class="card" x="248" y="210" width="176" height="68" rx="12" filter="url(#sh)"/>
<text class="t" x="264" y="230.5">Fork × N</text>
<text class="s" x="264" y="248.5">from one snapshot</text>
<text class="s" x="264" y="264.5">own id + identity</text>
<rect x="40" y="210" width="176" height="68" rx="12" fill="#fbedea" stroke="#b42323" stroke-width="1.5"/>
<text class="t" x="56" y="230.5">Terminate</text>
<text class="s" x="56" y="248.5">delete with a grace</text>
<text class="s" x="56" y="264.5">period: drain, stop</text>
<path class="la flow" d="M752 146L752 204"/>
<path class="la" d="M748.6 198.5L752 204L755.4 198.5"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M752 146L752 204"/></circle>
<path class="ln" d="M656 244L640 244"/>
<path class="ln" d="M645.5 240.6L640 244L645.5 247.4"/>
</svg>
