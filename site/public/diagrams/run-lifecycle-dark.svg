<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d">
<title id="t">The life of a run</title>
<desc id="d">A POST to /v1/runs is authenticated and checked against the agent budget; over a hard cap it is refused with 402 before any model is called. The run is executed either as a model call or through the workflow interpreter when the agent has a saved graph. Each step writes step_started and step_completed to the journal, model calls go through the router and are recorded against the budget, and the client streams the journal over server-sent events.</desc>
<style>
.cv{fill:#0f1014;stroke:#1c1d23;stroke-width:1.5}
.zone{fill:#131419;stroke:#24262d;stroke-width:1.5}
.card{fill:#17181d;stroke:#2a2c33;stroke-width:1.5}
.soft{fill:url(#gs)}.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.ghost{fill:none;stroke:#5c5f68;stroke-width:1.5;stroke-dasharray:4 4}
.chip{fill:#17181d;stroke:#2a2c33;stroke-width:1}
text{font-family:'Inter Tight','Inter',ui-sans-serif,-apple-system,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#fafaf8}
.s{font-size:12px;fill:#b9bac0}
.m{font:11.5px 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#b9bac0}
.xs{font-size:11px;font-weight:500;fill:#8c8e96}
.k{font-size:10.5px;font-weight:650;letter-spacing:.08em;fill:#8c8e96}
.ka{fill:url(#ga)}
.ln,.la{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#5c5f68}.la{stroke:url(#ga)}
.dash{stroke-dasharray:5 5}
.pkt{fill:url(#ga)}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#8b7fff"/><stop offset="1" stop-color="#14c8f0"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#8b7fff" stop-opacity="0.12"/><stop offset="1" stop-color="#14c8f0" stop-opacity="0.12"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.5"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="878.5" height="298.5" rx="16"/>
<rect class="zone" x="24" y="24" width="832" height="148" rx="16"/>
<text class="k ka" x="40" y="48">ONE RUN, START TO FINISH</text>
<rect class="card" x="40" y="52" width="140.8" height="104" rx="12" filter="url(#sh)"/>
<text class="k ka" x="56" y="82">01</text>
<text class="t" x="56" y="100">POST /v1/runs</text>
<text class="s" x="56" y="118">JWT or API key</text>
<text class="s" x="56" y="134">tenant from auth</text>
<rect class="card" x="204.8" y="52" width="140.8" height="104" rx="12" filter="url(#sh)"/>
<text class="k ka" x="220.8" y="82">02</text>
<text class="t" x="220.8" y="100">Budget check</text>
<text class="s" x="220.8" y="118">daily cost · runs</text>
<text class="s" x="220.8" y="134">hard or soft</text>
<rect class="card" x="369.6" y="52" width="140.8" height="104" rx="12" filter="url(#sh)"/>
<text class="k ka" x="385.6" y="82">03</text>
<text class="t" x="385.6" y="100">Execute</text>
<text class="s" x="385.6" y="118">model call, or</text>
<text class="s" x="385.6" y="134">workflow graph</text>
<rect class="card" x="534.4" y="52" width="140.8" height="104" rx="12" filter="url(#sh)"/>
<text class="k ka" x="550.4" y="82">04</text>
<text class="t" x="550.4" y="100">Journal</text>
<text class="s" x="550.4" y="118">step_started</text>
<text class="s" x="550.4" y="134">step_completed</text>
<rect class="card" x="699.2" y="52" width="140.8" height="104" rx="12" filter="url(#sh)"/>
<rect class="soft" x="699.2" y="52" width="140.8" height="104" rx="12"/><rect class="ring" x="699.95" y="52.75" width="139.3" height="102.5" rx="11.25"/>
<text class="k ka" x="715.2" y="82">05</text>
<text class="t" x="715.2" y="100">Stream</text>
<text class="s" x="715.2" y="118">SSE from the</text>
<text class="s" x="715.2" y="134">journal</text>
<path class="ln" d="M185.8 104L199.8 104"/>
<path class="ln" d="M194.3 107.4L199.8 104L194.3 100.6"/>
<path class="la flow" d="M351.6 104L363.6 104"/>
<path class="la" d="M358.1 107.4L363.6 104L358.1 100.6"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M351.6 104L363.6 104"/></circle>
<path class="la flow" d="M516.4 104L528.4 104"/>
<path class="la" d="M522.9 107.4L528.4 104L522.9 100.6"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M516.4 104L528.4 104"/></circle>
<path class="la flow" d="M681.2 104L693.2 104"/>
<path class="la" d="M687.7 107.4L693.2 104L687.7 100.6"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M681.2 104L693.2 104"/></circle>
<rect x="204.8" y="204" width="140.8" height="72" rx="12" fill="#2a1414" stroke="#ff8a8a" stroke-width="1.5"/>
<text class="t" x="220.8" y="226.5">402</text>
<text class="s" x="220.8" y="244.5">hard cap hit;</text>
<text class="s" x="220.8" y="260.5">no model call</text>
<path class="ln dash" style="stroke:#ff8a8a" d="M275.2 162L275.2 198"/>
<path class="ln" style="stroke:#ff8a8a" d="M271.8 192.5L275.2 198L278.6 192.5"/>
<rect class="card" x="369.6" y="204" width="305.6" height="72" rx="12" filter="url(#sh)"/>
<text class="t" x="385.6" y="226.5">Model router</text>
<text class="s" x="385.6" y="244.5">"auto" or a capability -&gt; a provider model</text>
<text class="s" x="385.6" y="260.5">usage recorded against the budget</text>
<path class="ln" d="M440 162L440 198"/>
<path class="ln" d="M436.6 192.5L440 198L443.4 192.5"/>
</svg>
