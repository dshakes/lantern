<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" role="img" aria-labelledby="t d">
<title id="t">A run resumes after a crash</title>
<desc id="d">Each finished step is written to the run journal. The process crashes during step 3. The recovery sweep finds the run whose lock has expired and takes the lock. Steps 1 and 2 are replayed from the journal, not re-run. Step 3 runs again with the same idempotency key, so the provider bills it once.</desc>
<style>
.cv{fill:#f6f5f2;stroke:#e2e1dc;stroke-width:1.5}
.zone{fill:#f1f0ec;stroke:#dedcd5;stroke-width:1.5}
.card{fill:#ffffff;stroke:#d9d8d2;stroke-width:1.5}
.soft{fill:url(#gs)}.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.ghost{fill:none;stroke:#9a9ca3;stroke-width:1.5;stroke-dasharray:4 4}
.chip{fill:#ffffff;stroke:#d9d8d2;stroke-width:1}
text{font-family:'Inter Tight','Inter',ui-sans-serif,-apple-system,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#0b0c0f}
.s{font-size:12px;fill:#45474e}
.m{font:11.5px 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#45474e}
.xs{font-size:11px;font-weight:500;fill:#62656d}
.k{font-size:10.5px;font-weight:650;letter-spacing:.08em;fill:#62656d}
.ka{fill:url(#ga)}
.ln,.la{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#9a9ca3}.la{stroke:url(#ga)}
.dash{stroke-dasharray:5 5}
.pkt{fill:url(#ga)}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#4a3ee6"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#4a3ee6" stop-opacity="0.07"/><stop offset="1" stop-color="#0e7490" stop-opacity="0.07"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#1a1408" flood-opacity="0.08"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="878.5" height="342.5" rx="16"/>
<rect class="zone" x="24" y="24" width="832" height="124" rx="16"/>
<text class="k ka" x="40" y="48">BEFORE THE CRASH</text>
<rect x="40" y="52" width="168" height="80" rx="12" fill="#e6f4ee" stroke="#146b4b" stroke-width="1.5"/>
<text class="k" x="56" y="78.5" style="fill:#146b4b">01</text>
<text class="t" x="56" y="96.5">Step 1</text>
<text class="s" x="56" y="114.5">step_completed</text>
<rect x="256" y="52" width="168" height="80" rx="12" fill="#e6f4ee" stroke="#146b4b" stroke-width="1.5"/>
<text class="k" x="272" y="78.5" style="fill:#146b4b">02</text>
<text class="t" x="272" y="96.5">Step 2</text>
<text class="s" x="272" y="114.5">step_completed</text>
<rect x="472" y="52" width="168" height="80" rx="12" fill="#fbedea" stroke="#b42323" stroke-width="1.5"/>
<text class="k" x="488" y="78.5" style="fill:#b42323">03</text>
<text class="t" x="488" y="96.5">Step 3</text>
<text class="s" x="488" y="114.5">crash mid-call</text>
<path class="ln" d="M214 92L250 92"/>
<path class="ln" d="M244.5 95.4L250 92L244.5 88.6"/>
<path class="ln" d="M430 92L466 92"/>
<path class="ln" d="M460.5 95.4L466 92L460.5 88.6"/>
<rect class="card" x="672" y="52" width="168" height="80" rx="12" filter="url(#sh)"/>
<rect class="soft" x="672" y="52" width="168" height="80" rx="12"/><rect class="ring" x="672.75" y="52.75" width="166.5" height="78.5" rx="11.25"/>
<text class="t" x="688" y="78.5">Recovery sweep</text>
<text class="s" x="688" y="96.5">every 30 s</text>
<text class="s" x="688" y="112.5">takes the expired lock</text>
<path class="ln dash" style="stroke:#b42323" d="M646 92L666 92"/>
<path class="ln" style="stroke:#b42323" d="M660.5 95.4L666 92L660.5 88.6"/>
<rect class="zone" x="24" y="172" width="832" height="148" rx="16"/>
<text class="k ka" x="40" y="196">AFTER RECOVERY · RESUME, NOT RESTART</text>
<rect class="ghost" x="40" y="200" width="168" height="80" rx="12"/>
<text class="k ka" x="56" y="226.5">01</text>
<text class="t" x="56" y="244.5">Step 1</text>
<text class="s" x="56" y="262.5">cached from journal</text>
<rect class="ghost" x="256" y="200" width="168" height="80" rx="12"/>
<text class="k ka" x="272" y="226.5">02</text>
<text class="t" x="272" y="244.5">Step 2</text>
<text class="s" x="272" y="262.5">cached from journal</text>
<rect class="card" x="472" y="200" width="168" height="80" rx="12" filter="url(#sh)"/>
<rect class="soft" x="472" y="200" width="168" height="80" rx="12"/><rect class="ring" x="472.75" y="200.75" width="166.5" height="78.5" rx="11.25"/>
<text class="k ka" x="488" y="218">03</text>
<text class="t" x="488" y="236">Step 3, again</text>
<text class="s" x="488" y="254">same idempotency key</text>
<text class="s" x="488" y="270">billed once</text>
<path class="ln" d="M214 240L250 240"/>
<path class="ln" d="M244.5 243.4L250 240L244.5 236.6"/>
<path class="ln" d="M430 240L466 240"/>
<path class="ln" d="M460.5 243.4L466 240L460.5 236.6"/>
<path class="la flow" d="M756 138L756 240L646 240"/>
<path class="la" d="M651.5 236.6L646 240L651.5 243.4"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M756 138L756 240L646 240"/></circle>
<text class="xs" x="40" y="304">idempotency key = (run_id, step_id, attempt): the provider drops the repeat</text>
</svg>
