<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384" role="img" aria-labelledby="t d"><title id="t">A run resumes after a crash</title><desc id="d">Each finished step is written to the run journal. The process crashes during step 3. The recovery sweep finds the orphaned run and re-acquires its lock. Steps 1 and 2 are replayed from the journal, not re-run. Step 3 runs again with the same idempotency key, so the provider bills it once.</desc><rect width="960" height="384" rx="18" fill="#ffffff"/><text x="32" y="44" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#62656d" text-anchor="start">before the crash</text><rect x="32" y="60" width="192" height="64" rx="12" fill="#1f8a63" fill-opacity="0.09" stroke="#1f8a63" stroke-width="1.5"/><text x="128" y="86.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">step 1</text><text x="128" y="102.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">journaled</text><rect x="256" y="60" width="192" height="64" rx="12" fill="#1f8a63" fill-opacity="0.09" stroke="#1f8a63" stroke-width="1.5"/><text x="352" y="86.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">step 2</text><text x="352" y="102.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">journaled</text><rect x="480" y="60" width="192" height="64" rx="12" fill="#d03030" fill-opacity="0.09" stroke="#d03030" stroke-width="1.5"/><text x="576" y="86.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">step 3</text><text x="576" y="102.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">crash mid-call</text><circle cx="672" cy="60" r="13" fill="#d03030"/><path d="M673.5 53 L668 61 L672 61 L670.5 67 L676 59 L672 59 Z" fill="#ffffff"/><path d="M224 92 L256 92" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M247.9 95.9 L256 92 L247.9 88.1" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M448 92 L480 92" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.9 95.9 L480 92 L471.9 88.1" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="256" y="160" width="424" height="56" rx="12" fill="#4f5fd6" fill-opacity="0.09" stroke="#4f5fd6" stroke-width="1.5"/><text x="468" y="193.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">recovery sweep re-acquires the lock</text><path d="M576 124 L576 160" fill="none" stroke="#4f5fd6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M572.1 151.9 L576 160 L579.9 151.9" fill="none" stroke="#4f5fd6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M576 216 L576 286" fill="none" stroke="#4f5fd6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M572.1 277.9 L576 286 L579.9 277.9" fill="none" stroke="#4f5fd6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="270" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#62656d" text-anchor="start">after recovery</text><rect x="32" y="286" width="192" height="64" rx="12" fill="#ffffff" stroke="#1f8a63" stroke-width="1.5" stroke-dasharray="6 5"/><text x="128" y="312.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">step 1</text><text x="128" y="328.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">from journal</text><rect x="256" y="286" width="192" height="64" rx="12" fill="#ffffff" stroke="#1f8a63" stroke-width="1.5" stroke-dasharray="6 5"/><text x="352" y="312.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">step 2</text><text x="352" y="328.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">from journal</text><rect x="480" y="286" width="192" height="64" rx="12" fill="#e08a00" fill-opacity="0.09" stroke="#e08a00" stroke-width="2"/><text x="576" y="312.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">step 3 again</text><text x="576" y="328.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">same key</text><rect x="704" y="286" width="192" height="64" rx="12" fill="#1f8a63" fill-opacity="0.09" stroke="#1f8a63" stroke-width="1.5"/><text x="800" y="312.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">step 4</text><text x="800" y="328.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">continues</text><path d="M224 318 L256 318" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M247.9 321.9 L256 318 L247.9 314.1" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M448 318 L480 318" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M471.9 321.9 L480 318 L471.9 314.1" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M672 318 L704 318" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M695.9 321.9 L704 318 L695.9 314.1" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="712" y="148" width="216" height="80" rx="12" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5"/><text x="820" y="171.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">billed once</text><text x="820" y="187.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">provider dedups</text><text x="820" y="203.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">the idempotency key</text><path d="M616 286 L616 252 L820 252 L820 228" fill="none" stroke="#e08a00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M823.9 236.1 L820 228 L816.1 236.1" fill="none" stroke="#e08a00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
