<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" height="296" role="img" aria-labelledby="t d">
<title id="t">Budgets are checked before the model is called</title>
<desc id="d">A run request first meets the budget check: the agent caps and the tenant-wide daily cap. Over a hard cap the API returns 402 and no model is called, so the refusal costs nothing. Under the cap, the request is routed by capability to a provider model and the usage is recorded against the day.</desc>
<style>
.cv{fill:#f6f5f2;stroke:#e2e1dc;stroke-width:1.5}
.zone{fill:#f1f0ec;stroke:#dedcd5;stroke-width:1.5}
.card{fill:#ffffff;stroke:#d9d8d2;stroke-width:1.5}
.soft{fill:url(#gs)}.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.ghost{fill:none;stroke:#9a9ca3;stroke-width:1.5;stroke-dasharray:4 4}
.chip{fill:#ffffff;stroke:#d9d8d2;stroke-width:1}
text{font-family:'Inter Tight','Inter',ui-sans-serif,-apple-system,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#0b0c0f}
.s{font-size:12px;fill:#45474e}
.m{font:11.5px 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#45474e}
.xs{font-size:11px;font-weight:500;fill:#62656d}
.k{font-size:10.5px;font-weight:650;letter-spacing:.08em;fill:#62656d}
.ka{fill:url(#ga)}
.ln,.la{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#9a9ca3}.la{stroke:url(#ga)}
.dash{stroke-dasharray:5 5}
.pkt{fill:url(#ga)}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#4a3ee6"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#4a3ee6" stop-opacity="0.07"/><stop offset="1" stop-color="#0e7490" stop-opacity="0.07"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#1a1408" flood-opacity="0.08"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="878.5" height="294.5" rx="16"/>
<rect class="zone" x="24" y="24" width="832" height="248" rx="16"/>
<text class="k ka" x="40" y="48">POLICY AS CODE · PER AGENT AND PER TENANT</text>
<rect class="card" x="40" y="96" width="176" height="96" rx="12" filter="url(#sh)"/>
<text class="k ka" x="56" y="130.5">01</text>
<text class="t" x="56" y="148.5">Run request</text>
<text class="s" x="56" y="166.5">agent + input</text>
<rect class="card" x="256" y="88" width="208" height="112" rx="12" filter="url(#sh)"/>
<rect class="soft" x="256" y="88" width="208" height="112" rx="12"/><rect class="ring" x="256.75" y="88.75" width="206.5" height="110.5" rx="11.25"/>
<text class="k ka" x="272" y="113.5">02</text>
<text class="t" x="272" y="131.5">Budget check</text>
<text class="s" x="272" y="149.5">cost/run · cost/day</text>
<text class="s" x="272" y="165.5">tokens/day · runs/day</text>
<text class="s" x="272" y="181.5">per-tool limits</text>
<rect x="504" y="52" width="336" height="84" rx="12" fill="#e6f4ee" stroke="#146b4b" stroke-width="1.5"/>
<text class="k" x="520" y="72" style="fill:#146b4b">03</text>
<text class="t" x="520" y="90">Under the cap</text>
<text class="s" x="520" y="108">routed by capability to a model;</text>
<text class="s" x="520" y="124">usage recorded for the day</text>
<rect x="504" y="168" width="336" height="84" rx="12" fill="#fbedea" stroke="#b42323" stroke-width="1.5"/>
<text class="t" x="520" y="196.5">Over a hard cap</text>
<text class="s" x="520" y="214.5">402 before any model call;</text>
<text class="s" x="520" y="230.5">the refusal costs nothing</text>
<path class="ln" d="M222 144L250 144"/>
<path class="ln" d="M244.5 147.4L250 144L244.5 140.6"/>
<path class="la flow" d="M470 128L484 128L484 94L498 94"/>
<path class="la" d="M492.5 97.4L498 94L492.5 90.6"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M470 128L484 128L484 94L498 94"/></circle>
<path class="ln dash" style="stroke:#b42323" d="M470 160L484 160L484 210L498 210"/>
<path class="ln" style="stroke:#b42323" d="M492.5 213.4L498 210L492.5 206.6"/>
</svg>
