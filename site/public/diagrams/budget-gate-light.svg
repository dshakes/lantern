<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" width="960" height="376" role="img" aria-labelledby="t d"><title id="t">A budget is checked before the model is called</title><desc id="d">A run request first meets the budget check: a forecast and the daily caps. Over a hard cap, the API returns 402 and no model is called, so it costs nothing. Under the cap, the request is routed by capability to a provider model and the usage is recorded against the budget.</desc><rect width="960" height="376" rx="18" fill="#ffffff"/><rect x="24" y="152" width="168" height="72" rx="12" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5"/><text x="108" y="182.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">run request</text><text x="108" y="198.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">POST /v1/runs</text><path d="M192 188 L240 188" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M231.9 191.9 L240 188 L231.9 184.1" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="136" width="208" height="104" rx="12" fill="#e08a00" fill-opacity="0.09" stroke="#e08a00" stroke-width="2"/><text x="344" y="171.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">budget check</text><text x="344" y="187.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">forecast +</text><text x="344" y="203.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">daily caps</text><path d="M448 168 L488 168 L488 84 L520 84" fill="none" stroke="#d03030" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M511.9 87.9 L520 84 L511.9 80.1" fill="none" stroke="#d03030" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="44" width="208" height="80" rx="12" fill="#d03030" fill-opacity="0.09" stroke="#d03030" stroke-width="1.5"/><text x="624" y="78.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">402 refused</text><text x="624" y="94.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">no model call · $0</text><path d="M448 208 L488 208 L488 292 L520 292" fill="none" stroke="#1f8a63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M511.9 295.9 L520 292 L511.9 288.1" fill="none" stroke="#1f8a63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="252" width="208" height="80" rx="12" fill="#1f8a63" fill-opacity="0.09" stroke="#1f8a63" stroke-width="1.5"/><text x="624" y="286.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">routed</text><text x="624" y="302.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">by capability</text><path d="M728 292 L760 292" fill="none" stroke="#1f8a63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M751.9 295.9 L760 292 L751.9 288.1" fill="none" stroke="#1f8a63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="760" y="252" width="176" height="80" rx="12" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5"/><text x="848" y="286.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">usage</text><text x="848" y="302.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">recorded</text><text x="498" y="140" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b42323" text-anchor="start">over cap</text><text x="498" y="246" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#146b4b" text-anchor="start">under cap</text></svg>
