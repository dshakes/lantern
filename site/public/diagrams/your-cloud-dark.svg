<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" width="960" height="376" role="img" aria-labelledby="t d"><title id="t">PAL Runtime in your cloud</title><desc id="d">The control plane is run by us or self-hosted by you. The data plane runs inside your VPC with the microVM sandboxes and the run data. It dials out to the control plane and holds one connection open; run assignments come back down it. There are no inbound ports.</desc><rect width="960" height="376" rx="18" fill="#111216"/><rect x="24" y="72" width="300" height="232" rx="16" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="174" y="108" font-family="'Inter Tight', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#fafaf8" text-anchor="middle">control plane</text><text x="174" y="132" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">hosted by us, or by you</text><rect x="48" y="156" width="252" height="52" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="174" y="187" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">API · console</text><rect x="48" y="224" width="252" height="52" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="174" y="255" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">scheduling · routing</text><rect x="504" y="32" width="432" height="312" rx="18" fill="#111216" stroke="#7c8cff" stroke-width="1.5" stroke-dasharray="6 5"/><text x="528" y="62" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#b9bac0" text-anchor="start">your VPC</text><rect x="536" y="84" width="368" height="92" rx="12" fill="#f5a524" fill-opacity="0.12" stroke="#f5a524" stroke-width="1.5"/><text x="720" y="125" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">data plane</text><text x="720" y="139" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">runs inside your account</text><rect x="536" y="196" width="176" height="116" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="624" y="249" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">microVM</text><text x="624" y="263" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">sandboxes</text><rect x="728" y="196" width="176" height="116" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="816" y="249" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">run data</text><text x="816" y="263" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">stays here</text><path d="M536 116 L324 116" fill="none" stroke="#f5a524" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M332.1 112.1 L324 116 L332.1 119.9" fill="none" stroke="#f5a524" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="104" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#ffb547" text-anchor="middle">dials out</text><path d="M324 148 L536 148" fill="none" stroke="#8c8e96" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M527.9 151.9 L536 148 L527.9 144.1" fill="none" stroke="#8c8e96" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="170" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">runs come back</text><path d="M380 262 L492 262" fill="none" stroke="#ef4444" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><circle cx="504" cy="262" r="11" fill="#ef4444"/><path d="M499.5 257.5 l9 9 M508.5 257.5 l-9 9" stroke="#111216" stroke-width="2.4" stroke-linecap="round"/><text x="430" y="290" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#ff8a8a" text-anchor="middle">no inbound ports</text></svg>
