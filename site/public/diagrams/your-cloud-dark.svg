<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d">
<title id="t">Running the data plane in your cloud</title>
<desc id="d">The control plane runs wherever you deploy it. The data plane runs inside your VPC with the microVM sandboxes and the run data. It dials out to the control plane and holds one connection open; run assignments come back down it. There are no inbound ports.</desc>
<style>
.cv{fill:#0f1014;stroke:#1c1d23;stroke-width:1.5}
.zone{fill:#131419;stroke:#24262d;stroke-width:1.5}
.card{fill:#17181d;stroke:#2a2c33;stroke-width:1.5}
.soft{fill:url(#gs)}.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.ghost{fill:none;stroke:#5c5f68;stroke-width:1.5;stroke-dasharray:4 4}
.chip{fill:#17181d;stroke:#2a2c33;stroke-width:1}
text{font-family:'Inter Tight','Inter',ui-sans-serif,-apple-system,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#fafaf8}
.s{font-size:12px;fill:#b9bac0}
.m{font:11.5px 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#b9bac0}
.xs{font-size:11px;font-weight:500;fill:#8c8e96}
.k{font-size:10.5px;font-weight:650;letter-spacing:.08em;fill:#8c8e96}
.ka{fill:url(#ga)}
.ln,.la{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#5c5f68}.la{stroke:url(#ga)}
.dash{stroke-dasharray:5 5}
.pkt{fill:url(#ga)}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#8b7fff"/><stop offset="1" stop-color="#14c8f0"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#8b7fff" stop-opacity="0.12"/><stop offset="1" stop-color="#14c8f0" stop-opacity="0.12"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.5"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="878.5" height="298.5" rx="16"/>
<rect class="zone" x="24" y="24" width="300" height="252" rx="16"/>
<text class="k ka" x="40" y="48">CONTROL PLANE · MANAGED OR YOURS</text>
<rect class="card" x="40" y="60" width="268" height="92" rx="12" filter="url(#sh)"/>
<text class="k ka" x="56" y="84">01</text>
<text class="t" x="56" y="102">Control plane</text>
<text class="s" x="56" y="120">API, auth, agents, budgets</text>
<text class="s" x="56" y="136">dashboard</text>
<rect class="ghost" x="40" y="168" width="268" height="92" rx="12"/>
<text class="t" x="56" y="200.5">Run assignments</text>
<text class="s" x="56" y="218.5">sent down the open</text>
<text class="s" x="56" y="234.5">connection</text>
<rect class="zone" x="372" y="24" width="484" height="252" rx="16"/>
<text class="k ka" x="388" y="48">YOUR VPC · NO INBOUND PORTS</text>
<rect class="card" x="388" y="60" width="452" height="92" rx="12" filter="url(#sh)"/>
<rect class="soft" x="388" y="60" width="452" height="92" rx="12"/><rect class="ring" x="388.75" y="60.75" width="450.5" height="90.5" rx="11.25"/>
<text class="k ka" x="404" y="84">02</text>
<text class="t" x="404" y="102">Data plane</text>
<text class="s" x="404" y="120">registers, heartbeats, and holds one</text>
<text class="s" x="404" y="136">connection open to the control plane</text>
<rect class="card" x="388" y="168" width="216" height="92" rx="12" filter="url(#sh)"/>
<text class="t" x="404" y="209">microVM sandboxes</text>
<text class="s" x="404" y="227">your nodes, your network</text>
<rect class="card" x="624" y="168" width="216" height="92" rx="12" filter="url(#sh)"/>
<text class="t" x="640" y="209">Run data</text>
<text class="s" x="640" y="227">stays in your account</text>
<path class="la flow" d="M382 106L314 106"/>
<path class="la" d="M319.5 102.6L314 106L319.5 109.4"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M382 106L314 106"/></circle>
<text class="xs" x="322" y="96">dials out</text>
<path class="ln dash" d="M314 214L344 214L344 130L382 130"/>
<path class="ln" d="M376.5 133.4L382 130L376.5 126.6"/>
</svg>
