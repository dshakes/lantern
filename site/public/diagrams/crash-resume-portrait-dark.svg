y="441" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">from journal</text><rect x="218" y="404" width="178" height="56" rx="12" fill="#111216" stroke="#3fb68b" stroke-width="1.5" stroke-dasharray="6 5"/><text x="307" y="427" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">step 2</text><text x="307" y="441" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">from journal</text><rect x="24" y="476" width="372" height="64" rx="12" fill="#f5a524" fill-opacity="0.12" stroke="#f5a524" stroke-width="2"/><text x="210" y="503" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">step 3 runs again</text><text x="210" y="517" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">same idempotency key</text><rect x="24" y="556" width="372" height="56" rx="12" fill="#3fb68b" fill-opacity="0.12" stroke="#3fb68b" stroke-width="1.5"/><text x="210" y="589" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">step 4 continues</text><path d="M210 540 L210 556" fill="none" stroke="#8c8e96" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.1 547.9 L210 556 L213.9 547.9" fill="none" stroke="#8c8e96" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="628" width="372" height="64" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="210" y="655" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">billed once</text><text x="210" y="669" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">provider dedups the key</text><path d="M210 612 L210 628" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M206.1 619.9 L210 628 L213.9 619.9" fill="none" stroke="#f5a524" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
