<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 716" width="420" height="716" role="img" aria-labelledby="t d"><title id="t">A run resumes after a crash</title><desc id="d">Each finished step is written to the run journal. The process crashes during step 3. The recovery sweep finds the orphaned run and re-acquires its lock. Steps 1 and 2 are replayed from the journal, not re-run. Step 3 runs again with the same idempotency key, so the provider bills it once.</desc><rect width="420" height="716" rx="18" fill="#111216"/><text x="24" y="36" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8c8e96" text-anchor="start">before the crash</text><rect x="24" y="48" width="372" height="56" rx="12" fill="#3fb68b" fill-opacity="0.12" stroke="#3fb68b" stroke-width="1.5"/><text x="210" y="81" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">step 1 · journaled</text><rect x="24" y="120" width="372" height="56" rx="12" fill="#3fb68b" fill-opacity="0.12" stroke="#3fb68b" stroke-width="1.5"/><text x="210" y="153" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">step 2 · journaled</text><rect x="24" y="192" width="372" height="56" rx="12" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/><text x="210" y="225" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">step 3 · crash mid-call</text><circle cx="396" cy="192" r="13" fill="#ef4444"/><path d="M397.5 185 L392 193 L396 193 L394.5 199 L400 191 L396 191 Z" fill="#111216"/><path d="M210 104 L210 120" fill="none" stroke="#8c8e96" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.