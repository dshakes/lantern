<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" width="960" height="376" role="img" aria-labelledby="t d"><title id="t">Sandbox egress through the host broker</title><desc id="d">An agent tool call runs code in a microVM that has no network card. Its only way out is vsock to a broker on the host. The broker checks every request against the allowlist and adds the credential there, so keys never enter the VM. An allowed host goes through; any other host is refused and audited.</desc><rect width="960" height="376" rx="18" fill="#ffffff"/><rect x="24" y="150" width="152" height="72" rx="12" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5"/><text x="100" y="181" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#0b0c0f" text-anchor="middle">tool call</text><text x="100" y="195" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#45474e" text-anchor="middle">from the agent</text><path d="M176 186 L216 186" fill="none" stroke="#e08a00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M207.9 189.9 L216 186 L207.9 182.1" fill="none" stroke="#e08a00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="216" y="56" width="248" height="264" rx="16" fill="#e08a00" fill-opacity="0.09" stroke="#e08a00" stroke-width="1.5"/><text x="340" y="92" font-family="'Inter Tight', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">microVM</text><text x="340" y="114" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#45474e" text-anchor="middle">no network card</text><rect x="248" y="150" width="184" height="72" rx="12" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5"/><text x="340" y="181" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#0b0c0f" text-anchor="middle">your code</text><text x="340" y="195" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#45474e" text-anchor="middle">no keys inside</text><path d="M432 186 L520 186" fill="none" stroke="#4f5fd6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M511.9 189.9 L520 186 L511.9 182.1" fill="none" stroke="#4f5fd6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="476" y="176" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#45474e" text-anchor="middle">vsock</text><rect x="520" y="56" width="232" height="264" rx="16" fill="#4f5fd6" fill-opacity="0.09" stroke="#4f5fd6" stroke-width="1.5"/><text x="636" y="92" font-family="'Inter Tight', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">host broker</text><rect x="544" y="120" width="184" height="52" rx="12" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5"/><text x="636" y="151" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#0b0c0f" text-anchor="middle">1 allowlist</text><rect x="544" y="188" width="184" height="52" rx="12" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5"/><text x="636" y="219" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#0b0c0f" text-anchor="middle">2 add key</text><g fill="none" stroke="#4f5fd6" stroke-width="2" stroke-linecap="round"><circle cx="588" cy="280" r="5"/><path d="M593 280 h11 M600 280 v4 M604 280 v4"/></g><text x="614" y="285" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#45474e" text-anchor="start">keys stay here</text><path d="M752 146 L800 146 L800 112 L820 112" fill="none" stroke="#1f8a63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M811.9 115.9 L820 112 L811.9 108.1" fill="none" stroke="#1f8a63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M752 214 L800 214 L800 252 L820 252" fill="none" stroke="#d03030" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M811.9 255.9 L820 252 L811.9 248.1" fill="none" stroke="#d03030" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="840" cy="112" r="11" fill="#1f8a63"/><path d="M835 112 l3.5 3.5 l6.5 -7" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="858" y="117" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#146b4b" text-anchor="start">allowed</text><text x="828" y="142" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#45474e" text-anchor="start">api.github.com</text><circle cx="840" cy="252" r="11" fill="#d03030"/><path d="M835.5 247.5 l9 9 M844.5 247.5 l-9 9" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/><text x="858" y="257" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#b42323" text-anchor="start">refused</text><text x="828" y="282" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#45474e" text-anchor="start">audited</text></svg>
