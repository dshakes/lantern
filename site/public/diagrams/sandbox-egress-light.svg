<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 324" width="880" height="324" role="img" aria-labelledby="t d">
<title id="t">How code in a microVM reaches the network</title>
<desc id="d">Untrusted code runs in a microVM as the workload user. In the default guest mode, the harness proxy on 127.0.0.1:3128 allows only the declared hosts, and production refuses to start the workload without the iptables rule that forces traffic through it. In opt-in broker mode the VM has no network card: traffic leaves over vsock to a broker on the host, which checks the allowlist and injects credentials there, so keys never enter the VM. Anything else is refused and audited.</desc>
<style>
.cv{fill:#f6f5f2;stroke:#e2e1dc;stroke-width:1.5}
.zone{fill:#f1f0ec;stroke:#dedcd5;stroke-width:1.5}
.card{fill:#ffffff;stroke:#d9d8d2;stroke-width:1.5}
.soft{fill:url(#gs)}.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.ghost{fill:none;stroke:#9a9ca3;stroke-width:1.5;stroke-dasharray:4 4}
.chip{fill:#ffffff;stroke:#d9d8d2;stroke-width:1}
text{font-family:'Inter Tight','Inter',ui-sans-serif,-apple-system,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#0b0c0f}
.s{font-size:12px;fill:#45474e}
.m{font:11.5px 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#45474e}
.xs{font-size:11px;font-weight:500;fill:#62656d}
.k{font-size:10.5px;font-weight:650;letter-spacing:.08em;fill:#62656d}
.ka{fill:url(#ga)}
.ln,.la{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#9a9ca3}.la{stroke:url(#ga)}
.dash{stroke-dasharray:5 5}
.pkt{fill:url(#ga)}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#4a3ee6"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#4a3ee6" stop-opacity="0.07"/><stop offset="1" stop-color="#0e7490" stop-opacity="0.07"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#1a1408" flood-opacity="0.08"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="878.5" height="322.5" rx="16"/>
<rect class="zone" x="24" y="24" width="400" height="276" rx="16"/>
<text class="k ka" x="40" y="48">INSIDE THE microVM · UNTRUSTED</text>
<rect class="card" x="40" y="56" width="368" height="80" rx="12" filter="url(#sh)"/>
<text class="k ka" x="56" y="74">01</text>
<text class="t" x="56" y="92">Workload</text>
<text class="s" x="56" y="110">runs as the workload uid, not the harness</text>
<text class="s" x="56" y="126">proxy variables set in its environment</text>
<rect class="card" x="40" y="156" width="368" height="128" rx="12" filter="url(#sh)"/>
<rect class="soft" x="40" y="156" width="368" height="128" rx="12"/><rect class="ring" x="40.75" y="156.75" width="366.5" height="126.5" rx="11.25"/>
<text class="k ka" x="56" y="181">02</text>
<text class="t" x="56" y="199">Harness · PID 1</text>
<text class="s" x="56" y="217">proxy on 127.0.0.1:3128</text>
<text class="s" x="56" y="233">guest mode: iptables REDIRECT forces it</text>
<text class="s" x="56" y="249">broker mode: no network card, vsock only</text>
<text class="s" x="56" y="265">secrets socket checks the caller uid</text>
<path class="la flow" d="M224 140L224 150"/>
<path class="la" d="M220.6 144.5L224 150L227.4 144.5"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M224 140L224 150"/></circle>
<rect class="zone" x="448" y="24" width="408" height="276" rx="16"/>
<text class="k ka" x="464" y="48">HOST AND INTERNET</text>
<rect class="card" x="464" y="56" width="376" height="80" rx="12" filter="url(#sh)"/>
<rect class="soft" x="464" y="56" width="376" height="80" rx="12"/><rect class="ring" x="464.75" y="56.75" width="374.5" height="78.5" rx="11.25"/>
<text class="k ka" x="480" y="74">03</text>
<text class="t" x="480" y="92">Allowlist check</text>
<text class="s" x="480" y="110">broker mode adds the credential here;</text>
<text class="s" x="480" y="126">the secret never enters the VM</text>
<rect x="464" y="160" width="180" height="124" rx="12" fill="#e6f4ee" stroke="#146b4b" stroke-width="1.5"/>
<text class="t" x="480" y="217">Allowed host</text>
<text class="s" x="480" y="235">request goes out</text>
<rect x="660" y="160" width="180" height="124" rx="12" fill="#fbedea" stroke="#b42323" stroke-width="1.5"/>
<text class="t" x="676" y="208.5">Any other host</text>
<text class="s" x="676" y="226.5">refused</text>
<text class="s" x="676" y="242.5">and audited</text>
<path class="la flow" d="M414 220L436 220L436 96L458 96"/>
<path class="la" d="M452.5 99.4L458 96L452.5 92.6"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M414 220L436 220L436 96L458 96"/></circle>
<path class="la flow" d="M554 140L554 154"/>
<path class="la" d="M550.6 148.5L554 154L557.4 148.5"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M554 140L554 154"/></circle>
<path class="ln dash" style="stroke:#b42323" d="M750 140L750 154"/>
<path class="ln" style="stroke:#b42323" d="M746.6 148.5L750 154L753.4 148.5"/>
</svg>
