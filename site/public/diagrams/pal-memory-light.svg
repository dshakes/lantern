<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="t d">
<title id="t">One memory across both channels</title>
<desc id="d">iMessage and WhatsApp handles resolve to one canonical person in the control plane. Timeline events for that person feed the context pal reads before replying, and cross-thread recall searches everyone else in your tenant. On the Mac, recent episodes, topics, the sent log and dislike patterns are kept in AES-256-GCM encrypted files.</desc>
<style>
.cv{fill:#f6f5f2;stroke:#e2e1dc;stroke-width:1.5}
.zone{fill:#f1f0ec;stroke:#dedcd5;stroke-width:1.5}
.card{fill:#ffffff;stroke:#d9d8d2;stroke-width:1.5}
.soft{fill:url(#gs)}.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.ghost{fill:none;stroke:#9a9ca3;stroke-width:1.5;stroke-dasharray:4 4}
.chip{fill:#ffffff;stroke:#d9d8d2;stroke-width:1}
text{font-family:'Inter Tight','Inter',ui-sans-serif,-apple-system,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#0b0c0f}
.s{font-size:12px;fill:#45474e}
.m{font:11.5px 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#45474e}
.xs{font-size:11px;font-weight:500;fill:#62656d}
.k{font-size:10.5px;font-weight:650;letter-spacing:.08em;fill:#62656d}
.ka{fill:url(#ga)}
.ln,.la{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#9a9ca3}.la{stroke:url(#ga)}
.dash{stroke-dasharray:5 5}
.pkt{fill:url(#ga)}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#c81e5a"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#c2410c" stop-opacity="0.07"/><stop offset="1" stop-color="#c81e5a" stop-opacity="0.07"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#1a1408" flood-opacity="0.08"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="878.5" height="338.5" rx="16"/>
<rect class="zone" x="24" y="24" width="200" height="292" rx="16"/>
<text class="k" x="40" y="48">CHANNELS</text>
<rect class="card" x="40" y="64" width="168" height="84" rx="12" filter="url(#sh)"/>
<text class="t" x="56" y="101">iMessage</text>
<text class="s" x="56" y="119">phone or email handle</text>
<rect class="card" x="40" y="196" width="168" height="84" rx="12" filter="url(#sh)"/>
<text class="t" x="56" y="233">WhatsApp</text>
<text class="s" x="56" y="251">WhatsApp ID</text>
<rect class="zone" x="248" y="24" width="608" height="176" rx="16"/>
<text class="k ka" x="264" y="48">CONTROL PLANE · POSTGRES, ROW-LEVEL SECURITY</text>
<rect class="card" x="264" y="56" width="176" height="128" rx="12" filter="url(#sh)"/>
<rect class="soft" x="264" y="56" width="176" height="128" rx="12"/><rect class="ring" x="264.75" y="56.75" width="174.5" height="126.5" rx="11.25"/>
<text class="k ka" x="280" y="98">01</text>
<text class="t" x="280" y="116">Person graph</text>
<text class="m" x="280" y="134">/v1/people/resolve</text>
<text class="m" x="280" y="150">/v1/people/merge</text>
<rect class="card" x="464" y="56" width="176" height="60" rx="12" filter="url(#sh)"/>
<text class="t" x="480" y="81">Timeline</text>
<text class="m" x="480" y="99">/v1/memory/events</text>
<rect class="card" x="464" y="124" width="176" height="60" rx="12" filter="url(#sh)"/>
<text class="t" x="480" y="149">Context</text>
<text class="m" x="480" y="167">/v1/memory/context</text>
<rect class="card" x="664" y="56" width="176" height="128" rx="12" filter="url(#sh)"/>
<text class="k ka" x="680" y="98">02</text>
<text class="t" x="680" y="116">Cross-thread recall</text>
<text class="m" x="680" y="134">/v1/memory/search</text>
<text class="m" x="680" y="150">everyone else</text>
<path class="la flow" d="M214 106L258 106"/>
<path class="la" d="M252.5 109.4L258 106L252.5 102.6"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M214 106L258 106"/></circle>
<path class="la flow" d="M214 238L236 238L236 140L258 140"/>
<path class="la" d="M252.5 143.4L258 140L252.5 136.6"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M214 238L236 238L236 140L258 140"/></circle>
<path class="ln" d="M446 86L458 86"/>
<path class="ln" d="M452.5 89.4L458 86L452.5 82.6"/>
<path class="ln" d="M446 154L458 154"/>
<path class="ln" d="M452.5 157.4L458 154L452.5 150.6"/>
<path class="ln" d="M646 120L658 120"/>
<path class="ln" d="M652.5 123.4L658 120L652.5 116.6"/>
<rect class="zone" x="248" y="224" width="608" height="92" rx="16"/>
<text class="k" x="264" y="248">ON YOUR MAC · ENCRYPTED AT REST (AES-256-GCM)</text>
<rect class="chip" x="264" y="266" width="134.5" height="24" rx="12"/><text class="s" x="274" y="282">episodes · 14 days</text>
<rect class="chip" x="408.48" y="266" width="147.2" height="24" rx="12"/><text class="s" x="418.48" y="282">topic index · 7 days</text>
<rect class="chip" x="565.6800000000001" y="266" width="109.0" height="24" rx="12"/><text class="s" x="575.6800000000001" y="282">sent-reply log</text>
<rect class="chip" x="684.72" y="266" width="121.8" height="24" rx="12"/><text class="s" x="694.72" y="282">dislike patterns</text>
</svg>
