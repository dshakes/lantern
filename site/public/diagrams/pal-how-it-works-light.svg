<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" role="img" aria-labelledby="t d">
<title id="t">How pal works</title>
<desc id="d">A message arrives in iMessage or WhatsApp on your Mac. The channel bridge runs owner-only checks and asks the PAL control plane for a draft through the same sessions API the SDKs use; the model router picks the model. Back on the Mac the draft passes the check stack. Most replies are sent after a human-paced delay. A reply that commits you to money or an action, or claims something pal cannot verify, is held and shown to you in your self-chat.</desc>
<style>
.cv{fill:#f6f5f2;stroke:#e2e1dc;stroke-width:1.5}
.zone{fill:#f1f0ec;stroke:#dedcd5;stroke-width:1.5}
.card{fill:#ffffff;stroke:#d9d8d2;stroke-width:1.5}
.soft{fill:url(#gs)}.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.ghost{fill:none;stroke:#9a9ca3;stroke-width:1.5;stroke-dasharray:4 4}
.chip{fill:#ffffff;stroke:#d9d8d2;stroke-width:1}
text{font-family:'Inter Tight','Inter',ui-sans-serif,-apple-system,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#0b0c0f}
.s{font-size:12px;fill:#45474e}
.m{font:11.5px 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#45474e}
.xs{font-size:11px;font-weight:500;fill:#62656d}
.k{font-size:10.5px;font-weight:650;letter-spacing:.08em;fill:#62656d}
.ka{fill:url(#ga)}
.ln,.la{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#9a9ca3}.la{stroke:url(#ga)}
.dash{stroke-dasharray:5 5}
.pkt{fill:url(#ga)}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#c81e5a"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#c2410c" stop-opacity="0.07"/><stop offset="1" stop-color="#c81e5a" stop-opacity="0.07"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#1a1408" flood-opacity="0.08"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="878.5" height="366.5" rx="16"/>
<rect class="zone" x="24" y="24" width="832" height="140" rx="16"/>
<text class="k ka" x="40" y="48">YOUR MAC · TWO CHANNEL BRIDGES</text>
<rect class="card" x="40" y="52" width="179" height="96" rx="12" filter="url(#sh)"/>
<text class="k ka" x="56" y="78">01</text>
<text class="t" x="56" y="96">Message arrives</text>
<text class="s" x="56" y="114">iMessage (chat.db)</text>
<text class="s" x="56" y="130">WhatsApp</text>
<rect class="card" x="247" y="52" width="179" height="96" rx="12" filter="url(#sh)"/>
<text class="k ka" x="263" y="78">02</text>
<text class="t" x="263" y="96">Channel bridge</text>
<text class="s" x="263" y="114">owner-only checks</text>
<text class="s" x="263" y="130">mute · quiet hours</text>
<rect class="card" x="454" y="52" width="179" height="96" rx="12" filter="url(#sh)"/>
<text class="k ka" x="470" y="78">04</text>
<text class="t" x="470" y="96">Check stack</text>
<text class="s" x="470" y="114">voice floor · refine</text>
<text class="s" x="470" y="130">commitment + grounding</text>
<rect class="card" x="661" y="52" width="179" height="96" rx="12" filter="url(#sh)"/>
<rect class="soft" x="661" y="52" width="179" height="96" rx="12"/><rect class="ring" x="661.75" y="52.75" width="177.5" height="94.5" rx="11.25"/>
<text class="k ka" x="677" y="78">05</text>
<text class="t" x="677" y="96">Send</text>
<text class="s" x="677" y="114">paced like your</text>
<text class="s" x="677" y="130">real reply times</text>
<path class="ln" d="M225 100L241 100"/>
<path class="ln" d="M235.5 103.4L241 100L235.5 96.6"/>
<path class="la flow" d="M639 100L655 100"/>
<path class="la" d="M649.5 103.4L655 100L649.5 96.6"/>
<circle class="pkt" r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M639 100L655 100"/></circle>
<rect class="zone" x="24" y="196" width="560" height="148" rx="16"/>
<text class="k ka" x="40" y="220">PAL PLATFORM</text>
<rect class="card" x="40" y="224" width="248" height="104" rx="12" filter="url(#sh)"/>
<text class="k ka" x="56" y="254">03</text>
<text class="t" x="56" y="272">Control plane</text>
<text class="s" x="56" y="290">one session per contact</text>
<text class="s" x="56" y="306">memory · web_search tool</text>
<rect class="card" x="320" y="224" width="248" height="104" rx="12" filter="url(#sh)"/>
<text class="t" x="336" y="262.5">Model router</text>
<text class="m" x="336" y="280.5">model: "auto"</text>
<text class="m" x="336" y="296.5">-&gt; a concrete model</text>
<path class="ln" d="M294 276L314 276"/>
<path class="ln" d="M308.5 279.4L314 276L308.5 272.6"/>
<path class="ln" d="M336.5 154L336.5 176L176 176L176 218"/>
<path class="ln" d="M172.6 212.5L176 218L179.4 212.5"/>
<path class="ln" d="M240 218L240 186L519.5 186L519.5 160"/>
<path class="ln" d="M522.9 165.5L519.5 160L516.1 165.5"/>
<text class="xs" x="527.5" y="180">draft</text>
<rect class="zone" x="608" y="196" width="248" height="148" rx="16"/>
<text class="k" x="624" y="220">YOU · SELF-CHAT</text>
<rect x="624" y="224" width="216" height="104" rx="12" fill="#fdf1e3" stroke="#a8460a" stroke-width="1.5"/>
<text class="k" x="640" y="254" style="fill:#a8460a">HELD</text>
<text class="t" x="640" y="272">Held for you</text>
<text class="s" x="640" y="290">money · promises · claims</text>
<text class="s" x="640" y="306">pal can't verify</text>
<path class="ln dash" style="stroke:#a8460a" d="M567.5 154L567.5 184L732 184L732 218"/>
<path class="ln" style="stroke:#a8460a" d="M728.6 212.5L732 218L735.4 212.5"/>
</svg>
