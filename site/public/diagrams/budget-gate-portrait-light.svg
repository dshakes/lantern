<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 468" width="420" height="468" role="img" aria-labelledby="t d"><title id="t">A budget is checked before the model is called</title><desc id="d">A run request first meets the budget check: a forecast and the daily caps. Over a hard cap, the API returns 402 and no model is called, so it costs nothing. Under the cap, the request is routed by capability to a provider model and the usage is recorded against the budget.</desc><rect width="420" height="468" rx="18" fill="#ffffff"/><rect x="24" y="24" width="372" height="64" rx="12" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5"/><text x="210" y="50.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">run request</text><text x="210" y="66.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">POST /v1/runs</text><path d="M210 88 L210 116" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.1 107.9 L210 116 L213.9 107.9" fill="none" stroke="#62656d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="116" width="372" height="72" rx="12" fill="#e08a00" fill-opacity="0.09" stroke="#e08a00" stroke-width="2"/><text x="210" y="146.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">budget check</text><text x="210" y="162.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">forecast + daily caps</text><path d="M120 188 L120 252" fill="none" stroke="#d03030" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M116.1 243.9 L120 252 L123.9 243.9" fill="none" stroke="#d03030" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 188 L300 252" fill="none" stroke="#1f8a63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M296.1 243.9 L300 252 L303.9 243.9" fill="none" stroke="#1f8a63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="132" y="226" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#b42323" text-anchor="start">over cap</text><text x="312" y="226" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#146b4b" text-anchor="start">under</text><rect x="24" y="252" width="178" height="96" rx="12" fill="#d03030" fill-opacity="0.09" stroke="#d03030" stroke-width="1.5"/><text x="113" y="283.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">402</text><text x="113" y="299.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">no model call</text><text x="113" y="315.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">costs $0</text><rect x="218" y="252" width="178" height="96" rx="12" fill="#1f8a63" fill-opacity="0.09" stroke="#1f8a63" stroke-width="1.5"/><text x="307" y="294.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">routed</text><text x="307" y="310.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">by capability</text><path d="M300 348 L300 380" fill="none" stroke="#1f8a63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M296.1 371.9 L300 380 L303.9 371.9" fill="none" stroke="#1f8a63" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="218" y="380" width="178" height="64" rx="12" fill="#ffffff" stroke="#d9d8d2" stroke-width="1.5"/><text x="307" y="406.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b0c0f" text-anchor="middle">usage</text><text x="307" y="422.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#45474e" text-anchor="middle">recorded</text></svg>
