<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 468" width="420" height="468" role="img" aria-labelledby="t d"><title id="t">A budget is checked before the model is called</title><desc id="d">A run request first meets the budget check: a forecast and the daily caps. Over a hard cap, the API returns 402 and no model is called, so it costs nothing. Under the cap, the request is routed by capability to a provider model and the usage is recorded against the budget.</desc><rect width="420" height="468" rx="18" fill="#111216"/><rect x="24" y="24" width="372" height="64" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="210" y="51" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">run request</text><text x="210" y="65" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">POST /v1/runs</text><path d="M210 88 L210 116" fill="none" stroke="#8c8e96" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M206.1 107.9 L210 116 L213.9 107.9" fill="none" stroke="#8c8e96" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="116" width="372" height="72" rx="12" fill="#f5a524" fill-opacity="0.12" stroke="#f5a524" stroke-width="2"/><text x="210" y="147" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">budget check</text><text x="210" y="161" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">forecast + daily caps</text><path d="M120 188 L120 252" fill="none" stroke="#ef4444" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M116.1 243.9 L120 252 L123.9 243.9" fill="none" stroke="#ef4444" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 188 L300 252" fill="none" stroke="#3fb68b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M296.1 243.9 L300 252 L303.9 243.9" fill="none" stroke="#3fb68b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="132" y="226" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#ff8a8a" text-anchor="start">over cap</text><text x="312" y="226" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#5fd3a6" text-anchor="start">under</text><rect x="24" y="252" width="178" height="96" rx="12" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/><text x="113" y="285" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">402</text><text x="113" y="299" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">no model call</text><text x="113" y="313" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">costs $0</text><rect x="218" y="252" width="178" height="96" rx="12" fill="#3fb68b" fill-opacity="0.12" stroke="#3fb68b" stroke-width="1.5"/><text x="307" y="295" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">routed</text><text x="307" y="309" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">by capability</text><path d="M300 348 L300 380" fill="none" stroke="#3fb68b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M296.1 371.9 L300 380 L303.9 371.9" fill="none" stroke="#3fb68b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="218" y="380" width="178" height="64" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="307" y="407" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">usage</text><text x="307" y="421" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">recorded</text></svg>
