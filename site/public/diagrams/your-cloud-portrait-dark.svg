<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 624" width="420" height="624" role="img" aria-labelledby="t d"><title id="t">PAL Runtime in your cloud</title><desc id="d">The control plane runs wherever you deploy it. The data plane runs inside your VPC with the microVM sandboxes and the run data. It dials out to the control plane and holds one connection open; run assignments come back down it. There are no inbound ports.</desc><rect width="420" height="624" rx="18" fill="#111216"/><rect x="24" y="24" width="372" height="200" rx="16" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="210" y="58" font-family="'Inter Tight', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#fafaf8" text-anchor="middle">control plane</text><text x="210" y="80" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">run it anywhere</text><rect x="44" y="100" width="332" height="44" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="210" y="127" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">API · console</text><rect x="44" y="156" width="332" height="44" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="210" y="183" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">scheduling · routing</text><path d="M150 304 L150 224" fill="none" stroke="#f5a524" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M153.9 232.1 L150 224 L146.1 232.1" fill="none" stroke="#f5a524" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="262" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#ffb547" text-anchor="end">dials out</text><path d="M270 224 L270 304" fill="none" stroke="#8c8e96" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M266.1 295.9 L270 304 L273.9 295.9" fill="none" stroke="#8c8e96" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="282" y="262" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="start">runs back</text><rect x="24" y="304" width="372" height="296" rx="18" fill="#111216" stroke="#7c8cff" stroke-width="1.5" stroke-dasharray="6 5"/><text x="44" y="334" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#b9bac0" text-anchor="start">your VPC</text><rect x="44" y="352" width="332" height="76" rx="12" fill="#f5a524" fill-opacity="0.12" stroke="#f5a524" stroke-width="1.5"/><text x="210" y="385" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">data plane</text><text x="210" y="399" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">inside your account</text><rect x="44" y="444" width="158" height="92" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="123" y="485" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">microVM</text><text x="123" y="499" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">sandboxes</text><rect x="218" y="444" width="158" height="92" rx="12" fill="#111216" stroke="#2e3038" stroke-width="1.5"/><text x="297" y="485" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fafaf8" text-anchor="middle">run data</text><text x="297" y="499" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#b9bac0" text-anchor="middle">stays here</text><circle cx="372" cy="304" r="11" fill="#ef4444"/><path d="M367.5 299.5 l9 9 M376.5 299.5 l-9 9" stroke="#111216" stroke-width="2.4" stroke-linecap="round"/><text x="352" y="334" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#ff8a8a" text-anchor="end">no inbound ports</text></svg>
