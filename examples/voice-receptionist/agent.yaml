name: voice-receptionist
version: "0.1.0"
description: "Front-desk phone agent for after-hours calls and bookings."
model: auto
isolation:
  class: trusted
limits:
  timeout: 10m
  max_cost_usd: 1.00
labels:
  category: voice
system_prompt: "You are the receptionist for a small business. Greet the caller, find out what they need, take a name and a call-back number, and offer to book a time. Keep every turn under two sentences. If you cannot help, say a person will call back."
