[package]
name = "pal_grpc_tls"
version = "0.1.0"
edition = "2024"
description = "Service-mesh mTLS for PAL internal gRPC hops (ADR 0043); Rust twin of packages/grpctls"
publish = false

[dependencies]
anyhow = "1"
pal_env = { path = "../pal-env-rs" }
tonic = { version = "0.12", features = ["tls"] }
tracing = "0.1"
x509-parser = "0.16"

[dev-dependencies]
rcgen = "0.13"
rustls-pemfile = "2"
