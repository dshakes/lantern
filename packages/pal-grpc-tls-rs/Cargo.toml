[package]
name = "pal_grpc_tls"
version = "0.1.0"
edition = "2024"
description = "Service-mesh mTLS for PAL internal gRPC hops (ADR 0043); Rust twin of packages/grpctls"
publish = false

[dependencies]
anyhow = "1"
pal_env = { path = "../pal-env-rs" }
# Pin the process-level crypto provider: a binary that also links aws-lc-rs
# (e.g. via reqwest) otherwise panics at the first TLS handshake.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tonic = { version = "0.12", features = ["tls"] }
tracing = "0.1"
x509-parser = "0.16"

[dev-dependencies]
rcgen = "0.13"
rustls-pemfile = "2"
