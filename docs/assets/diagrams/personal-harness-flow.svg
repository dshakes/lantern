<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" class="lx" role="img" aria-labelledby="personal-harness-flow-title personal-harness-flow-desc">
  <title id="personal-harness-flow-title">An iPhone signal reaches your replies without ever naming your location</title>
  <desc id="personal-harness-flow-desc">Phone-trigger flow of the personal harness. iPhone Shortcuts triggers, driving, place, status and rhythm, each post a signal through a Shortcut. The post travels through a cloudflared tunnel to POST /v1/signals on the control plane, which checks the x-pal-signal-token header with a constant-time compare and fails closed, then appends one line to device-signals.jsonl at mode 0600. On every owner turn the bridge reads that file with freshIphoneSignalsLine, builds a presence summary, and uses it as owner context in self-chat and in the availability concierge. The owner can ask where they are or whether they are free. Contacts who ask whether the owner is around receive availability only, never a place.</desc>
  <style class="lx-style">
    .lx{--bg:#f2f5f8;--surface:#ffffff;--surface2:#e7edf3;--ink:#0f1b2d;--ink2:#44546a;--ink3:#5d6d83;--line:#c3cedb;--flame:#a85e06;--flame-soft:#fbebd3;--glass:#1c76a6;--glass-soft:#dcedf8;--patina:#17785f;--patina-soft:#d6efe7;--signal:#c23b29;--signal-soft:#f8deda}
    @media (prefers-color-scheme:dark){.lx{--bg:#0b1220;--surface:#111b2e;--surface2:#17243b;--ink:#e8eef5;--ink2:#a9b6c8;--ink3:#7a8aa2;--line:#2b3b57;--flame:#ffb547;--flame-soft:#3a2a12;--glass:#7cc4e8;--glass-soft:#13314a;--patina:#4fc1a6;--patina-soft:#123a33;--signal:#ff7262;--signal-soft:#3e1c1a}}
    .lx text{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
    .lx .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
    .lx .canvas{fill:var(--bg)}
    .lx .t-title{font-size:22px;font-weight:600;letter-spacing:-.01em}
    .lx .t-sub{font-size:13px;fill:var(--ink2)}
    .lx .t-h{font-size:14px;font-weight:600}
    .lx .t-b{font-size:12.5px;fill:var(--ink2)}
    .lx .t-s{font-size:11.5px;fill:var(--ink3)}
    .lx .t-flame{fill:var(--flame)} .lx .t-glass{fill:var(--glass)} .lx .t-patina{fill:var(--patina)} .lx .t-signal{fill:var(--signal)}
    .lx .node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .lx .node-guest{fill:var(--flame-soft);stroke:var(--flame);stroke-width:1.5}
    .lx .node-host{fill:var(--patina-soft);stroke:var(--patina);stroke-width:1.5}
    .lx .node-glass{fill:var(--glass-soft);stroke:var(--glass);stroke-width:1.5}
    .lx .node-deny{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.5}
    .lx .group{fill:var(--surface2);stroke:none}
    .lx .wall{fill:none;stroke:var(--glass);stroke-width:2.5}
    .lx .zone{fill:none;stroke:var(--ink3);stroke-width:1.25;stroke-dasharray:6 5}
    .lx .edge{fill:none;stroke:var(--ink2);stroke-width:1.5}
    .lx .edge-flame{fill:none;stroke:var(--flame);stroke-width:1.75}
    .lx .edge-glass{fill:none;stroke:var(--glass);stroke-width:1.75}
    .lx .edge-patina{fill:none;stroke:var(--patina);stroke-width:1.75}
    .lx .edge-deny{fill:none;stroke:var(--signal);stroke-width:1.75;stroke-dasharray:4 4}
    .lx .head{fill:var(--ink2)} .lx .head-flame{fill:var(--flame)} .lx .head-glass{fill:var(--glass)} .lx .head-patina{fill:var(--patina)} .lx .head-deny{fill:var(--signal)}
    .lx .dot-flame{fill:var(--flame)} .lx .dot-glass{fill:var(--glass)} .lx .dot-patina{fill:var(--patina)} .lx .dot-signal{fill:var(--signal)} .lx .dot-ink{fill:var(--ink3)}
  </style>
  <defs>
    <marker id="personal-harness-flow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 10 5 0 10z"/></marker>
    <marker id="personal-harness-flow-af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-flame" d="M0 0 10 5 0 10z"/></marker>
    <marker id="personal-harness-flow-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-glass" d="M0 0 10 5 0 10z"/></marker>
    <marker id="personal-harness-flow-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-patina" d="M0 0 10 5 0 10z"/></marker>
    <marker id="personal-harness-flow-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-deny" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="canvas" width="1200" height="600" rx="16"/>
  <text class="t-title" x="40" y="52">An iPhone signal reaches your replies without ever naming your location</text>
  <text class="t-sub" x="40" y="76">Owner-only and local: triggers post to the control plane, the bridge reads them on every turn.</text>
  <text class="t-h" x="40" y="112">iPhone triggers, each a Shortcut that posts</text>
  <rect class="node" x="40" y="126" width="240" height="70" rx="10"/>
  <text class="t-h" x="54" y="150">Drive</text>
  <text class="t-b" x="54" y="170">CarPlay or Bluetooth</text>
  <text class="t-b" x="54" y="186">kind: device</text>
  <rect class="node" x="40" y="208" width="240" height="70" rx="10"/>
  <text class="t-h" x="54" y="232">Place</text>
  <text class="t-b" x="54" y="252">arrive or leave a place</text>
  <text class="t-b" x="54" y="268">kind: location</text>
  <rect class="node" x="40" y="290" width="240" height="70" rx="10"/>
  <text class="t-h" x="54" y="314">Status</text>
  <text class="t-b" x="54" y="334">Action Button, NFC, Focus</text>
  <text class="t-b" x="54" y="350">kind: focus</text>
  <rect class="node" x="40" y="372" width="240" height="70" rx="10"/>
  <text class="t-h" x="54" y="396">Rhythm</text>
  <text class="t-b" x="54" y="416">sleep, wake, media, health</text>
  <text class="t-b" x="54" y="432">kinds: sleep, wake, health</text>
  <path class="edge" d="M280 232H320V179H358" marker-end="url(#personal-harness-flow-a)"/>
  <rect class="zone" x="340" y="100" width="570" height="380" rx="18"/>
  <text class="t-s" x="356" y="124">Your Mac, owner-only</text>
  <rect class="node" x="360" y="140" width="240" height="78" rx="10"/>
  <text class="t-h" x="374" y="164">Tunnel</text>
  <text class="t-b" x="374" y="184">cloudflared in front of</text>
  <text class="t-b" x="374" y="200">the API on :8080</text>
  <rect class="node" x="360" y="240" width="240" height="78" rx="10"/>
  <text class="t-h mono" x="374" y="264">POST /v1/signals</text>
  <text class="t-b" x="374" y="284">x-pal-signal-token,</text>
  <text class="t-b" x="374" y="300">constant-time, fails closed</text>
  <rect class="node" x="360" y="340" width="240" height="78" rx="10"/>
  <text class="t-h mono" x="374" y="364">device-signals.jsonl</text>
  <text class="t-b" x="374" y="384">one line per signal,</text>
  <text class="t-b" x="374" y="400">mode 0600, auto-trimmed</text>
  <path class="edge" d="M480 218V238" marker-end="url(#personal-harness-flow-a)"/>
  <path class="edge" d="M480 318V338" marker-end="url(#personal-harness-flow-a)"/>
  <rect class="node" x="640" y="140" width="250" height="70" rx="10"/>
  <text class="t-h mono" x="654" y="164">freshIphoneSignalsLine()</text>
  <text class="t-b" x="654" y="184">reads the file each turn,</text>
  <text class="t-b" x="654" y="200">empty if missing</text>
  <rect class="node" x="640" y="222" width="250" height="70" rx="10"/>
  <text class="t-h" x="654" y="246">Presence summary</text>
  <text class="t-b" x="654" y="266">latest focus, device,</text>
  <text class="t-b" x="654" y="282">location, health, media</text>
  <rect class="node" x="640" y="304" width="250" height="70" rx="10"/>
  <text class="t-h" x="654" y="328">Owner context</text>
  <text class="t-b" x="654" y="348">self-chat answers only</text>
  <rect class="node" x="640" y="386" width="250" height="70" rx="10"/>
  <text class="t-h" x="654" y="410">Availability concierge</text>
  <text class="t-b" x="654" y="430">tells contacts you are</text>
  <text class="t-b" x="654" y="446">reachable, never where</text>
  <path class="edge" d="M600 379H610V175H638" marker-end="url(#personal-harness-flow-a)"/>
  <path class="edge" d="M765 210V222" marker-end="url(#personal-harness-flow-a)"/>
  <path class="edge" d="M765 292V304" marker-end="url(#personal-harness-flow-a)"/>
  <path class="edge" d="M640 257H628V421H638" marker-end="url(#personal-harness-flow-a)"/>
  <rect class="node" x="950" y="150" width="210" height="100" rx="10"/>
  <text class="t-h" x="964" y="174">You, in self-chat</text>
  <text class="t-b" x="964" y="194">where am I</text>
  <text class="t-b" x="964" y="210">am I free at 3?</text>
  <rect class="node-guest" x="950" y="330" width="210" height="100" rx="10"/>
  <text class="t-h" x="964" y="354">Contacts who DM you</text>
  <text class="t-b" x="964" y="374">is he around?</text>
  <text class="t-b" x="964" y="390">get availability only,</text>
  <text class="t-b" x="964" y="406">no place</text>
  <path class="edge" d="M890 339H920V200H948" marker-end="url(#personal-harness-flow-a)"/>
  <path class="edge-flame" d="M890 421H935V380H948" marker-end="url(#personal-harness-flow-af)"/>
  <text class="t-s" x="40" y="510">Kill switch: PAL_IPHONE_SIGNALS=off. The bridge keeps only a distilled summary; the shortcut endpoint is fail-closed without PAL_SIGNAL_TOKEN.</text>
  <g transform="translate(40 550)">
    <rect class="node" x="0" width="14" height="14" rx="3"/><text class="t-s" x="22" y="11">Component</text>
    <rect class="zone" x="112" width="14" height="14" rx="3"/><text class="t-s" x="134" y="11">Owner-only boundary (your Mac)</text>
    <rect class="node-guest" x="357" width="14" height="14" rx="3"/><text class="t-s" x="379" y="11">Contacts: replies sent as the owner</text>
  </g>
</svg>
