<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" class="lx" role="img" aria-labelledby="runtime-security-layers-title runtime-security-layers-desc">
  <title id="runtime-security-layers-title">Five nested controls surround untrusted code, and each one fails closed</title>
  <desc id="runtime-security-layers-desc">Concentric defense in depth around untrusted agent code. The outermost layer is your VPC or cluster, the data plane, where the control plane never touches user code and reaches the runtime-manager over service-token gRPC. Inside it sits a per-tenant namespace named pal-t-tenant_id with tenant_id on every call and row-level security. Inside that is a default-deny network where the egress policy is created before the Job and only DNS is allowed. Inside that is the sandbox wall, a gVisor, Kata or Firecracker boundary chosen by the isolation gate. Inside the wall the trusted Rust harness runs as PID 1 with the egress allowlist proxy, a peer-checked secrets socket and short-lived secret vends, next to the untrusted workload, which runs as a non-root workload uid with a filtered environment. A denied strip lists what the harness refuses: off-allowlist egress, other processes reading the secrets socket, and in production a boot without the egress redirect rule.</desc>
  <style class="lx-style">
    .lx{--bg:#f2f5f8;--surface:#ffffff;--surface2:#e7edf3;--ink:#0f1b2d;--ink2:#44546a;--ink3:#5d6d83;--line:#c3cedb;--flame:#a85e06;--flame-soft:#fbebd3;--glass:#1c76a6;--glass-soft:#dcedf8;--patina:#17785f;--patina-soft:#d6efe7;--signal:#c23b29;--signal-soft:#f8deda}
    @media (prefers-color-scheme:dark){.lx{--bg:#0b1220;--surface:#111b2e;--surface2:#17243b;--ink:#e8eef5;--ink2:#a9b6c8;--ink3:#7a8aa2;--line:#2b3b57;--flame:#ffb547;--flame-soft:#3a2a12;--glass:#7cc4e8;--glass-soft:#13314a;--patina:#4fc1a6;--patina-soft:#123a33;--signal:#ff7262;--signal-soft:#3e1c1a}}
    .lx text{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
    .lx .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
    .lx .canvas{fill:var(--bg)}
    .lx .t-title{font-size:22px;font-weight:600;letter-spacing:-.01em}
    .lx .t-sub{font-size:13px;fill:var(--ink2)}
    .lx .t-h{font-size:14px;font-weight:600}
    .lx .t-b{font-size:12.5px;fill:var(--ink2)}
    .lx .t-s{font-size:11.5px;fill:var(--ink3)}
    .lx .t-flame{fill:var(--flame)} .lx .t-glass{fill:var(--glass)} .lx .t-patina{fill:var(--patina)} .lx .t-signal{fill:var(--signal)}
    .lx .node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .lx .node-guest{fill:var(--flame-soft);stroke:var(--flame);stroke-width:1.5}
    .lx .node-host{fill:var(--patina-soft);stroke:var(--patina);stroke-width:1.5}
    .lx .node-glass{fill:var(--glass-soft);stroke:var(--glass);stroke-width:1.5}
    .lx .node-deny{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.5}
    .lx .group{fill:var(--surface2);stroke:none}
    .lx .wall{fill:none;stroke:var(--glass);stroke-width:2.5}
    .lx .zone{fill:none;stroke:var(--ink3);stroke-width:1.25;stroke-dasharray:6 5}
    .lx .edge{fill:none;stroke:var(--ink2);stroke-width:1.5}
    .lx .edge-flame{fill:none;stroke:var(--flame);stroke-width:1.75}
    .lx .edge-glass{fill:none;stroke:var(--glass);stroke-width:1.75}
    .lx .edge-patina{fill:none;stroke:var(--patina);stroke-width:1.75}
    .lx .edge-deny{fill:none;stroke:var(--signal);stroke-width:1.75;stroke-dasharray:4 4}
    .lx .head{fill:var(--ink2)} .lx .head-flame{fill:var(--flame)} .lx .head-glass{fill:var(--glass)} .lx .head-patina{fill:var(--patina)} .lx .head-deny{fill:var(--signal)}
    .lx .dot-flame{fill:var(--flame)} .lx .dot-glass{fill:var(--glass)} .lx .dot-patina{fill:var(--patina)} .lx .dot-signal{fill:var(--signal)} .lx .dot-ink{fill:var(--ink3)}
  </style>
  <defs>
    <marker id="runtime-security-layers-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 10 5 0 10z"/></marker>
    <marker id="runtime-security-layers-af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-flame" d="M0 0 10 5 0 10z"/></marker>
    <marker id="runtime-security-layers-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-glass" d="M0 0 10 5 0 10z"/></marker>
    <marker id="runtime-security-layers-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-patina" d="M0 0 10 5 0 10z"/></marker>
    <marker id="runtime-security-layers-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-deny" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="canvas" width="1200" height="760" rx="16"/>
  <text class="t-title" x="40" y="52">Five nested controls surround untrusted code, and each one fails closed</text>
  <text class="t-sub" x="40" y="76">Work inward: cluster, tenant namespace, network, sandbox, then the harness and the workload itself.</text>
  <rect class="zone" x="40" y="100" width="1120" height="590" rx="18"/>
  <text class="t-h" x="58" y="124">Your VPC or cluster: the data plane</text>
  <text class="t-s" x="58" y="142">The control plane never touches user code; it reaches the runtime-manager over gRPC with a service token.</text>
  <rect class="zone" x="70" y="158" width="1060" height="502" rx="18"/>
  <text class="t-h" x="88" y="182">Per-tenant namespace: pal-t-&lt;tenant_id&gt;</text>
  <text class="t-s" x="88" y="200">tenant_id on every gRPC call and every row; row-level security on tenant tables; no cross-tenant joins.</text>
  <rect class="zone" x="100" y="216" width="1000" height="414" rx="18"/>
  <text class="t-h" x="118" y="240">Default-deny network</text>
  <text class="t-s" x="118" y="258">The egress NetworkPolicy is created before the Job, so a pod is never unfenced; only DNS is allowed.</text>
  <rect class="wall" x="130" y="274" width="940" height="326" rx="18"/>
  <text class="t-h t-glass" x="148" y="298">Sandbox wall: gVisor, Kata or Firecracker</text>
  <text class="t-s" x="148" y="316">The isolation gate picks the boundary; untrusted and hostile code never get a bare pod.</text>
  <rect class="node-host" x="160" y="338" width="440" height="156" rx="10"/>
  <text class="t-h" x="176" y="364">Harness (PID 1)</text>
  <text class="t-b" x="176" y="384">egress allowlist proxy on 127.0.0.1:3128</text>
  <text class="t-b" x="176" y="403">secrets socket checked with SO_PEERCRED</text>
  <text class="t-b" x="176" y="422">secret vends are short-lived (300 s)</text>
  <text class="t-b" x="176" y="441">security audits are never silently dropped</text>
  <rect class="node-guest" x="630" y="338" width="410" height="156" rx="10"/>
  <text class="t-h" x="646" y="364">Agent workload</text>
  <text class="t-b" x="646" y="384">untrusted user code</text>
  <text class="t-b" x="646" y="403">runs as the workload uid, not the harness</text>
  <text class="t-b" x="646" y="422">read-only rootfs, non-root, caps dropped</text>
  <text class="t-b" x="646" y="441">sees only allowlisted PAL_* env keys</text>
  <rect class="node-deny" x="160" y="516" width="880" height="66" rx="10"/>
  <text class="t-h" x="176" y="540">Refused by the harness</text>
  <text class="t-b" x="176" y="560">off-allowlist egress, other processes on the secrets socket, and (in prod) booting without the egress redirect rule</text>
  <!-- opt-in broker mode (PAL_EGRESS_MODE=broker, Firecracker only) -->
  <text class="t-s" x="118" y="620">Opt-in broker mode: host egress broker over vsock injects credentials from pal.secret refs; the VM has no network device (PAL_EGRESS_MODE=broker, Firecracker only).</text>
  <g transform="translate(40 722)">
  <rect class="zone" x="0" width="14" height="14" rx="3"/><text class="t-s" x="22" y="11">Trust boundary</text>
  <rect class="wall" x="140" width="14" height="14" rx="3"/><text class="t-s" x="162" y="11">Sandbox wall</text>
  <rect class="node-host" x="270" width="14" height="14" rx="3"/><text class="t-s" x="292" y="11">Trusted PAL infrastructure</text>
  <rect class="node-guest" x="502" width="14" height="14" rx="3"/><text class="t-s" x="524" y="11">Untrusted guest</text>
  <rect class="node-deny" x="652" width="14" height="14" rx="3"/><text class="t-s" x="674" y="11">Refused</text>
  </g>
</svg>
