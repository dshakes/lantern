<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" class="lx" role="img" aria-labelledby="runtime-architecture-title runtime-architecture-desc">
  <title id="runtime-architecture-title">The control plane decides, the data plane runs the code</title>
  <desc id="runtime-architecture-desc">Architecture of the agent runtime. The control plane (Go, REST on 8080, gRPC on 50051) hosts the schedule and quota gate, per-instance identity, the secret relay, report ingestion and the receipt signer. In the data plane, the runtime-scheduler places a spawn on a node, the runtime-manager on that node runs the isolation gate (choose_backend then build_job) and creates a hardened Job and Pod under a RuntimeClass. Inside the sandbox wall the Rust harness runs as PID 1 beside the untrusted agent workload. The harness reports and heartbeats back to the manager, and the manager relays secret requests and reports up to the control plane.</desc>
  <style class="lx-style">
    .lx{--bg:#f2f5f8;--surface:#ffffff;--surface2:#e7edf3;--ink:#0f1b2d;--ink2:#44546a;--ink3:#5d6d83;--line:#c3cedb;--flame:#a85e06;--flame-soft:#fbebd3;--glass:#1c76a6;--glass-soft:#dcedf8;--patina:#17785f;--patina-soft:#d6efe7;--signal:#c23b29;--signal-soft:#f8deda}
    @media (prefers-color-scheme:dark){.lx{--bg:#0b1220;--surface:#111b2e;--surface2:#17243b;--ink:#e8eef5;--ink2:#a9b6c8;--ink3:#7a8aa2;--line:#2b3b57;--flame:#ffb547;--flame-soft:#3a2a12;--glass:#7cc4e8;--glass-soft:#13314a;--patina:#4fc1a6;--patina-soft:#123a33;--signal:#ff7262;--signal-soft:#3e1c1a}}
    .lx text{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
    .lx .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
    .lx .canvas{fill:var(--bg)}
    .lx .t-title{font-size:22px;font-weight:600;letter-spacing:-.01em}
    .lx .t-sub{font-size:13px;fill:var(--ink2)}
    .lx .t-h{font-size:14px;font-weight:600}
    .lx .t-b{font-size:12.5px;fill:var(--ink2)}
    .lx .t-s{font-size:11.5px;fill:var(--ink3)}
    .lx .t-flame{fill:var(--flame)} .lx .t-glass{fill:var(--glass)} .lx .t-patina{fill:var(--patina)} .lx .t-signal{fill:var(--signal)}
    .lx .node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .lx .node-guest{fill:var(--flame-soft);stroke:var(--flame);stroke-width:1.5}
    .lx .node-host{fill:var(--patina-soft);stroke:var(--patina);stroke-width:1.5}
    .lx .node-glass{fill:var(--glass-soft);stroke:var(--glass);stroke-width:1.5}
    .lx .node-deny{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.5}
    .lx .group{fill:var(--surface2);stroke:none}
    .lx .wall{fill:none;stroke:var(--glass);stroke-width:2.5}
    .lx .zone{fill:none;stroke:var(--ink3);stroke-width:1.25;stroke-dasharray:6 5}
    .lx .edge{fill:none;stroke:var(--ink2);stroke-width:1.5}
    .lx .edge-flame{fill:none;stroke:var(--flame);stroke-width:1.75}
    .lx .edge-glass{fill:none;stroke:var(--glass);stroke-width:1.75}
    .lx .edge-patina{fill:none;stroke:var(--patina);stroke-width:1.75}
    .lx .edge-deny{fill:none;stroke:var(--signal);stroke-width:1.75;stroke-dasharray:4 4}
    .lx .head{fill:var(--ink2)} .lx .head-flame{fill:var(--flame)} .lx .head-glass{fill:var(--glass)} .lx .head-patina{fill:var(--patina)} .lx .head-deny{fill:var(--signal)}
    .lx .dot-flame{fill:var(--flame)} .lx .dot-glass{fill:var(--glass)} .lx .dot-patina{fill:var(--patina)} .lx .dot-signal{fill:var(--signal)} .lx .dot-ink{fill:var(--ink3)}
  </style>
  <defs>
    <marker id="runtime-architecture-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 10 5 0 10z"/></marker>
    <marker id="runtime-architecture-af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-flame" d="M0 0 10 5 0 10z"/></marker>
    <marker id="runtime-architecture-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-glass" d="M0 0 10 5 0 10z"/></marker>
    <marker id="runtime-architecture-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-patina" d="M0 0 10 5 0 10z"/></marker>
    <marker id="runtime-architecture-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-deny" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="canvas" width="1200" height="760" rx="16"/>
  <text class="t-title" x="40" y="52">The control plane decides, the data plane runs the code</text>
  <text class="t-sub" x="40" y="76">One spawn request crosses a service-token gRPC hop, an isolation gate and a sandbox wall; every report comes back bound to the VM.</text>
  <rect class="zone" x="40" y="100" width="1120" height="150" rx="18"/>
  <text class="t-s" x="56" y="122">Control plane</text>
  <rect class="node" x="57" y="138" width="206" height="78" rx="10"/>
  <text class="t-h" x="73" y="164">Schedule and quota</text>
  <text class="t-b" x="73" y="184">402 over tenant cap</text>
  <text class="t-s mono" x="73" y="203">/v1/runtime/schedule</text>
  <rect class="node" x="277" y="138" width="206" height="78" rx="10"/>
  <text class="t-h" x="293" y="164">Instance identity</text>
  <text class="t-b" x="293" y="184">agent-instance JWT</text>
  <text class="t-s" x="293" y="203">bound to vm and tenant</text>
  <rect class="node" x="497" y="138" width="206" height="78" rx="10"/>
  <text class="t-h" x="513" y="164">Secret relay</text>
  <text class="t-b" x="513" y="184">verifies vm and tenant</text>
  <text class="t-s mono" x="513" y="203">/v1/runtime/secrets/…</text>
  <rect class="node" x="717" y="138" width="206" height="78" rx="10"/>
  <text class="t-h" x="733" y="164">Report ingestion</text>
  <text class="t-b" x="733" y="184">audit and logs</text>
  <text class="t-s mono" x="733" y="203">/v1/runtime/report</text>
  <rect class="node" x="937" y="138" width="206" height="78" rx="10"/>
  <text class="t-h" x="953" y="164">Receipt signer</text>
  <text class="t-b" x="953" y="184">Ed25519 over journal</text>
  <text class="t-s" x="953" y="203">externally verifiable</text>
  <path class="edge" d="M162 216V318" marker-end="url(#runtime-architecture-a)"/>
  <text class="t-s" x="172" y="262">gRPC, tenant_id in metadata</text>
  <rect class="zone" x="40" y="280" width="1120" height="420" rx="18"/>
  <text class="t-s" x="56" y="302">Data plane (your cluster or VPC)</text>
  <rect class="node-host" x="60" y="320" width="300" height="84" rx="10"/>
  <text class="t-h" x="76" y="346">runtime-scheduler</text>
  <text class="t-s mono" x="76" y="366">:50055 gRPC · :8085 REST</text>
  <text class="t-b" x="76" y="385">5-factor placement</text>
  <rect class="node-host" x="420" y="320" width="330" height="84" rx="10"/>
  <text class="t-h" x="436" y="346">runtime-manager (per node)</text>
  <text class="t-s mono" x="436" y="366">:50054 gRPC · RUNTIME_BACKEND=k8s</text>
  <text class="t-b" x="436" y="385">service-token authz on every call</text>
  <path class="edge-patina" d="M360 362H418" marker-end="url(#runtime-architecture-ap)"/>
  <text class="t-s" x="366" y="352">spawn</text>
  <rect class="node-host" x="420" y="440" width="330" height="96" rx="10"/>
  <text class="t-h" x="436" y="466">Isolation gate</text>
  <text class="t-b" x="436" y="486">choose_backend, then build_job re-checks</text>
  <text class="t-b" x="436" y="505">missing class: refused, never bare runc</text>
  <path class="edge-patina" d="M585 404V438" marker-end="url(#runtime-architecture-ap)"/>
  <rect class="node-host" x="420" y="572" width="330" height="100" rx="10"/>
  <text class="t-h" x="436" y="598">Hardened Job and Pod</text>
  <text class="t-b" x="436" y="618">runc · gVisor · Kata · Kata-CC by class</text>
  <text class="t-b" x="436" y="637">non-root, read-only rootfs, no SA token</text>
  <text class="t-b" x="436" y="656">default-deny egress policy first</text>
  <path class="edge-patina" d="M585 536V570" marker-end="url(#runtime-architecture-ap)"/>
  <path class="edge-patina" d="M600 320V216" marker-end="url(#runtime-architecture-ap)"/>
  <text class="t-s" x="610" y="262">secret relay</text>
  <path class="edge-patina" d="M735 320V216" marker-end="url(#runtime-architecture-ap)"/>
  <text class="t-s" x="745" y="262">report path</text>
  <rect class="wall" x="790" y="320" width="340" height="352" rx="18"/>
  <text class="t-h t-glass" x="810" y="346">Sandbox (the glass)</text>
  <text class="t-s" x="810" y="364">RuntimeClass pod, Kata VM or Firecracker</text>
  <rect class="node-host" x="820" y="384" width="280" height="104" rx="10"/>
  <text class="t-h" x="836" y="410">Harness (PID 1)</text>
  <text class="t-b" x="836" y="430">:3128 proxy, or vsock to host broker</text>
  <text class="t-b" x="836" y="449">secrets socket, SO_PEERCRED</text>
  <text class="t-b" x="836" y="468">heartbeats and reports up</text>
  <rect class="node-guest" x="820" y="522" width="280" height="88" rx="10"/>
  <text class="t-h" x="836" y="548">Agent workload</text>
  <text class="t-b" x="836" y="568">untrusted code</text>
  <text class="t-b" x="836" y="587">workload uid, filtered env</text>
  <path class="edge-flame" d="M960 488V520" marker-end="url(#runtime-architecture-af)"/>
  <path class="edge-glass" d="M750 622H788" marker-end="url(#runtime-architecture-ag)"/>
  <path class="edge-patina" d="M820 430H772V382H752" marker-end="url(#runtime-architecture-ap)"/>
  <g transform="translate(40 722)">
  <rect class="node" x="0" width="14" height="14" rx="3"/><text class="t-s" x="22" y="11">Control plane</text>
  <rect class="node-host" x="130" width="14" height="14" rx="3"/><text class="t-s" x="152" y="11">Trusted PAL infrastructure</text>
  <rect class="node-guest" x="362" width="14" height="14" rx="3"/><text class="t-s" x="384" y="11">Untrusted guest</text>
  <rect class="wall" x="512" width="14" height="14" rx="3"/><text class="t-s" x="534" y="11">Sandbox wall</text>
  <rect class="zone" x="642" width="14" height="14" rx="3"/><text class="t-s" x="664" y="11">Trust boundary</text>
  </g>
</svg>
