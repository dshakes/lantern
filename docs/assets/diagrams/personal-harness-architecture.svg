<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 836" class="lx" role="img" aria-labelledby="personal-harness-architecture-title personal-harness-architecture-desc">
  <title id="personal-harness-architecture-title">The personal harness runs five layers, with privacy rails around all of them</title>
  <desc id="personal-harness-architecture-desc">Layered architecture of the personal harness. Surfaces on top: iMessage, WhatsApp, voice, email and webchat. Five layers follow. Sense: device signals, Mac app usage, inbox ingestion and inbound messages. Remember: person graph, episodic memory, topic index, owner profile, presence and the life-events ledger. Reason: life-event engine, auto-act ladder, availability concierge, anticipation and scheduling. Sound like you: owner voice, language and dialect, bot-tell guards, pacing and draft-and-confirm with the claim verifier. Act: paced reply send, Mac actions, connectors and voice calls. A dashed band of safety and privacy rails sits under the layers: owner-only commands, location-leak guard, kill switch, local files at mode 0600, and secrets never logged. The control plane substrate at the bottom holds the LLM proxy and the people, memory, signals and life-events APIs.</desc>
  <style class="lx-style">
    .lx{--bg:#f2f5f8;--surface:#ffffff;--surface2:#e7edf3;--ink:#0f1b2d;--ink2:#44546a;--ink3:#5d6d83;--line:#c3cedb;--flame:#a85e06;--flame-soft:#fbebd3;--glass:#1c76a6;--glass-soft:#dcedf8;--patina:#17785f;--patina-soft:#d6efe7;--signal:#c23b29;--signal-soft:#f8deda}
    @media (prefers-color-scheme:dark){.lx{--bg:#0b1220;--surface:#111b2e;--surface2:#17243b;--ink:#e8eef5;--ink2:#a9b6c8;--ink3:#7a8aa2;--line:#2b3b57;--flame:#ffb547;--flame-soft:#3a2a12;--glass:#7cc4e8;--glass-soft:#13314a;--patina:#4fc1a6;--patina-soft:#123a33;--signal:#ff7262;--signal-soft:#3e1c1a}}
    .lx text{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
    .lx .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
    .lx .canvas{fill:var(--bg)}
    .lx .t-title{font-size:22px;font-weight:600;letter-spacing:-.01em}
    .lx .t-sub{font-size:13px;fill:var(--ink2)}
    .lx .t-h{font-size:14px;font-weight:600}
    .lx .t-b{font-size:12.5px;fill:var(--ink2)}
    .lx .t-s{font-size:11.5px;fill:var(--ink3)}
    .lx .t-flame{fill:var(--flame)} .lx .t-glass{fill:var(--glass)} .lx .t-patina{fill:var(--patina)} .lx .t-signal{fill:var(--signal)}
    .lx .node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
