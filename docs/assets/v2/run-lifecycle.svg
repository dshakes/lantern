<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Agent run lifecycle — every run passes auth, the budget gate, and the isolation gate, executes in the shared or microVM tier, journals every step, and ends with a signed receipt feeding the eval loop">
  <defs>
    <radialGradient id="rl-vign" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#201607" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#0a0908" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rl-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="rl-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="rl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a7d6b"/>
    </marker>
    <marker id="rl-arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="rl-arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <style>
      .t    { fill:#f5f0e8; }
      .sub  { fill:#a89e8f; font-size:11px; }
      .h    { fill:#fdf8ef; font-weight:700; }
      .code { fill:#fbbf24; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .mono { fill:#d8cfc0; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .band { fill:#d8cfc0; font-size:12px; font-weight:700; letter-spacing:.16em; }
      .rlflow { stroke-dasharray:6 6; animation:rl-dash 1.4s linear infinite; }
      @keyframes rl-dash { to { stroke-dashoffset:-24; } }
      @media (prefers-reduced-motion: reduce) { .rlflow { animation:none; } }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="760" rx="18" fill="#0a0908"/>
  <rect x="0" y="0" width="1240" height="760" rx="18" fill="url(#rl-vign)"/>
  <rect x="0" y="0" width="1240" height="760" rx="18" fill="none" stroke="#2a2118"/>

  <text x="32" y="46" class="h" font-size="24" filter="url(#rl-glow)">One run, end to end</text>
  <text x="300" y="46" class="sub" font-size="13">WhatsApp message or backend job — same gates, same journal, same receipt</text>

  <!-- ============ GATES ============ -->
  <text x="32" y="90" class="band" fill="#fbbf24">THREE GATES BEFORE A SINGLE TOKEN IS SPENT</text>
  <g transform="translate(32,102)">
    <rect x="0" y="0" width="256" height="72" rx="12" fill="#171310" stroke="#3a2f24"/>
    <text x="16" y="26" class="t" font-size="12.5" font-weight="700">Request</text>
    <text x="16" y="46" class="code">POST /v1/runs</text>
    <text x="16" y="62" class="sub">SDK · CLI · schedule · channel · A2A</text>

    <rect x="304" y="0" width="256" height="72" rx="12" fill="#171310" stroke="#3a2f24"/>
    <text x="320" y="26" class="t" font-size="12.5" font-weight="700">Auth + tenancy</text>
    <text x="320" y="46" class="sub">JWT / API key (<tspan class="code">hlx_live_</tspan>) · RBAC scopes</text>
    <text x="320" y="62" class="sub">every row carries tenant_id · RLS policies</text>

    <rect x="608" y="0" width="256" height="72" rx="12" fill="#1e1813" stroke="#f59e0b"/>
    <text x="624" y="26" class="t" font-size="12.5" font-weight="700">Budget gate</text>
    <text x="624" y="46" class="sub">forecast + hard-fail limits → <tspan class="code">HTTP 402</tspan></text>
    <text x="624" y="62" class="sub">cost/day · cost/run · tokens/day · tool rates</text>

    <rect x="912" y="0" width="264" height="72" rx="12" fill="#1e1813" stroke="#f59e0b" filter="url(#rl-glow)"/>
    <text x="928" y="26" class="t" font-size="12.5" font-weight="700">Isolation gate</text>
    <text x="928" y="46" class="code">manifest.isolation: shared | microvm</text>
    <text x="928" y="62" class="sub">declared at publish — never guessed at runtime</text>
  </g>
  <path class="rlflow" d="M 288 138 H 330" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#rl-arrA)"/>
  <path class="rlflow" d="M 592 138 H 634" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#rl-arrA)"/>
  <path class="rlflow" d="M 896 138 H 938" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#rl-arrA)"/>

  <!-- split from isolation gate to both tiers -->
  <path class="rlflow" d="M 1000 174 Q 900 216 340 240" stroke="#8a7d6b" stroke-width="1.4" fill="none" marker-end="url(#rl-arr)"/>
  <path class="rlflow" d="M 1090 174 Q 1080 210 980 240" stroke="#2dd4bf" stroke-width="1.4" fill="none" marker-end="url(#rl-arrT)"/>

  <!-- ============ TWO TIERS ============ -->
  <g transform="translate(32,246)">
    <rect x="0" y="0" width="564" height="190" rx="14" fill="#12100c" stroke="#4a3b28" stroke-width="1.5"/>
    <text x="20" y="30" class="t" font-size="13" font-weight="700">Shared tier — inline executor</text>
    <text x="20" y="52" class="sub">First-party agent logic in the control plane's process space</text>
    <text x="20" y="76" class="sub">· workflow interpreter (ai-step · tool · connector · condition · approval · loop · subagent)</text>
    <text x="20" y="94" class="sub">· capability-routed LLM calls — <tspan class="code">model: "auto"</tspan>, never a hardcoded vendor</text>
    <text x="20" y="112" class="sub">· confidence gate can divert risky steps to a human before they execute</text>
    <text x="20" y="130" class="sub">· approval nodes park WITHOUT compute — goroutine released, run status <tspan class="code">waiting</tspan></text>
    <text x="20" y="160" class="code">token streaming end-to-end: message_delta {seq} → message_completed {usage}</text>

    <rect x="612" y="0" width="564" height="190" rx="14" fill="#0e1512" stroke="#134e4a" stroke-width="1.5"/>
    <text x="632" y="30" class="t" font-size="13" font-weight="700">microVM tier — untrusted code <tspan class="sub" dx="8">(your VPC)</tspan></text>
    <text x="632" y="52" class="sub">runtime-scheduler <tspan class="mono">:50055</tspan> places → runtime-manager <tspan class="mono">:50054</tspan> spawns → harness runs it</text>
    <text x="632" y="76" class="sub">· fail-closed ladder: runc → gVisor → Kata → Firecracker · Wasm — never a bare pod</text>
    <text x="632" y="94" class="sub">· harness (PID 1): deny-default egress proxy · SO_PEERCRED secret vends · tool runner</text>
    <text x="632" y="112" class="sub">· step events + vm_exit stream back token-authenticated, bound to the VM's own run</text>
    <text x="632" y="130" class="sub">· crash? <tspan class="code">resumeMicroVMRun</tspan> re-drives (cap 3) — else honest <tspan class="code">microvm_resume_exhausted</tspan></text>
    <text x="632" y="160" class="code" fill="#2dd4bf">tier unavailable → run FAILS with microvm_unavailable — never silently downgraded</text>
  </g>

  <!-- both tiers → journal -->
  <path class="rlflow" d="M 314 436 V 470" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#rl-arrA)"/>
  <path class="rlflow" d="M 926 436 V 470" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#rl-arrT)"/>

  <!-- ============ JOURNAL + STATUS ============ -->
  <g transform="translate(32,476)">
    <rect x="0" y="0" width="1176" height="98" rx="14" fill="#1e1813" stroke="#f59e0b" stroke-width="1.5" filter="url(#rl-glow)"/>
    <text x="20" y="28" class="band" fill="#fbbf24" font-size="11">THE DURABILITY SPINE — journal_events (event-sourced, both tiers)</text>
    <text x="20" y="52" class="sub">every step: <tspan class="code">step_started → step_completed / step_failed / step_retrying / step_waiting</tspan> · run locks lease 60 s · recovery sweep every 30 s steals expired leases</text>
    <text x="20" y="72" class="sub">replay skips completed steps + dedups side effects — <tspan class="code">sha256(run|step|attempt)</tspan> idempotency — a crash never re-spends tokens or re-sends a webhook</text>
    <text x="20" y="90" class="code">status truth set: queued → running → succeeded · failed · waiting · cancelled</text>
  </g>

  <path class="rlflow" d="M 620 574 V 606" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#rl-arrA)"/>

  <!-- ============ EVIDENCE ============ -->
  <g transform="translate(32,612)">
    <rect x="0" y="0" width="376" height="104" rx="12" fill="#171310" stroke="#3a2f24"/>
    <text x="18" y="26" class="t" font-size="12.5" font-weight="700">Signed receipt</text>
    <text x="18" y="48" class="sub">SHA-256 chain over the full journal →</text>
    <text x="18" y="64" class="sub">Ed25519 signature · verify with no account</text>
    <text x="18" y="88" class="code">/proof · /.well-known/lantern-receipts</text>

    <rect x="400" y="0" width="376" height="104" rx="12" fill="#171310" stroke="#3a2f24"/>
    <text x="418" y="26" class="t" font-size="12.5" font-weight="700">Cost attribution</text>
    <text x="418" y="48" class="sub">tokensIn / tokensOut / costUsd on every call</text>
    <text x="418" y="64" class="sub">→ daily rollups → budget enforcement + forecasts</text>
    <text x="418" y="88" class="code">GET /v1/runs/{id} · /evaluations analytics</text>

    <rect x="800" y="0" width="376" height="104" rx="12" fill="#171310" stroke="#3a2f24"/>
    <text x="818" y="26" class="t" font-size="12.5" font-weight="700">The loop back</text>
    <text x="818" y="48" class="sub">feedback (1–5) + failed runs → rehearsals replay</text>
    <text x="818" y="64" class="sub">them against the next version · eval-in-CI gates</text>
    <text x="818" y="88" class="code">regression vs pinned baseline → HTTP 422</text>
  </g>

  <text x="32" y="746" class="sub">rest.go inline executor · workflow/interpreter.go · recovery.go · runtime_report.go · receipts.go · rehearse.go</text>
</svg>
