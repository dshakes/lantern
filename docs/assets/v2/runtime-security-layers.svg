<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lantern runtime defense-in-depth — concentric isolation, the five non-negotiables, and the trust boundaries">
  <defs>
    <radialGradient id="lgv" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#201607" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#0a0908" stop-opacity="0"/>
    </radialGradient>
    <filter id="lgg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t   { fill:#f5f0e8; }
      .sub { fill:#a89e8f; font-size:11px; }
      .h   { fill:#fdf8ef; font-weight:700; }
      .band{ fill:#d8cfc0; font-size:12px; font-weight:700; letter-spacing:.14em; }
      .item{ fill:#d8cfc0; font-size:10.5px; }
      .grn { fill:#2dd4bf; }
      .amb { fill:#fbbf24; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="660" rx="16" fill="#0a0908"/>
  <rect x="0" y="0" width="1280" height="660" rx="16" fill="url(#lgv)"/>
  <rect x="0" y="0" width="1280" height="660" rx="16" fill="none" stroke="#2a2118"/>

  <text x="32" y="44" class="h" font-size="22" filter="url(#lgg)">Runtime defense-in-depth</text>
  <text x="330" y="44" class="sub" font-size="12.5">every ring must be crossed · every control fails closed</text>

  <!-- concentric defense rings (left) -->
  <text x="32" y="92" class="band">CONCENTRIC ISOLATION</text>
  <g transform="translate(40,108)">
    <rect x="0" y="0" width="372" height="372" rx="14" fill="#0c1512" stroke="#1f5c4e"/>
    <text x="186" y="26" class="t" font-size="11.5" font-weight="700" text-anchor="middle">customer VPC / data plane</text>

    <rect x="28" y="42" width="316" height="300" rx="12" fill="#0c1512" stroke="#1f5c4e"/>
    <text x="186" y="64" class="sub" font-size="10.5" text-anchor="middle">per-tenant K8s namespace</text>

    <rect x="56" y="82" width="260" height="240" rx="10" fill="#12100c" stroke="#4a3b28"/>
    <text x="186" y="104" class="sub" font-size="10.5" text-anchor="middle">deny-default network policy</text>

    <rect x="86" y="122" width="200" height="180" rx="10" fill="#1b1430" stroke="#7e22ce"/>
    <text x="186" y="144" class="sub" font-size="10.5" text-anchor="middle">sandbox — gVisor / Kata microVM</text>

    <rect x="114" y="178" width="144" height="108" rx="9" fill="#1e1533" stroke="#7e22ce"/>
    <text x="186" y="210" class="t" font-size="10.5" font-weight="700" text-anchor="middle">workload</text>
    <text x="186" y="232" class="sub" font-size="9" text-anchor="middle">non-root · read-only rootfs</text>
    <text x="186" y="248" class="sub" font-size="9" text-anchor="middle">egress allowlist only</text>
  </g>

  <!-- five non-negotiables (middle) -->
  <text x="436" y="92" class="band">THE FIVE NON-NEGOTIABLES</text>
  <g transform="translate(436,108)">
    <rect x="0" y="0" width="406" height="86" rx="10" fill="#12100c" stroke="#4a3b28"/>
    <text x="14" y="24" class="t" font-size="11.5" font-weight="700">1 · Governance</text>
    <g class="item" transform="translate(14,38)">
      <text x="0" y="10"><tspan class="grn">▪</tspan> per-instance identity on every audit row + secret vend</text>
      <text x="0" y="28"><tspan class="grn">▪</tspan> Ed25519 receipts, externally verifiable</text>
    </g>

    <rect x="0" y="98" width="406" height="86" rx="10" fill="#12100c" stroke="#4a3b28"/>
    <text x="14" y="122" class="t" font-size="11.5" font-weight="700">2 · Security</text>
    <g class="item" transform="translate(14,136)">
      <text x="0" y="10"><tspan class="grn">▪</tspan> untrusted code never on a bare pod — fail-closed gate</text>
      <text x="0" y="28"><tspan class="grn">▪</tspan> deny-default egress · secrets short-TTL, never logged</text>
    </g>

    <rect x="0" y="196" width="406" height="60" rx="10" fill="#12100c" stroke="#4a3b28"/>
    <text x="14" y="220" class="t" font-size="11.5" font-weight="700">3 · Scalability</text>
    <text x="14" y="242" class="item"><tspan class="grn">▪</tspan> warm pools · snapshot restore · per-tenant spawn caps</text>

    <rect x="0" y="268" width="406" height="60" rx="10" fill="#12100c" stroke="#4a3b28"/>
    <text x="14" y="292" class="t" font-size="11.5" font-weight="700">4 · Resiliency</text>
    <text x="14" y="314" class="item"><tspan class="grn">▪</tspan> journal replay · side-effect dedup · scheduler HA</text>

    <rect x="0" y="340" width="406" height="60" rx="10" fill="#12100c" stroke="#4a3b28"/>
    <text x="14" y="364" class="t" font-size="11.5" font-weight="700">5 · Observability</text>
    <text x="14" y="386" class="item"><tspan class="grn">▪</tspan> OTel GenAI spans · loop, cost, and eval signals</text>
  </g>

  <!-- trust boundary callouts (right) -->
  <text x="868" y="92" class="band">TRUST BOUNDARIES</text>
  <g transform="translate(868,108)">
    <rect x="0" y="0" width="380" height="118" rx="10" fill="#161207" stroke="#6b5420"/>
    <text x="14" y="24" class="t" font-size="11.5" font-weight="700">What is treated as untrusted</text>
    <g class="item" transform="translate(14,38)">
      <text x="0" y="10">▪ the in-VM harness — a hostile agent may lie</text>
      <text x="0" y="28">▪ caller-supplied env — tenant comes from auth</text>
      <text x="0" y="46">▪ forwarded headers — limiter trusts the TCP peer</text>
      <text x="0" y="64" class="sub" font-size="10">every report is bound to the VM's own identity</text>
    </g>

    <rect x="0" y="130" width="380" height="100" rx="10" fill="#161207" stroke="#6b5420"/>
    <text x="14" y="154" class="t" font-size="11.5" font-weight="700">Fail-closed by default</text>
    <g class="item" transform="translate(14,168)">
      <text x="0" y="10"><tspan class="grn">▪</tspan> secret relay refuses when its token is unset</text>
      <text x="0" y="28"><tspan class="grn">▪</tspan> isolation gate refuses, never downgrades</text>
      <text x="0" y="46"><tspan class="grn">▪</tspan> egress proxy denies all until allowlisted</text>
    </g>
  </g>

  <!-- standards footer — names only -->
  <g transform="translate(32,540)">
    <rect x="0" y="0" width="1216" height="84" rx="12" fill="#161207" stroke="#6b5420"/>
    <text x="16" y="28" class="h" font-size="12.5">Built against the forcing functions</text>
    <text x="16" y="52" class="item">OWASP Agentic Top-10 · EU AI Act event logging &amp; oversight · IETF agent audit trails · OTel GenAI semconv</text>
    <text x="16" y="70" class="sub" font-size="10.5">prompt injection is unsolved at the model layer — the runtime is the defense</text>
  </g>
</svg>
