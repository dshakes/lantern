<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lantern architecture — channels and clients into a Go/Rust control plane, over an outbound-only token-authenticated tunnel into the data plane in your VPC">
  <defs>
    <radialGradient id="la-vign" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#201607" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#0a0908" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="la-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="la-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="la-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a7d6b"/>
    </marker>
    <marker id="la-arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="la-arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <style>
      .t    { fill:#f5f0e8; }
      .sub  { fill:#a89e8f; font-size:11px; }
      .h    { fill:#fdf8ef; font-weight:700; }
      .code { fill:#fbbf24; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .mono { fill:#d8cfc0; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .band { fill:#d8cfc0; font-size:12px; font-weight:700; letter-spacing:.16em; }
      .lang { font-size:9.5px; font-weight:800; letter-spacing:.04em; }
      .laflow { stroke-dasharray:6 6; animation:la-dash 1.4s linear infinite; }
      @keyframes la-dash { to { stroke-dashoffset:-24; } }
      @media (prefers-reduced-motion: reduce) { .laflow { animation:none; } }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="940" rx="18" fill="#0a0908"/>
  <rect x="0" y="0" width="1240" height="940" rx="18" fill="url(#la-vign)"/>
  <rect x="0" y="0" width="1240" height="940" rx="18" fill="none" stroke="#2a2118"/>

  <text x="32" y="46" class="h" font-size="24" filter="url(#la-glow)">🏮 Lantern</text>
  <text x="180" y="46" class="sub" font-size="13">production runtime for AI agents · control plane orchestrates, YOUR cloud executes</text>
  <g transform="translate(1024,30)">
    <rect x="0" y="0" width="13" height="13" rx="3" fill="#38bdf8"/><text x="19" y="11" class="sub">Go</text>
    <rect x="56" y="0" width="13" height="13" rx="3" fill="#f97316"/><text x="75" y="11" class="sub">Rust</text>
    <rect x="120" y="0" width="13" height="13" rx="3" fill="#2dd4bf"/><text x="139" y="11" class="sub">your VPC</text>
  </g>

  <!-- ============ CHANNELS ============ -->
  <text x="32" y="88" class="band" fill="#fbbf24">WHERE AGENTS MEET PEOPLE</text>
  <g transform="translate(32,100)">
    <rect x="0" y="0" width="700" height="62" rx="12" fill="#171310" stroke="#3a2f24"/>
    <text x="18" y="25" class="t" font-size="12.5" font-weight="700">Channels — your users' actual apps</text>
    <text x="18" y="46" class="sub">WhatsApp · iMessage · Slack · Discord · Telegram · Voice (Twilio / LiveKit) · Webchat /widget.js · Email</text>
    <rect x="724" y="0" width="452" height="62" rx="12" fill="#171310" stroke="#3a2f24"/>
    <text x="742" y="25" class="t" font-size="12.5" font-weight="700">Builders</text>
    <text x="742" y="46" class="sub">SDKs (TS · Python · Go) · lantern CLI (onboard / agents dev) · Dashboard · A2A peers</text>
  </g>

  <!-- ============ GATEWAYS ============ -->
  <g transform="translate(32,192)">
    <rect x="0" y="0" width="576" height="56" rx="12" fill="#1e1813" stroke="#3a2f24"/>
    <text x="18" y="24" class="t" font-size="12.5" font-weight="700">surface-gateway <tspan class="lang" fill="#f97316">RUST</tspan><tspan class="mono" dx="180">:8444</tspan></text>
    <text x="18" y="43" class="sub">inbound webhooks · signature verification · normalization</text>
    <rect x="600" y="0" width="576" height="56" rx="12" fill="#1e1813" stroke="#3a2f24"/>
    <text x="618" y="24" class="t" font-size="12.5" font-weight="700">gateway <tspan class="lang" fill="#f97316">RUST</tspan><tspan class="mono" dx="280">:8443 TLS</tspan></text>
    <text x="618" y="43" class="sub">JWT / API-key auth (hlx_live_) · rate limiting · end-to-end streaming</text>
  </g>
  <path class="laflow" d="M 380 162 V 186" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#la-arrA)"/>
  <path class="laflow" d="M 950 162 V 186" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#la-arrA)"/>

  <!-- ============ CONTROL PLANE ============ -->
  <text x="32" y="292" class="band" fill="#fbbf24">CONTROL PLANE — ORCHESTRATION, NEVER USER CODE</text>
  <g transform="translate(32,304)">
    <rect x="0" y="0" width="1176" height="252" rx="14" fill="#12100c" stroke="#4a3b28" stroke-width="1.5"/>
    <rect x="20" y="18" width="564" height="86" rx="12" fill="#1e1813" stroke="#f59e0b" filter="url(#la-glow)"/>
    <text x="38" y="44" class="t" font-size="13" font-weight="700">control-plane <tspan class="lang" fill="#38bdf8">GO</tspan><tspan class="mono" dx="220">:8080 REST · :50051 gRPC</tspan></text>
    <text x="38" y="66" class="sub">agents · runs · sessions · budgets (402) · forecasts · evals · experiments · marketplace</text>
    <text x="38" y="84" class="sub">MCP registry · A2A cards · receipts · memory + people graph · auth/RBAC · RLS multi-tenancy</text>

    <rect x="604" y="18" width="278" height="86" rx="12" fill="#1e1813" stroke="#3a2f24"/>
    <text x="622" y="44" class="t" font-size="12.5" font-weight="700">workflow-engine <tspan class="lang" fill="#38bdf8">GO</tspan></text>
    <text x="622" y="63" class="mono">:50052</text>
    <text x="622" y="82" class="sub">durable steps · event-sourced journal</text>

    <rect x="902" y="18" width="254" height="86" rx="12" fill="#1e1813" stroke="#3a2f24"/>
    <text x="920" y="44" class="t" font-size="12.5" font-weight="700">model-router <tspan class="lang" fill="#f97316">RUST</tspan></text>
    <text x="920" y="63" class="mono">:50053 · model: "auto"</text>
    <text x="920" y="82" class="sub">capability routing · 4 strategies</text>

    <g transform="translate(20,120)">
      <rect x="0" y="0" width="276" height="54" rx="10" fill="#171310" stroke="#3a2f24"/>
      <text x="16" y="22" class="t" font-size="12" font-weight="700">scheduler <tspan class="lang" fill="#38bdf8">GO</tspan></text>
      <text x="16" y="41" class="sub">tz-aware cron · loop-agent cadences</text>
      <rect x="296" y="0" width="276" height="54" rx="10" fill="#171310" stroke="#3a2f24"/>
      <text x="312" y="22" class="t" font-size="12" font-weight="700">memory <tspan class="lang" fill="#38bdf8">GO</tspan></text>
      <text x="312" y="41" class="sub">people graph · distillates · pgvector</text>
      <rect x="592" y="0" width="276" height="54" rx="10" fill="#171310" stroke="#3a2f24"/>
      <text x="608" y="22" class="t" font-size="12" font-weight="700">notifier <tspan class="lang" fill="#38bdf8">GO</tspan></text>
      <text x="608" y="41" class="sub">webhooks · email · Slack · push</text>
      <rect x="888" y="0" width="268" height="54" rx="10" fill="#171310" stroke="#3a2f24"/>
      <text x="904" y="22" class="t" font-size="12" font-weight="700">billing <tspan class="lang" fill="#38bdf8">GO</tspan></text>
      <text x="904" y="41" class="sub">usage metering · budget rollups</text>
    </g>

    <rect x="20" y="188" width="1136" height="46" rx="10" fill="#161207" stroke="#6b5420"/>
    <text x="38" y="207" class="t" font-size="12" font-weight="700">System of record</text>
    <text x="38" y="226" class="sub">Postgres (tenant-fenced rows) · Redis (live events) · S3 (bundles + snapshots)</text>
  </g>

  <!-- ============ TUNNEL ============ -->
  <g transform="translate(430,584)">
    <rect x="0" y="0" width="380" height="46" rx="23" fill="#0d1f1c" stroke="#2dd4bf" stroke-width="1.5" filter="url(#la-glow)"/>
    <text x="190" y="20" text-anchor="middle" class="t" font-size="11.5" font-weight="700" fill="#5eead4">OUTBOUND-ONLY · TOKEN-AUTHENTICATED</text>
    <text x="190" y="37" text-anchor="middle" class="sub">metadata only — prompts and data never leave your VPC</text>
  </g>
  <path class="laflow" d="M 620 556 V 580" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#la-arrT)"/>
  <path class="laflow" d="M 620 630 V 654" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#la-arrT)"/>

  <!-- ============ DATA PLANE ============ -->
  <text x="32" y="676" class="band" fill="#5eead4">DATA PLANE — YOUR CLOUD (EKS · GKE · AKS · LAPTOP)</text>
  <g transform="translate(32,688)">
    <rect x="0" y="0" width="1176" height="152" rx="14" fill="#0c1512" stroke="#1f5c4e" stroke-width="1.5"/>
    <rect x="20" y="18" width="360" height="116" rx="12" fill="#101c18" stroke="#2a4a40"/>
    <text x="38" y="44" class="t" font-size="12.5" font-weight="700">runtime-scheduler <tspan class="lang" fill="#38bdf8">GO</tspan><tspan class="mono" dx="90">:50055</tspan></text>
    <text x="38" y="66" class="sub">HA leader election · 5-factor placement:</text>
    <text x="38" y="84" class="sub">warm-pool · region · fair-share · cost · health</text>
    <text x="38" y="106" class="sub">per-tenant quota + spawn rate limits (402/429)</text>

    <rect x="400" y="18" width="360" height="116" rx="12" fill="#101c18" stroke="#2a4a40"/>
    <text x="418" y="44" class="t" font-size="12.5" font-weight="700">runtime-manager <tspan class="lang" fill="#f97316">RUST</tspan><tspan class="mono" dx="90">:50054</tspan></text>
    <text x="418" y="66" class="sub">fail-closed isolation gate — never a bare pod:</text>
    <text x="418" y="84" class="mono">runc → gVisor → Kata → Firecracker · Wasm</text>
    <text x="418" y="106" class="sub">snapshot / restore · warm pools · per-node</text>

    <rect x="780" y="18" width="376" height="116" rx="12" fill="#151022" stroke="#7e22ce"/>
    <text x="798" y="44" class="t" font-size="12.5" font-weight="700">microVM workload · harness <tspan class="lang" fill="#f97316">RUST</tspan> PID 1</text>
    <text x="798" y="66" class="sub">in-guest tool runner (shell_exec · http_fetch)</text>
    <text x="798" y="84" class="sub">deny-default egress allowlist · SO_PEERCRED secrets</text>
    <text x="798" y="106" class="sub">session-scoped VM reuse · step events → journal</text>
  </g>

  <text x="32" y="890" class="sub">The invariants: no user code in the control plane · durable steps · tenant-fenced rows · isolation fails closed</text>
</svg>
