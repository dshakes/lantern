<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" class="lx" role="img" aria-labelledby="tpl-title tpl-desc">
  <title id="tpl-title">Diagram template</title>
  <desc id="tpl-desc">Reference for the Lantern diagram system: node roles, edges, the microVM wall, a trust zone and the legend.</desc>
  <!-- lx-style v1: copy this <style> block verbatim into every diagram. Do not edit values per file. -->
  <style class="lx-style">
    .lx{--bg:#f2f5f8;--surface:#ffffff;--surface2:#e7edf3;--ink:#0f1b2d;--ink2:#44546a;--ink3:#5d6d83;--line:#c3cedb;--flame:#a85e06;--flame-soft:#fbebd3;--glass:#1c76a6;--glass-soft:#dcedf8;--patina:#17785f;--patina-soft:#d6efe7;--signal:#c23b29;--signal-soft:#f8deda}
    @media (prefers-color-scheme:dark){.lx{--bg:#0b1220;--surface:#111b2e;--surface2:#17243b;--ink:#e8eef5;--ink2:#a9b6c8;--ink3:#7a8aa2;--line:#2b3b57;--flame:#ffb547;--flame-soft:#3a2a12;--glass:#7cc4e8;--glass-soft:#13314a;--patina:#4fc1a6;--patina-soft:#123a33;--signal:#ff7262;--signal-soft:#3e1c1a}}
    .lx text{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
    .lx .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
    .lx .canvas{fill:var(--bg)}
    .lx .t-title{font-size:22px;font-weight:600;letter-spacing:-.01em}
    .lx .t-sub{font-size:13px;fill:var(--ink2)}
    .lx .t-h{font-size:14px;font-weight:600}
    .lx .t-b{font-size:12.5px;fill:var(--ink2)}
    .lx .t-s{font-size:11.5px;fill:var(--ink3)}
    .lx .t-flame{fill:var(--flame)} .lx .t-glass{fill:var(--glass)} .lx .t-patina{fill:var(--patina)} .lx .t-signal{fill:var(--signal)}
    .lx .node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .lx .node-guest{fill:var(--flame-soft);stroke:var(--flame);stroke-width:1.5}
    .lx .node-host{fill:var(--patina-soft);stroke:var(--patina);stroke-width:1.5}
    .lx .node-glass{fill:var(--glass-soft);stroke:var(--glass);stroke-width:1.5}
    .lx .node-deny{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.5}
    .lx .group{fill:var(--surface2);stroke:none}
    .lx .wall{fill:none;stroke:var(--glass);stroke-width:2.5}
    .lx .zone{fill:none;stroke:var(--ink3);stroke-width:1.25;stroke-dasharray:6 5}
    .lx .edge{fill:none;stroke:var(--ink2);stroke-width:1.5}
    .lx .edge-flame{fill:none;stroke:var(--flame);stroke-width:1.75}
    .lx .edge-glass{fill:none;stroke:var(--glass);stroke-width:1.75}
    .lx .edge-patina{fill:none;stroke:var(--patina);stroke-width:1.75}
    .lx .edge-deny{fill:none;stroke:var(--signal);stroke-width:1.75;stroke-dasharray:4 4}
    .lx .head{fill:var(--ink2)} .lx .head-flame{fill:var(--flame)} .lx .head-glass{fill:var(--glass)} .lx .head-patina{fill:var(--patina)} .lx .head-deny{fill:var(--signal)}
    .lx .dot-flame{fill:var(--flame)} .lx .dot-glass{fill:var(--glass)} .lx .dot-patina{fill:var(--patina)} .lx .dot-signal{fill:var(--signal)} .lx .dot-ink{fill:var(--ink3)}
  </style>
  <defs>
    <!-- every id is prefixed with the file name (here "tpl-"; in a real diagram "<file-name>-") so inlined SVGs never collide -->
    <marker id="tpl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 10 5 0 10z"/></marker>
    <marker id="tpl-af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-flame" d="M0 0 10 5 0 10z"/></marker>
    <marker id="tpl-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-glass" d="M0 0 10 5 0 10z"/></marker>
    <marker id="tpl-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-patina" d="M0 0 10 5 0 10z"/></marker>
    <marker id="tpl-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-deny" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="canvas" width="1200" height="560" rx="16"/>
  <text class="t-title" x="40" y="52">Title states the claim, in sentence case</text>
  <text class="t-sub" x="40" y="76">One subtitle line that says what to look at.</text>

  <!-- trust zone -->
  <rect class="zone" x="40" y="110" width="520" height="330" rx="18"/>
  <text class="t-s" x="56" y="132">Trust zone label (dashed = trust boundary)</text>

  <!-- neutral control-plane node -->
  <rect class="node" x="70" y="160" width="200" height="64" rx="10"/>
  <text class="t-h" x="86" y="186">Control plane node</text>
  <text class="t-b mono" x="86" y="206">service:port</text>

  <!-- host node -->
  <rect class="node-host" x="320" y="160" width="200" height="64" rx="10"/>
  <text class="t-h" x="336" y="186">Host / trusted</text>
  <text class="t-b" x="336" y="206">runtime-manager, broker</text>

  <path class="edge" d="M270 192H318" marker-end="url(#tpl-a)"/>

  <!-- microVM wall with guest inside -->
  <rect class="wall" x="640" y="110" width="500" height="330" rx="18"/>
  <text class="t-h t-glass" x="660" y="136">microVM (the glass)</text>
  <rect class="node-guest" x="680" y="170" width="200" height="64" rx="10"/>
  <text class="t-h" x="696" y="196">Guest workload</text>
  <text class="t-b" x="696" y="216">untrusted code</text>
  <rect class="node-deny" x="910" y="170" width="200" height="64" rx="10"/>
  <text class="t-h" x="926" y="196">Denied</text>
  <text class="t-b" x="926" y="216">refused, fail-closed</text>
  <path class="edge-flame" d="M780 234V300H520V226" marker-end="url(#tpl-af)"/>
  <path class="edge-deny" d="M880 202H908" marker-end="url(#tpl-ad)"/>

  <!-- legend: always bottom-left, only the roles this diagram uses -->
  <g transform="translate(40 500)">
    <rect class="node" width="14" height="14" rx="3"/><text class="t-s" x="22" y="11">Control plane</text>
    <rect class="node-host" x="130" width="14" height="14" rx="3"/><text class="t-s" x="152" y="11">Trusted host</text>
    <rect class="node-guest" x="256" width="14" height="14" rx="3"/><text class="t-s" x="278" y="11">Untrusted guest</text>
    <rect class="wall" x="396" width="14" height="14" rx="3"/><text class="t-s" x="418" y="11">microVM wall</text>
    <rect class="zone" x="520" width="14" height="14" rx="3"/><text class="t-s" x="542" y="11">Trust boundary</text>
    <rect class="node-deny" x="650" width="14" height="14" rx="3"/><text class="t-s" x="672" y="11">Denied</text>
  </g>
</svg>
