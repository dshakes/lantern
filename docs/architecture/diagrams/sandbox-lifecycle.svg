<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Sandbox lifecycle — running to paused via snapshot and stop, resume with re-identify and a fresh exec token, and fork into N children each with a fresh identity">
  <defs>
    <marker id="sl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="sl-arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
    <marker id="sl-arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .t    { fill:#e2e8f0; }
      .sub  { fill:#94a3b8; font-size:11px; }
      .h    { fill:#f8fafc; font-weight:700; }
      .port { fill:#cbd5e1; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .code { fill:#93c5fd; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .band { fill:#cbd5e1; font-size:12px; font-weight:700; letter-spacing:.14em; }
      .lang { font-size:10px; font-weight:700; }
      .edge { fill:#94a3b8; font-size:10.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="680" rx="16" fill="#0b1120"/>
  <rect x="0" y="0" width="1240" height="680" rx="16" fill="none" stroke="#1e293b"/>

  <text x="32" y="44" class="h" font-size="22">Sandbox Lifecycle</text>
  <text x="225" y="44" class="sub" font-size="13">pause · resume · fork · one identity per VM incarnation · ADR 0025</text>

  <!-- ============ PAUSE / RESUME ============ -->
  <text x="32" y="82" class="band">PAUSE / RESUME</text>

  <g transform="translate(40,100)">
    <rect x="0" y="0" width="170" height="70" rx="12" fill="#10241b" stroke="#2f9e6e" stroke-width="1.5"/>
    <text x="85" y="30" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#6ee7b7">running</text>
    <text x="85" y="50" text-anchor="middle" class="sub">holds a quota slot</text>
  </g>

  <g transform="translate(800,100)">
    <rect x="0" y="0" width="170" height="70" rx="12" fill="#241a37" stroke="#5b3fa8" stroke-width="1.5"/>
    <text x="85" y="30" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#c4b5fd">paused</text>
    <text x="85" y="50" text-anchor="middle" class="sub">snapshot_id recorded · no slot</text>
  </g>

  <g transform="translate(270,92)">
    <rect x="0" y="0" width="470" height="86" rx="10" fill="#11182a" stroke="#334155"/>
    <text x="16" y="23" class="t" font-size="12.5" font-weight="700">pause <tspan class="code" dx="10">POST /v1/runtime/vms/&#123;id&#125;/pause</tspan></text>
    <text x="16" y="43" class="sub">manager <tspan class="code">Snapshot</tspan> (memory + vmstate → snapshot store), then <tspan class="code">Stop</tspan></text>
    <text x="16" y="61" class="sub">snapshot recorded under the VM's tenant · quota slot freed</text>
    <text x="16" y="78" class="sub">the pinned cert for the old incarnation is dropped on Stop</text>
  </g>
  <path d="M 210 135 H 268" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#sl-arr)"/>
  <path d="M 740 135 H 798" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#sl-arrp)"/>

  <g transform="translate(270,215)">
    <rect x="0" y="0" width="470" height="146" rx="10" fill="#171226" stroke="#5b3fa8"/>
    <text x="16" y="23" class="t" font-size="12.5" font-weight="700">resume <tspan class="code" dx="10">POST /v1/runtime/vms/&#123;id&#125;/resume</tspan></text>
    <text x="16" y="43" class="sub">402 no quota · 409 not paused · <tspan class="code">Spawn</tspan> with same vm_id + <tspan class="code">restore_snapshot_id</tspan></text>
    <text x="16" y="62" class="sub">manager: fresh /30 + TAP · new cert (pinned) · new <tspan class="code">certs.img</tspan> + spawn.json</text>
    <text x="16" y="80" class="sub">fresh exec token minted per incarnation — the previous token is rejected</text>
    <text x="16" y="98" class="sub">harness re-identify: cert drive UUID changes → swap cert, vm_id, secrets, eth0</text>
    <text x="16" y="116" class="sub">scheduler reconcile: restored incarnation gets the dispatch grace window again</text>
    <text x="16" y="134" class="sub">(90s) before an unreported VM can be reaped</text>
  </g>
  <path d="M 885 172 V 288 H 742" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#sl-arrp)"/>
  <path d="M 268 288 H 125 V 172" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#sl-arrg)"/>
  <text x="258" y="306" class="edge" text-anchor="end">same vm_id · state = running</text>

  <!-- ============ FORK ============ -->
  <text x="32" y="408" class="band">FORK</text>
  <text x="100" y="408" class="sub">POST /v1/runtime/vms/&#123;id&#125;/fork  &#123;"count": N&#125;  ·  N = 1..10</text>

  <g transform="translate(40,470)">
    <rect x="0" y="0" width="170" height="64" rx="12" fill="#10241b" stroke="#2f9e6e" stroke-width="1.5"/>
    <text x="85" y="28" text-anchor="middle" class="t" font-size="12.5" font-weight="700" fill="#6ee7b7">source VM</text>
    <text x="85" y="47" text-anchor="middle" class="sub">running or paused</text>
  </g>
  <path d="M 210 502 H 258" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#sl-arr)"/>

  <g transform="translate(260,466)">
    <rect x="0" y="0" width="210" height="72" rx="10" fill="#11182a" stroke="#334155"/>
    <text x="16" y="24" class="t" font-size="12.5" font-weight="700">snapshot</text>
    <text x="16" y="44" class="sub">one <tspan class="code">snapshot_id</tspan>, tenant-owned</text>
    <text x="16" y="60" class="sub">other tenant → NOT_FOUND</text>
  </g>

  <path d="M 470 502 C 520 502 520 436 560 436" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#sl-arrp)"/>
  <path d="M 470 502 C 520 502 520 502 560 502" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#sl-arrp)"/>
  <path d="M 470 502 C 520 502 520 568 560 568" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#sl-arrp)"/>

  <g transform="translate(562,414)">
    <rect x="0" y="0" width="646" height="44" rx="10" fill="#241a37" stroke="#5b3fa8"/>
    <text x="16" y="19" class="t" font-size="12" font-weight="700">fork 1 · new vm_id</text>
    <text x="16" y="36" class="sub">own cert · agent identity token · exec token · /30 + TAP · parent_vm_id = source</text>
  </g>
  <g transform="translate(562,480)">
    <rect x="0" y="0" width="646" height="44" rx="10" fill="#241a37" stroke="#5b3fa8"/>
    <text x="16" y="19" class="t" font-size="12" font-weight="700">fork 2 · new vm_id</text>
    <text x="16" y="36" class="sub">own cert · agent identity token · exec token · /30 + TAP · parent_vm_id = source</text>
  </g>
  <g transform="translate(562,546)">
    <rect x="0" y="0" width="646" height="44" rx="10" fill="#241a37" stroke="#5b3fa8"/>
    <text x="16" y="19" class="t" font-size="12" font-weight="700">fork N · new vm_id</text>
    <text x="16" y="36" class="sub">each child fails or succeeds on its own — per-fork <tspan class="code">state</tspan> / <tspan class="code">error</tspan> in the response</text>
  </g>

  <!-- ============ NOTES ============ -->
  <g transform="translate(32,610)">
    <rect x="0" y="0" width="1176" height="42" rx="10" fill="#2a1420" stroke="#9f3860"/>
    <text x="20" y="18" class="sub"><tspan font-weight="700" fill="#fda4af">Fail-closed</tspan> · a cert frozen in a snapshot has the right CN but a superseded fingerprint — Heartbeat / VendSecret / Report refuse it.</text>
    <text x="20" y="34" class="sub">Fork of a RUNNING VM on bare Firecracker is refused (needs the jailer; network_overrides needs Firecracker ≥ 1.12). Not yet measured on KVM.</text>
  </g>

  <text x="32" y="672" class="sub">docs/adr/0025-sandbox-spawn-contract-and-manager-authz.md · docs/architecture/04b-microvm-productionization.md</text>
</svg>
